<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernheft</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root,[data-th=abend]{--bg:#0f1b2e;--pn:#15253d;--pn2:#1b2f4d;--dk:#0b1424;--bd:#2c4468;--tx:#e4ebf7;--mu:#8fa3c4;--ac:#ff8a3d;--pu:#6fb1ff;--ok:#5fd0a0;--er:#ff6b6b;--am:#ffc266;--on:#0b1424;--hd:#ff8a3d}
[data-th=tag]{--bg:#e6edf7;--pn:#fff;--pn2:#f1f5fb;--dk:#e3ebf7;--bd:#c5d3e8;--tx:#14243d;--mu:#5d6f8f;--ac:#e8590c;--pu:#1f5fbf;--ok:#1a7f4b;--er:#c92a3a;--am:#b85a00;--on:#fff;--hd:#1a4fa3}
[data-th=meer]{--bg:#0d3157;--pn:#144a7d;--pn2:#1b5a95;--dk:#0d3157;--bd:#3a76b8;--tx:#f1f6fd;--mu:#b3cdea;--ac:#ffa94d;--pu:#ffd8a8;--ok:#8ce99a;--er:#ff9a9a;--am:#ffd43b;--on:#0d3157;--hd:#ffa94d}
*{box-sizing:border-box}
body{margin:0;font:17px/1.65 system-ui,Segoe UI,sans-serif;color:var(--tx);background:var(--bg)}
h1,h2,h3,.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:700;color:var(--hd)}
h1{font-size:2rem;margin:.4em 0}h2{font-size:1.3rem;color:var(--tx)}h3{font-size:1.1rem;margin:1.2em 0 .3em;color:var(--pu)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--dk);border-bottom:3px solid var(--ac)}
header a{color:var(--tx);text-decoration:none;font:600 1rem 'JetBrains Mono',ui-monospace,monospace}
#xp{border:1px solid var(--am);color:var(--am);padding:1px 12px;border-radius:6px;font:600 .9rem 'JetBrains Mono',ui-monospace,monospace}
main{max-width:920px;margin:24px auto;padding:8px 28px 40px;background:var(--pn);border:1px solid var(--bd);border-radius:10px}
@media(min-width:960px){main{margin:32px auto}}
a{color:var(--ac)}
.bc{font:.85rem 'JetBrains Mono',ui-monospace,monospace;color:var(--mu);margin-bottom:6px}
.pr{color:var(--ok)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--ac);margin-left:6px;vertical-align:text-bottom;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.shelf{display:flex;flex-wrap:wrap;gap:20px;margin-top:22px}
.cover{width:250px;height:170px;border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:10px;background:var(--pn2);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-decoration:none;transition:transform .15s,border-color .15s}
.cover:hover{transform:translateY(-3px);border-color:var(--ac)}
.cover .lab{font:700 1.3rem 'JetBrains Mono',ui-monospace,monospace;color:var(--tx)}
.cover .sb{font-size:.9rem;color:var(--mu)}
.cover.soon{background:none;border:1px dashed var(--bd);border-top:1px dashed var(--bd)}.cover.soon:hover{transform:none}.cover.soon .lab{color:var(--mu);font-size:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.card{display:block;padding:16px 18px;border:1px solid var(--bd);border-radius:8px;text-decoration:none;color:var(--tx);background:var(--pn2)}
.card:hover{border-color:var(--ac)}.card b{font:700 1.05rem sans-serif;color:var(--hd)}.card small{color:var(--mu)}
.ok{color:var(--ok)}
.tabs,.lv{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button,.lv button{padding:5px 14px;border:1px solid var(--bd);background:transparent;border-radius:6px;font:600 .9rem 'JetBrains Mono',ui-monospace,monospace;cursor:pointer;color:var(--mu)}
.tabs button:hover,.lv button:hover{color:var(--tx);border-color:var(--ac)}
.tabs button.on,.lv button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.page{padding:4px 0}.page p{max-width:70ch}
.merke{background:var(--pn2);border-left:3px solid var(--am);padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0;max-width:62ch}
code,pre,textarea#ed{font:15px 'JetBrains Mono',ui-monospace,Consolas,monospace}
code{background:var(--dk);color:var(--pu);padding:1px 6px;border-radius:4px}
pre{background:var(--dk);border:1px solid var(--bd);padding:12px 16px;border-radius:6px;overflow:auto;color:var(--tx)}
.btn,.btn2,.opt{font:inherit;cursor:pointer;border-radius:6px;padding:8px 18px;margin:4px 6px 4px 0}
.btn{background:var(--ac);color:var(--on);border:1px solid var(--ac);font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn2{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn2:hover{border-color:var(--ac)}.btn2.on{background:var(--am);color:var(--on);border-color:var(--am)}
.opt{display:block;width:100%;max-width:560px;text-align:left;background:var(--pn2);border:1px solid var(--bd);color:var(--tx)}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt:disabled{color:var(--tx);cursor:default}
.opt.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);border-color:var(--ok)}.opt.bad{background:color-mix(in srgb,var(--er) 18%,transparent);border-color:var(--er)}
.hud{color:var(--er);font-size:1.2rem}.hud span{color:var(--mu);font:.9rem 'JetBrains Mono',ui-monospace,monospace;margin-left:14px}
.erkl{background:var(--dk);border:1px solid var(--bd);padding:8px 12px;border-radius:6px;max-width:560px}
.task{font-weight:600}
details{color:var(--mu);margin-bottom:8px}summary{cursor:pointer}
textarea#ed{width:100%;height:130px;padding:12px;border:1px solid var(--bd);border-radius:6px;background:var(--dk);color:var(--tx);caret-color:var(--am)}
textarea#ed:focus{border-color:var(--ac);outline:0}
#out{margin-top:10px}.good{color:var(--ok);font-weight:600}.warn{color:var(--er);font-weight:600}
table{border-collapse:collapse;margin:8px 0;font:14px 'JetBrains Mono',ui-monospace,monospace}td,th{border:1px solid var(--bd);padding:3px 12px;background:var(--dk)}th{background:var(--pn2);color:var(--hd)}
#cv{position:relative;height:360px;border:1px dashed var(--bd);border-radius:6px;background:var(--dk) radial-gradient(var(--bd) 1px,transparent 1px) 0 0/20px 20px;overflow:auto;margin:8px 0}
#sv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sv line{stroke:var(--ac);stroke-width:2}#sv text{font:700 18px 'JetBrains Mono',monospace;fill:var(--am)}
.box{position:absolute;width:190px;border:1px solid var(--ac);border-radius:6px;overflow:hidden;background:var(--pn2);z-index:2}
.box.sel{outline:2px solid var(--am)}
.box .hd{display:flex;background:var(--dk);color:var(--ac);cursor:grab;padding:3px;touch-action:none}
.box input{flex:1;min-width:0;border:0;padding:3px 6px;font:700 14px 'JetBrains Mono',monospace;background:transparent;color:var(--tx)}
.box textarea{width:100%;height:76px;border:0;border-top:1px solid var(--bd);padding:6px;resize:none;font:13px 'JetBrains Mono',monospace;background:var(--pn2);color:var(--tx)}
.box .x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:1.1rem}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--am);outline-offset:2px}
@media(max-width:600px){main{padding:8px 16px 32px;margin:12px}h1{font-size:1.5rem}.cover{width:100%}}

h1,h2,h3,.mono,header a,#xp,.bc,.cover .lab,.card b,.tabs button,.lv button,.hud span{font-family:'Space Grotesk',system-ui,sans-serif}
.lg{display:inline-block;width:20px;height:20px;border-radius:6px;margin-right:10px;vertical-align:-4px;background:linear-gradient(135deg,var(--ac) 50%,var(--pu) 50%)}
#th{display:flex;align-items:center}
#th button{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);margin-left:6px;cursor:pointer;padding:0}
#th button.on{border-color:var(--tx)}
#th button[data-k=abend]{background:linear-gradient(135deg,#ff8a3d 50%,#15253d 50%)}
#th button[data-k=tag]{background:linear-gradient(135deg,#e8590c 50%,#fff 50%)}
#th button[data-k=meer]{background:linear-gradient(135deg,#ffa94d 50%,#1a5a95 50%)}
</style>
</head>
<body>
<header><a href="#/"><b class=lg></b>Lernheft</a><div style="display:flex;align-items:center"><span id=th></span><span id="xp" style="margin-left:14px">0 XP</span></div></header>
<main id="app"></main>
<script>
const M=t=>`<div class=merke>${t}</div>`;
const SEED=`CREATE TABLE Klasse(id INTEGER PRIMARY KEY,name TEXT,raum TEXT);
CREATE TABLE Schueler(id INTEGER PRIMARY KEY,name TEXT,klasse_id INTEGER REFERENCES Klasse(id));
CREATE TABLE Fach(id INTEGER PRIMARY KEY,name TEXT);
CREATE TABLE Besucht(schueler_id INTEGER,fach_id INTEGER);
INSERT INTO Klasse VALUES(1,'10a','R101'),(2,'10b','R102'),(3,'10c','R103');
INSERT INTO Schueler VALUES(1,'Anna',1),(2,'Ben',1),(3,'Cem',2),(4,'Dana',2),(5,'Eva',1);
INSERT INTO Fach VALUES(1,'Informatik'),(2,'Mathe'),(3,'Kunst');
INSERT INTO Besucht VALUES(1,1),(1,2),(2,1),(3,2),(3,3),(4,1),(5,3);`;
const SCHEMA=`Klasse(id, name, raum)   Daten: 10a/R101, 10b/R102, 10c/R103
Schueler(id, name, klasse_id)   Anna, Ben, Eva (10a), Cem, Dana (10b)
Fach(id, name)   Informatik, Mathe, Kunst
Besucht(schueler_id, fach_id)`;
const DK=[['Klasse',['name','raum']],['Schueler',['name']]];
const F={informatik:{n:'Informatik',sub:{
sql:{n:'Datenbanksysteme',d:'SQL, Tabellen und Beziehungen',t:{
kreuz:{n:'Kreuzprodukt',
h:`<h3>Alles mit allem</h3><p>Das Kreuzprodukt kombiniert <b>jede Zeile der ersten Tabelle mit jeder Zeile der zweiten</b>. Drei Klassen und drei Fächer ergeben 3 × 3 = 9 Zeilen.</p><pre>SELECT * FROM Klasse, Fach;</pre>${M('Die meisten Kombinationen sind sinnlos. Mit WHERE behältst du nur die passenden – dann ist es ein Join.')}`,
q:[['Tabelle A hat 4 Zeilen, Tabelle B hat 5. Wie viele Zeilen hat das Kreuzprodukt?',['9','20','5','1'],1,'4 × 5 = 20: jede Zeile von A mit jeder von B.'],['Welche Anweisung bildet ein Kreuzprodukt?',['SELECT * FROM A, B;','SELECT * FROM A + B;','SELECT A, B;','JOIN A B;'],0,'Zwei Tabellen im FROM, durch Komma getrennt.'],['Warum ergänzt man nach dem Kreuzprodukt oft WHERE?',['Um nur sinnvoll zusammengehörende Zeilen zu behalten','Damit die Abfrage schneller zu tippen ist','Weil es sonst einen Syntaxfehler gibt','Um Tabellen zu löschen'],0,'WHERE filtert die Kombinationen, z. B. Schueler.klasse_id = Klasse.id.']],
c:[{t:'Zeige das Kreuzprodukt von Klasse und Fach (alle Spalten).',s:'SELECT * FROM ',sol:'SELECT * FROM Klasse, Fach'},{t:'Bilde das Kreuzprodukt aus Schueler und Fach. Zeige nur Schülername und Fachname.',sol:'SELECT Schueler.name, Fach.name FROM Schueler, Fach'},{t:'Mache aus dem Kreuzprodukt von Schueler und Klasse eine sinnvolle Abfrage: Schülername mit Klassenname.',sol:'SELECT Schueler.name, Klasse.name FROM Schueler, Klasse WHERE Schueler.klasse_id = Klasse.id'}]},
fremd:{n:'Fremdschlüssel',
h:`<h3>Der Verweis auf eine andere Tabelle</h3><p>Ein <b>Fremdschlüssel</b> ist eine Spalte, die auf den <b>Primärschlüssel einer anderen Tabelle</b> zeigt. In <code>Schueler</code> verweist <code>klasse_id</code> auf <code>Klasse.id</code>.</p>${M('Der Fremdschlüssel sichert die referentielle Integrität: Kein Schüler kann in einer Klasse sein, die es nicht gibt.')}`,
q:[['Was ist ein Fremdschlüssel?',['Ein Verweis auf den Primärschlüssel einer anderen Tabelle','Die eindeutige ID der eigenen Tabelle','Ein Spaltenname mit Sonderzeichen','Eine Sortierregel'],0,'Er verbindet zwei Tabellen.'],['Schueler(id, name, klasse_id): Welche Spalte ist der Fremdschlüssel?',['id','name','klasse_id','keine'],2,'klasse_id zeigt auf Klasse.id.'],['Ein Schüler hat klasse_id = 7, aber es gibt nur Klassen 1 bis 3. Was passiert?',['Die referentielle Integrität wäre verletzt','Nichts, das ist erlaubt','Der Primärschlüssel wird doppelt','Die Tabelle wird gelöscht'],0,'Der Fremdschlüssel verweist ins Leere – das lässt die Datenbank nicht zu.']],
c:[{t:'Zeige die Namen aller Schüler mit klasse_id = 1.',sol:'SELECT name FROM Schueler WHERE klasse_id = 1'},{t:'In welchem Raum sitzt Anna? Verknüpfe Schueler und Klasse über den Fremdschlüssel.',sol:"SELECT Klasse.raum FROM Schueler, Klasse WHERE Schueler.klasse_id = Klasse.id AND Schueler.name = 'Anna'"},{t:'Wie viele Schüler hat jede Klasse? Zeige Klassenname und Anzahl.',sol:'SELECT Klasse.name, COUNT(*) FROM Schueler, Klasse WHERE Schueler.klasse_id = Klasse.id GROUP BY Klasse.name'}],
d:{t:'Zeichne die beiden Tabellen als Klassen (mit Fremdschlüssel klasse_id) und verbinde sie: Eine Klasse hat viele Schüler.',k:[['Klasse',['id','name']],['Schueler',['id','name','klasse_id']]],r:[['Klasse','Schueler','1','n']]}},
abfr:{n:'Einfache Abfragen',
h:`<h3>SELECT, WHERE, ORDER BY</h3><pre>SELECT name FROM Schueler
WHERE klasse_id = 1
ORDER BY name DESC;</pre><p><code>SELECT</code> wählt Spalten, <code>FROM</code> die Tabelle, <code>WHERE</code> filtert Zeilen, <code>ORDER BY</code> sortiert. <code>COUNT(*)</code> zählt Zeilen.</p>${M('Text steht in einfachen Anführungszeichen: WHERE name = &#39;Anna&#39;')}`,
q:[['Wie zeigst du nur die Spalte name aus Schueler?',['SELECT name FROM Schueler;','FROM Schueler SELECT name;','SHOW name Schueler;','GET name;'],0,'Erst SELECT, dann FROM.'],['Womit filterst du Zeilen?',['ORDER BY','WHERE','GROUP','COUNT'],1,'WHERE legt die Bedingung fest.'],['Wie sortierst du absteigend nach name?',['ORDER BY name DESC','SORT name DOWN','ORDER name 9-1','WHERE name DESC'],0,'ASC ist aufsteigend, DESC absteigend.']],
c:[{t:'Zeige alle Schülernamen, alphabetisch sortiert.',sol:'SELECT name FROM Schueler ORDER BY name'},{t:'Zeige alle Spalten der Klassen, die in Raum R102 oder R103 liegen.',sol:"SELECT * FROM Klasse WHERE raum = 'R102' OR raum = 'R103'"},{t:'Wie viele Schüler gibt es insgesamt?',sol:'SELECT COUNT(*) FROM Schueler'}]},
eins:{n:'1-n-Beziehungen',
h:`<h3>Eins zu viele</h3><p>Eine Klasse hat <b>viele</b> Schüler, aber jeder Schüler gehört zu <b>genau einer</b> Klasse. Das ist eine 1-n-Beziehung.</p>${M('Der Fremdschlüssel steht immer auf der n-Seite (hier in Schueler).')}`,
q:[['Wo steht der Fremdschlüssel bei einer 1-n-Beziehung?',['In der Tabelle der n-Seite','In der Tabelle der 1-Seite','In beiden Tabellen','In keiner, man braucht ihn nicht'],0,'Die n-Seite verweist auf die eine Seite.'],['Welches Beispiel ist eine 1-n-Beziehung?',['Mutter und ihre Kinder','Schüler und Fächer','Person und Personalausweis','Zahl und Quadrat'],0,'Eine Mutter hat viele Kinder, jedes Kind hat (hier) eine Mutter.'],['Welche Bedingung verknüpft Schueler und Klasse richtig?',['Schueler.klasse_id = Klasse.id','Schueler.id = Klasse.id','Schueler.name = Klasse.name','Schueler.id = Klasse.raum'],0,'Fremdschlüssel gleich Primärschlüssel.']],
c:[{t:'Zeige die Namen aller Schüler der Klasse mit klasse_id 2.',sol:'SELECT name FROM Schueler WHERE klasse_id = 2'},{t:'Zeige die Namen aller Schüler der Klasse 10a (über den Klassennamen).',sol:"SELECT Schueler.name FROM Schueler, Klasse WHERE Schueler.klasse_id = Klasse.id AND Klasse.name = '10a'"},{t:'Welche Klassen haben keine Schüler? Zeige den Klassennamen.',sol:'SELECT name FROM Klasse WHERE id NOT IN (SELECT klasse_id FROM Schueler)'}],
d:{t:'Eine Klasse hat viele Schüler, jeder Schüler gehört zu genau einer Klasse. Zeichne das Klassendiagramm.',k:DK,r:[['Klasse','Schueler','1','n']]}},
nm:{n:'n-m-Beziehungen',
h:`<h3>Viele zu viele</h3><p>Ein Schüler besucht <b>mehrere</b> Fächer, ein Fach wird von <b>mehreren</b> Schülern besucht. Das ist eine n-m-Beziehung.</p><p>Man löst sie mit einer <b>Zwischentabelle</b>: <code>Besucht(schueler_id, fach_id)</code>.</p>${M('Die Zwischentabelle enthält zwei Fremdschlüssel. Für Schueler, Fach und Besucht braucht man also 3 Tabellen.')}`,
q:[['Wie setzt man eine n-m-Beziehung in Tabellen um?',['Mit einer Zwischentabelle','Mit einem zweiten Primärschlüssel','Mit einer Spalte voller Listen','Gar nicht'],0,'Zwei 1-n-Beziehungen zur Zwischentabelle.'],['Wie viele Tabellen braucht Schüler–Fach (n-m) mindestens?',['2','3','4','1'],1,'Schueler, Fach und die Zwischentabelle.'],['Was steht in der Zwischentabelle?',['Zwei Fremdschlüssel','Nur Namen','Eine Summe','Nichts'],0,'schueler_id und fach_id.']],
c:[{t:'Zeige die komplette Zwischentabelle Besucht.',sol:'SELECT * FROM Besucht'},{t:'Welche Fächer besucht Anna? Zeige die Fachnamen (Schueler, Besucht, Fach verknüpfen).',sol:"SELECT Fach.name FROM Schueler, Besucht, Fach WHERE Schueler.id = Besucht.schueler_id AND Besucht.fach_id = Fach.id AND Schueler.name = 'Anna'"},{t:'Welche Schüler besuchen Informatik? Zeige die Schülernamen.',sol:"SELECT Schueler.name FROM Schueler, Besucht, Fach WHERE Schueler.id = Besucht.schueler_id AND Besucht.fach_id = Fach.id AND Fach.name = 'Informatik'"}],
d:{t:'Schüler besuchen mehrere Fächer, ein Fach wird von mehreren Schülern besucht. Zeichne das Klassendiagramm.',k:[['Schueler',['name']],['Fach',['name']]],r:[['Schueler','Fach','n','m']]}}}},
java:{n:'Basic Java',d:'Variablen, Bedingungen, Schleifen, Klassen',t:{
var:{n:'Variablen und Datentypen',
h:`<h3>Werte speichern</h3><pre>int alter = 15;
double preis = 2.5;
boolean fertig = false;
String name = "Max";</pre><p><code>int</code> = ganze Zahl, <code>double</code> = Kommazahl, <code>boolean</code> = wahr/falsch, <code>String</code> = Text.</p>${M('Jede Anweisung endet mit einem Semikolon.')}`,
q:[['Welcher Datentyp passt zu 3,14?',['int','double','boolean','String'],1,'Kommazahlen sind double.'],['Welche Zeile ist korrekt?',['String name = "Max";','string name = Max;','String name = Max;','Text name = "Max";'],0,'String groß, Text in Anführungszeichen.'],['Was kann ein boolean speichern?',['true oder false','Beliebigen Text','Nur Zahlen','Datum'],0,'Nur zwei Werte.']],
c:[{t:'Deklariere eine int-Variable alter mit dem Wert 15.',re:/int\s+alter\s*=\s*15\s*;/,sol:'int alter = 15;',h:'Datentyp, Name, =, Wert, Semikolon.'},{t:'Speichere den Text Max in einer String-Variable name.',re:/String\s+name\s*=\s*"Max"\s*;/,sol:'String name = "Max";',h:'Text gehört in doppelte Anführungszeichen.'},{t:'Deklariere double preis = 2.5 und boolean fertig = false (zwei Zeilen).',re:[/double\s+preis\s*=\s*2\.5\s*;/,/boolean\s+fertig\s*=\s*false\s*;/],sol:'double preis = 2.5;\nboolean fertig = false;',h:'Kommazahlen schreibt man mit Punkt.'}]},
bed:{n:'Bedingungen (if/else)',
h:`<h3>Entscheidungen treffen</h3><pre>if (zahl &gt; 10) {
  System.out.println("groß");
} else {
  System.out.println("klein");
}</pre><p>Vergleiche: <code>==</code> gleich, <code>!=</code> ungleich, <code>&lt; &gt; &lt;= &gt;=</code>. Verknüpfen mit <code>&amp;&amp;</code> (und) und <code>||</code> (oder).</p>${M('Gleichheit prüft man mit ==, nicht mit einem einzelnen =.')}`,
q:[['Wie prüfst du auf Gleichheit?',['==','=','=>','!='],0,'Ein = weist nur zu.'],['Wann läuft der else-Block?',['Wenn die Bedingung falsch ist','Immer','Wenn die Bedingung wahr ist','Nie'],0,'else ist der Fall „sonst“.'],['Was bedeutet x &gt; 0 &amp;&amp; x &lt; 10?',['Beide Teile müssen wahr sein','Mindestens einer ist wahr','x ist genau 0','Fehler'],0,'&amp;&amp; heißt und.']],
c:[{t:'Wenn zahl größer als 10 ist, gib „groß“ aus (System.out.println).',re:[/if\s*\(\s*zahl\s*>\s*10\s*\)/,/System\.out\.println\(\s*"groß"\s*\)\s*;/],sol:'if (zahl > 10) {\n  System.out.println("groß");\n}',h:'if (Bedingung) { ... }'},{t:'Gib „gerade“ aus, wenn zahl gerade ist, sonst „ungerade“. Nutze zahl % 2.',re:[/if\s*\(\s*zahl\s*%\s*2\s*==\s*0\s*\)/,/else/,/"gerade"/,/"ungerade"/],sol:'if (zahl % 2 == 0) {\n  System.out.println("gerade");\n} else {\n  System.out.println("ungerade");\n}',h:'% liefert den Rest der Division.'},{t:'Prüfe, ob punkte zwischen 0 und 100 liegt (beide eingeschlossen).',re:/if\s*\(\s*punkte\s*>=\s*0\s*&&\s*punkte\s*<=\s*100\s*\)/,sol:'if (punkte >= 0 && punkte <= 100) {\n}',h:'Zwei Vergleiche mit && verbinden.'}]},
schl:{n:'Schleifen',
h:`<h3>Wiederholen</h3><pre>for (int i = 1; i &lt;= 3; i++) {
  System.out.println(i);
}
int x = 0;
while (x &lt; 3) { x++; }</pre><p><code>for</code> nutzt du, wenn du weißt, wie oft. <code>while</code>, wenn die Anzahl offen ist.</p>${M('i++ erhöht i um 1.')}`,
q:[['Wie oft läuft for (int i = 0; i &lt; 3; i++)?',['2','3','4','unendlich'],1,'i ist 0, 1 und 2.'],['Welche Schleife passt bei unbekannter Anzahl?',['while','for mit festem Ende','if','switch'],0,'while prüft nur die Bedingung.'],['Was macht i++?',['Erhöht i um 1','Verdoppelt i','Setzt i auf 0','Löscht i'],0,'Kurzform von i = i + 1.']],
c:[{t:'Schreibe den Kopf einer for-Schleife, die i von 1 bis 10 zählt.',re:/for\s*\(\s*int\s+i\s*=\s*1\s*;\s*i\s*<=\s*10\s*;\s*i\+\+\s*\)/,sol:'for (int i = 1; i <= 10; i++) {\n}',h:'for (Start; Bedingung; Schritt)'},{t:'Schreibe eine while-Schleife, die läuft, solange x kleiner als 5 ist, und x um 1 erhöht.',re:[/while\s*\(\s*x\s*<\s*5\s*\)/,/x\+\+|x\s*\+=\s*1|x\s*=\s*x\s*\+\s*1/],sol:'while (x < 5) {\n  x++;\n}',h:'Ohne Erhöhung läuft sie ewig.'},{t:'Addiere die Zahlen 1 bis 100 in der Variable summe (for-Schleife).',re:[/for\s*\(/,/summe\s*\+=\s*i|summe\s*=\s*summe\s*\+\s*i/,/i\s*<=\s*100|i\s*<\s*101/],sol:'int summe = 0;\nfor (int i = 1; i <= 100; i++) {\n  summe += i;\n}',h:'summe += i; im Schleifenkörper.'}]},
kl:{n:'Klassen und Objekte',
h:`<h3>Bauplan und Exemplar</h3><p>Eine <b>Klasse</b> ist der Bauplan, ein <b>Objekt</b> ein Exemplar davon.</p><pre>class Hund {
  String name;
  Hund(String name) { this.name = name; }
  void bellen() { }
}
Hund bello = new Hund("Bello");</pre>${M('Der Konstruktor heißt wie die Klasse. Objekte erzeugst du mit new.')}`,
q:[['Womit erzeugst du ein Objekt?',['new','create','make','class'],0,'Hund h = new Hund();'],['Was sind Attribute?',['Eigenschaften einer Klasse','Befehle einer Klasse','Schleifen','Kommentare'],0,'Zum Beispiel name und alter.'],['Wie heißt der Konstruktor?',['Wie die Klasse','new','init','main'],0,'Gleicher Name, kein Rückgabetyp.']],
c:[{t:'Erzeuge ein Objekt der Klasse Hund in der Variable bello (Konstruktor ohne Parameter).',re:/Hund\s+bello\s*=\s*new\s+Hund\s*\(\s*\)\s*;/,sol:'Hund bello = new Hund();',h:'Klasse Variable = new Klasse();'},{t:'Schreibe die Klasse Hund mit dem Attribut String name.',re:[/class\s+Hund/,/String\s+name\s*;/],sol:'class Hund {\n  String name;\n}',h:'class Name { Attribute }'},{t:'Ergänze in Hund einen Konstruktor mit dem Parameter String name, der das Attribut setzt.',re:[/Hund\s*\(\s*String\s+name\s*\)/,/this\.name\s*=\s*name\s*;/],sol:'public Hund(String name) {\n  this.name = name;\n}',h:'this.name meint das Attribut.'}],
d:{t:'Ein Besitzer hat mehrere Hunde, jeder Hund hat genau einen Besitzer. Zeichne das Klassendiagramm.',k:[['Besitzer',['name']],['Hund',['name','alter','bellen()']]],r:[['Besitzer','Hund','1','n']]}}}}}}};

const $=s=>document.querySelector(s),app=$('#app');
let P={xp:0,done:{}},S={},G={},DB;
try{P=JSON.parse(localStorage.getItem('lh'))||P}catch(e){}
const save=()=>{try{localStorage.setItem('lh',JSON.stringify(P))}catch(e){}};
const xp=n=>{P.xp+=n;save();$('#xp').textContent=P.xp+' XP'};
const key=x=>`${S.f}/${S.s}/${S.t}:${x}`;
const once=(x,n)=>{if(!P.done[key(x)]){P.done[key(x)]=1;xp(n);return n}return 0};
const cnt=p=>Object.keys(P.done).filter(k=>k.startsWith(p)).length;

function route(){const [f,s,t]=location.hash.replace(/^#\/?/,'').split('/');
 const A=F[f],B=A&&A.sub[s],T=B&&B.t[t];
 if(!A)return home();if(!B)return fach(f);if(!T)return sub(f,s);
 S={T,f,s,t,mode:'heft',lvl:0,q:null};draw()}
function home(){app.innerHTML=`<h1>Was willst du heute lernen?</h1><div class=shelf>${Object.entries(F).map(([k,v])=>`<a class=cover href="#/${k}"><span class=lab>${v.n}</span><span class=sb>${Object.values(v.sub).map(x=>x.n).join(', ')}</span></a>`).join('')}<div class="cover soon"><span class=lab>weitere Fächer folgen</span></div></div>`}
function fach(f){const A=F[f];app.innerHTML=`<p class=bc><a href="#/">Startseite</a> / ${A.n}</p><h1>${A.n}</h1><p>Wähle ein Heft:</p><div class=cards>${Object.entries(A.sub).map(([k,v])=>`<a class=card href="#/${f}/${k}"><b>${v.n}</b><br>${v.d}<br><small>${Object.keys(v.t).length} Themen, ${cnt(f+'/'+k+'/')} Aufgaben erledigt</small></a>`).join('')}</div>`}
function sub(f,s){const B=F[f].sub[s];app.innerHTML=`<p class=bc><a href="#/">Startseite</a> / <a href="#/${f}">${F[f].n}</a> / ${B.n}</p><h1>${B.n}</h1><p>Inhaltsverzeichnis:</p><div class=cards>${Object.entries(B.t).map(([k,v])=>`<a class=card href="#/${f}/${s}/${k}"><b>${v.n}</b><br><small>Heft, Spiel, Code${v.d?', Diagramm':''}${cnt(`${f}/${s}/${k}:`)?' <span class=ok>(angefangen)</span>':''}</small></a>`).join('')}</div>`}
function draw(){const T=S.T;
 app.innerHTML=`<p class=bc><a href="#/">Startseite</a> / <a href="#/${S.f}">${F[S.f].n}</a> / <a href="#/${S.f}/${S.s}">${F[S.f].sub[S.s].n}</a></p><h1>${T.n}</h1><div class=tabs>${[['heft','Heft'],['quiz','Spielen'],['code','Code-Übung'],...(T.d?[['dia','Diagramm']]:[])].map(([m,l])=>`<button class="${S.mode==m?'on':''}" onclick="S.mode='${m}';S.lvl=0;S.q=null;draw()">${l}</button>`).join('')}</div><section class=page id=pg></section>`;
 ({heft:vHeft,quiz:vQuiz,code:vCode,dia:vDia})[S.mode]()}
const lvl=()=>`<div class=lv>${['Leicht','Mittel','Schwer'].map((l,i)=>`<button class="${i==S.lvl?'on':''}" onclick="S.lvl=${i};draw()">${l}</button>`).join('')}</div>`;
function vHeft(){$('#pg').innerHTML=S.T.h+`<button class=btn onclick="S.mode='quiz';draw()">Jetzt spielen</button>`}

function vQuiz(){const q=S.q||(S.q={i:0,l:3,sc:0,a:null}),Q=S.T.q,pg=$('#pg');
 if(q.l<=0||q.i>=Q.length){const w=q.l>0,g=w?once('q',q.sc*10):0;
  pg.innerHTML=`<h2>${w?'Geschafft!':'Alle Leben verloren'}</h2><p>${q.sc} von ${Q.length} richtig${g?', +'+g+' XP':''}.</p><button class=btn onclick="S.q=null;draw()">Nochmal spielen</button>`;return}
 const c=Q[q.i],d=q.a!=null;
 pg.innerHTML=`<div class=hud>${'♥'.repeat(q.l)}${'♡'.repeat(3-q.l)}<span>Frage ${q.i+1} von ${Q.length}</span></div><h2>${c[0]}</h2>${c[1].map((o,j)=>`<button class="opt ${d?(j==c[2]?'ok':j==q.a?'bad':''):''}" ${d?'disabled':''} onclick="ans(${j})">${o}</button>`).join('')}${d?`<p class=erkl>${c[3]}</p><button class=btn onclick="S.q.i++;S.q.a=null;draw()">Weiter</button>`:''}`}
function ans(j){const q=S.q;q.a=j;if(j==S.T.q[q.i][2])q.sc++;else q.l--;draw()}

function vCode(){const c=S.T.c[S.lvl],sql=S.s=='sql';
 $('#pg').innerHTML=lvl()+`<p class=task>${c.t}</p>${sql?`<details><summary>Tabellen ansehen</summary><pre>${SCHEMA}</pre></details>`:''}<textarea id=ed spellcheck=false aria-label="Dein Code">${c.s||''}</textarea><div><button class=btn onclick="check()">Prüfen</button>${sql?'<button class=btn2 onclick="runq()">Ausführen</button>':''}<button class=btn2 onclick="hint()">${sql?'Lösung zeigen':'Hinweis'}</button>${sql?'':'<button class=btn2 onclick="$(\'#ed\').value=S.T.c[S.lvl].sol">Lösung zeigen</button>'}</div><div id=out></div>`}
function hint(){const c=S.T.c[S.lvl];$('#out').innerHTML=S.s=='sql'?`<pre>${c.sol}</pre>`:`<p>${c.h}</p>`}
async function db(){if(DB)return DB;
 await new Promise((r,j)=>{const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js';e.onload=r;e.onerror=j;document.head.appendChild(e)});
 const Q=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/'+f});DB=new Q.Database();DB.run(SEED);return DB}
function run(d,q){if(!/^\s*select/i.test(q))throw Error('Hier sind nur SELECT-Abfragen erlaubt.');return d.exec(q)[0]||{columns:[],values:[]}}
const tbl=r=>`<table><tr>${r.columns.map(c=>`<th>${c}</th>`).join('')}</tr>${r.values.map(v=>`<tr>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
async function runq(){const o=$('#out');o.textContent='Lade …';try{o.innerHTML=tbl(run(await db(),$('#ed').value))}catch(e){o.innerHTML=`<p class=warn>${e.message}</p>`}}
async function check(){const c=S.T.c[S.lvl],v=$('#ed').value,o=$('#out');let ok=false,msg='';
 if(S.s=='sql'){o.textContent='Prüfe …';try{const d=await db(),u=run(d,v),r=run(d,c.sol),f=x=>JSON.stringify(x.values.map(a=>JSON.stringify(a)).sort());
  ok=u.columns.length==r.columns.length&&f(u)==f(r);
  if(!ok)msg=u.columns.length!=r.columns.length?`Du hast ${u.columns.length} Spalten, gefragt sind ${r.columns.length}.`:`Das Ergebnis stimmt noch nicht (${u.values.length} Zeilen, erwartet ${r.values.length}).`;
  o.innerHTML=tbl(u)}catch(e){o.innerHTML=`<p class=warn>${e.message}</p>`;return}}
 else{const miss=[].concat(c.re).filter(r=>!r.test(v));ok=!miss.length;if(!ok)msg='Noch nicht ganz. '+c.h}
 const g=ok?once('c'+S.lvl,10*(S.lvl+1)):0;
 o.insertAdjacentHTML('beforeend',ok?`<p class=good>Richtig!${g?' +'+g+' XP':''}</p>`:`<p class=warn>${msg}</p>`)}

const nm=e=>e.querySelector('input').value.trim().toLowerCase(),ctr=e=>[e.offsetLeft+e.offsetWidth/2,e.offsetTop+e.offsetHeight/2];
function vDia(){const d=S.T.d;
 $('#pg').innerHTML=lvl()+`<p class=task>${d.t}</p><p><small>${['Klassen und Attribute sind vorgegeben, verbinde sie.','Klassennamen sind vorgegeben, ergänze Attribute und Verbindung.','Zeichne alles selbst: Klassen, Attribute und Verbindung.'][S.lvl]} Verbindung: Button klicken, dann zwei Klassen anklicken. Die Zahl steht direkt an der jeweiligen Klasse (1 oder n).</small></p><div><button class=btn2 onclick="addBox()">+ Klasse</button><button class=btn2 id=cb onclick="G.m=!G.m;G.c=null;document.querySelectorAll('.box').forEach(b=>b.classList.remove('sel'));this.classList.toggle('on',!!G.m)">Verbindung ziehen</button><button class=btn2 onclick="G.l.pop();links()">Letzte Verbindung löschen</button></div><div id=cv><svg id=sv></svg></div><button class=btn onclick="checkD()">Prüfen</button><div id=out></div>`;
 G={b:[],l:[],c:null,m:0};
 if(S.lvl<2)d.k.forEach((k,i)=>addBox(k[0],S.lvl==0?k[1].join('\n'):'',20+i*260,60))}
function addBox(n,a,x,y){const e=document.createElement('div');e.className='box';
 e.style.left=(x??20+G.b.length*30)+'px';e.style.top=(y??20+G.b.length*30)+'px';
 e.innerHTML='<div class=hd><input placeholder=Klassenname aria-label=Klassenname><button class=x title=Entfernen>×</button></div><textarea placeholder="Attribute, eine pro Zeile"></textarea>';
 e.querySelector('input').value=typeof n=='string'?n:'';e.querySelector('textarea').value=typeof a=='string'?a:'';
 e.querySelector('.x').onclick=ev=>{ev.stopPropagation();G.b=G.b.filter(b=>b!=e);G.l=G.l.filter(l=>l.a!=e&&l.b!=e);e.remove();links()};
 const hd=e.querySelector('.hd');hd.onpointerdown=ev=>{if(ev.target.tagName=='INPUT'||ev.target.tagName=='BUTTON')return;const ox=ev.clientX-e.offsetLeft,oy=ev.clientY-e.offsetTop;hd.setPointerCapture(ev.pointerId);
  hd.onpointermove=m=>{e.style.left=Math.max(0,m.clientX-ox)+'px';e.style.top=Math.max(0,m.clientY-oy)+'px';links()};hd.onpointerup=()=>{hd.onpointermove=null}};
 e.onclick=()=>{if(!G.m)return;if(!G.c){G.c=e;e.classList.add('sel')}else if(G.c!=e){const A=G.c,a=prompt(`Zahl direkt an „${nm(A)||'Klasse A'}“ (1 oder n):`,'1'),b=prompt(`Zahl direkt an „${nm(e)||'Klasse B'}“ (1 oder n):`,'n');
   A.classList.remove('sel');G.c=null;if(a!==null&&b!==null){G.l.push({a:A,b:e,ca:a.trim()||'1',cb:b.trim()||'n'});links()}}};
 $('#cv').appendChild(e);G.b.push(e);links()}
function links(){$('#sv').innerHTML=G.l.map(k=>{const A=ctr(k.a),B=ctr(k.b),D=Math.hypot(B[0]-A[0],B[1]-A[1])||1,t=115/D,p=(X,Y)=>[X[0]+(Y[0]-X[0])*t,X[1]+(Y[1]-X[1])*t-6],a=p(A,B),b=p(B,A);
 return `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"/><text x="${a[0]}" y="${a[1]}">${k.ca}</text><text x="${b[0]}" y="${b[1]}">${k.cb}</text>`}).join('')}
function checkD(){const d=S.T.d,m=[],card=x=>String(x).trim()=='1'?1:2,bs=G.b.map(e=>[nm(e),e.querySelector('textarea').value.toLowerCase()]);
 d.k.forEach(k=>{const b=bs.find(x=>x[0]==k[0].toLowerCase());if(!b)return m.push(`Klasse „${k[0]}“ fehlt.`);k[1].forEach(a=>{if(!b[1].includes(a.toLowerCase()))m.push(`„${k[0]}“: Attribut „${a}“ fehlt.`)})});
 d.r.forEach(r=>{const [x,y]=[r[0].toLowerCase(),r[1].toLowerCase()];
  if(!G.l.some(l=>{const na=nm(l.a),nb=nm(l.b);return(na==x&&nb==y&&card(l.ca)==card(r[2])&&card(l.cb)==card(r[3]))||(na==y&&nb==x&&card(l.ca)==card(r[3])&&card(l.cb)==card(r[2]))}))m.push(`Verbindung ${r[0]} – ${r[1]} fehlt oder die Zahlen (1 oder n) stimmen nicht.`)});
 const g=m.length?0:once('d'+S.lvl,15*(S.lvl+1));
 $('#out').innerHTML=m.length?`<p class=warn>Noch nicht ganz:</p><ul>${m.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<p class=good>Richtig!${g?' +'+g+' XP':''}</p>`}

const TH=[['abend','Abendrot'],['tag','Tag'],['meer','Meer']];
function theme(t){document.documentElement.dataset.th=t;P.th=t;save();$('#th').innerHTML=TH.map(([k,n])=>`<button data-k=${k} class="${k==t?'on':''}" title="${n}" aria-label="Design ${n}" onclick="theme('${k}')"></button>`).join('')}
addEventListener('hashchange',route);theme(P.th||'abend');xp(0);route();
</script>
</body>
</html>
