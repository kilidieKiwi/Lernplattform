h:`<h3>Diskrete Energiestufen</h3><p>Ein Atom kann nur ganz bestimmte Energiewerte annehmen, die <b>Energiestufen</b>. Es nimmt ein Photon nur auf (<b>Absorption</b>), wenn dessen Energie genau dem Abstand zweier Stufen entspricht. Beim Übergang auf eine tiefere Stufe gibt es ein Photon ab (<b>Emission</b>):</p><p style="font-size:1.1rem">E<sub>Photon</sub> = E<sub>oben</sub> − E<sub>unten</sub></p><h3>Spektren</h3><ul><li><b>Kontinuierliches Spektrum:</b> alle Farben lückenlos, z. B. von glühenden Festkörpern wie Glühdraht oder Sonne.</li><li><b>Linienspektrum (Emission):</b> Ein dünnes, angeregtes Gas strahlt nur Photonen bestimmter Energien ab, es entstehen einzelne helle Linien.</li><li><b>Absorptionsspektrum:</b> Durchleuchtet man ein Gas mit kontinuierlichem Licht, fehlen genau die Photonen, die das Gas aufnimmt. Es entstehen dunkle Linien.</li></ul><h3>Absorption der Erdatmosphäre</h3><p>Das Absorptionsdiagramm der Atmosphäre ist die Überlagerung der Diagramme der einzelnen Gase (z. B. Wasserdampf, Kohlenstoffdioxid, Ozon). Jedes Gas absorbiert bestimmte Bereiche im UV oder Infraroten. Ozon schützt vor UV, Wasserdampf und CO₂ absorbieren Infrarot.</p>${M('Ein Atom ist wie eine Leiter mit festen Sprossen: Man kann nur von Sprosse zu Sprosse wechseln, nicht dazwischen.')}`,
q:[Q('Wann absorbiert ein Atom ein Photon?','Wenn die Photonenenergie genau dem Abstand zweier Energiestufen entspricht',['Bei jeder Photonenenergie','Nur bei sichtbarem Licht','Wenn das Photon möglichst schwach ist'],'Die Energiestufen sind diskret.'),Q('Wie sieht das Spektrum eines glühenden Drahts aus?','Kontinuierlich',['Ein einzelnes Linienspektrum','Nur Infrarot','Es gibt keines'],'Alle Farben lückenlos.'),Q('Woran erkennt man ein Absorptionsspektrum?','Dunkle Linien in einem kontinuierlichen Spektrum',['Helle Linien auf dunklem Grund','Es gibt keine Farben','Nur eine Farbe'],'Die absorbierten Photonen fehlen.'),Q('Welche Gase prägen das Absorptionsspektrum der Erdatmosphäre?','Mehrere Gase, die sich überlagern',['Nur Stickstoff','Nur Sauerstoff','Kein Gas'],'Wasserdampf, CO₂ und Ozon absorbieren verschiedene Bereiche.')],
m:[()=>{const a=pick([0,1.9,2.1]),b=a+pick([.5,1,1.5,2,2.5]);return{t:`Ein Atom geht von der Energiestufe ${dz(b)} eV auf die Stufe ${dz(a)} eV über. Welche Energie in eV hat das emittierte Photon?`,a:b-a,tol:.01}},()=>{const n=rnd(3,7);return{t:`Ein Atom hat ${n} Energiestufen. Wie viele verschiedene Übergänge (Emissionslinien) sind zwischen je zwei Stufen möglich?`,a:n*(n-1)/2,h:'Alle Paare von Stufen zählen.'}},()=>{const a=pick([1.5,2,3]),b=pick([4,5,6]);return{t:`Ein Photon mit ${dz(b-a)} eV trifft ein Atom auf der Stufe ${dz(a)} eV. Auf welche Stufe in eV kann es angeregt werden?`,a:b,h:'E<sub>unten</sub> + E<sub>Photon</sub>'}}]}}},
p94:{n:'Ph9 3.1 Das Teilchenmodell',g:9,d:'Temperatur, innere Energie, Druck von Gasen',t:{
temp:{n:'Temperatur und innere Energie',
h:`<h3>Teilchenmodell und Temperatur</h3><p>Im <b>Teilchenmodell</b> bestehen Stoffe aus Teilchen, die sich ständig bewegen. Die <b>Temperatur</b> ist ein Maß für die <b>mittlere kinetische Energie</b> der Teilchen. Deshalb gibt es einen tiefsten Wert, den <b>absoluten Nullpunkt</b> (0 K = −273,15 °C), bei dem die Teilchenbewegung minimal ist. Die absolute Temperatur T in Kelvin:</p><p style="font-size:1.1rem">T/K = ϑ/°C + 273,15</p><p>Die mittlere kinetische Energie ist proportional zu T: Bei doppelter Kelvin-Temperatur ist sie doppelt so groß.</p><h3>Innere Energie</h3><p>Die <b>innere Energie</b> U eines Körpers ist die Summe aus kinetischer und potentieller Energie seiner Teilchen. Wird dem Körper Energie zugeführt, steigt U.</p><h3>Aggregatzustände</h3><p>Beim Schmelzen und Verdampfen nimmt die <b>potentielle Energie</b> der Teilchen zu (die Abstände und Bindungen ändern sich), die Temperatur bleibt währenddessen konstant. Beim Erstarren und Kondensieren wird Energie abgegeben. Unterscheide Modellebene (Teilchen) und Realitätsebene (Wasser).</p>${M('Temperatur = mittlere Teilchenenergie. Innere Energie = Summe aller Teilchenenergien.')}`,
q:[Q('Was misst die Temperatur im Teilchenmodell?','Die mittlere kinetische Energie der Teilchen',['Die Anzahl der Teilchen','Die Masse der Teilchen','Die Größe der Teilchen'],'Daher gibt es einen absoluten Nullpunkt.'),Q('Wie viel Kelvin sind 0 °C?','273,15 K',['0 K','−273,15 K','100 K'],'T = ϑ + 273,15.'),Q('Was nimmt beim Schmelzen von Eis bei konstanter Temperatur zu?','Die potentielle Energie der Teilchen',['Die kinetische Energie der Teilchen','Die Masse','Die Temperatur'],'Die zugeführte Energie verändert die Anordnung der Teilchen.'),Q('Was ist die innere Energie?','Summe aus kinetischer und potentieller Energie der Teilchen',['Nur die kinetische Energie der Teilchen','Die Energie der Umgebung','Die Wärme eines Körpers'],'Sie hängt von Temperatur, Stoff und Menge ab.')],
m:[()=>{const t=rnd(-30,150);return{t:`Rechne ${t} °C in Kelvin um.`,a:t+273.15,tol:.01}},()=>{const T=rnd(200,500);return{t:`Rechne ${T} K in °C um.`,a:T-273.15,tol:.01}},()=>{const t=rnd(0,100);return{t:`Bei ${t} °C hat ein Gas eine bestimmte mittlere kinetische Energie der Teilchen. Bei welcher Temperatur in °C ist sie doppelt so groß (ganze Zahl)?`,a:2*(t+273.15)-273.15,tol:.6,h:'Die mittlere kinetische Energie ist proportional zur Kelvin-Temperatur.'}}]},
druck:{n:'Druck und Gase',
h:`<h3>Druck</h3><p>Der <b>Druck</b> ist die Kraft pro Fläche: <b>p = F/A</b> (Einheit 1 Pa = 1 N/m²). Gebräuchlich sind 1 hPa = 100 Pa und 1 bar = 10⁵ Pa = 1000 hPa. Der Luftdruck beträgt etwa 1013 hPa.</p><h3>Gasdruck im Teilchenmodell</h3><p>Gasteilchen stoßen ständig gegen die Gefäßwand. Jeder Stoß übt eine kleine Kraft aus, viele Stöße ergeben den Druck. Der Zustand eines Gases wird durch <b>Druck p, Volumen V und Temperatur T</b> beschrieben.</p><ul><li>Volumen konstant, T steigt: Die Teilchen sind schneller, stoßen öfter und härter, der Druck steigt.</li><li>Temperatur konstant, V sinkt: Die Teilchen stoßen häufiger gegen die Wand, der Druck steigt (p·V = konstant).</li></ul><h3>Druckunterschied und Teilchenstrom</h3><p>Gibt es einen Druckunterschied, strömen Teilchen vom Ort höheren zum Ort niedrigeren Drucks: Wind, Staubsauger, Atmen, Reifenpumpe.</p>${M('Mehr Teilchenstöße pro Fläche und Zeit bedeuten mehr Druck.')}`,
w:plotW({tx:'Boyle-Mariotte: Bei konstanter Temperatur gilt p·V = konstant. Stelle den Wert von p·V ein und beobachte, wie der Druck mit dem Volumen fällt. Mit dem Knopf bekommst du eine Zielkurve.',f:(V,q)=>q[0]/V,X:[0,8],Y:[0,8],ps:[{k:'p·V',min:1,max:8,step:1,v:4}],fm:q=>`p = ${q[0]} / V &nbsp; (V in Litern, p in 100 kPa)`}),wl:'Graph',
q:[Q('Wie ist der Druck definiert?','Kraft pro Fläche',['Kraft mal Fläche','Masse pro Volumen','Energie pro Zeit'],'p = F/A.'),Q('Ein Gas wird bei konstanter Temperatur auf das halbe Volumen zusammengedrückt. Was passiert mit dem Druck?','Er wird doppelt so groß',['Er halbiert sich','Er bleibt gleich','Er sinkt auf null'],'p·V = konstant.'),Q('Warum steigt der Druck in einem geschlossenen Gefäß bei Erwärmung?','Die Teilchen sind schneller und stoßen öfter und härter gegen die Wand',['Es kommen mehr Teilchen hinzu','Die Teilchen werden größer','Das Gefäß wird schwerer'],'Erklärung mit dem Teilchenmodell.'),Q('Was ist die Ursache für einen Teilchenstrom?','Ein Druckunterschied',['Ein Temperaturunterschied von 0 K','Ein gleich großer Druck','Die Farbe des Gases'],'Teilchen strömen vom hohen zum niedrigen Druck.')],
m:[()=>{const F=rnd(2,50)*10,A=rnd(1,10)/100;return{t:`Eine Kraft von ${F} N wirkt senkrecht auf eine Fläche von ${dz(A)} m². Wie groß ist der Druck in Pa?`,a:F/A,tol:rt(F/A),h:'p = F/A'}},()=>{const k=pick([2,3,4]),p1=pick([100,150,200]);return{t:`Ein Gas (${p1} kPa, 12 l) wird bei gleicher Temperatur auf ${12/k} l zusammengedrückt. Wie groß ist der Druck dann in kPa?`,a:p1*k,tol:rt(p1*k),h:'p·V = konstant'}},()=>{const b=pick([.5,1,1.5,2,2.5,3]);return{t:`Rechne ${dz(b)} bar in hPa um.`,a:b*1000}}]}}},
p95:{n:'Ph9 3.2 Thermischer Energietransport und Klima',g:9,d:'Wärme, Wärmetransport, Treibhauseffekt',t:{
waerme:{n:'Wärme und spezifische Wärmekapazität',
h:`<h3>Arbeit und Wärme</h3><p>Die innere Energie eines Körpers kann sich auf zwei Arten ändern: durch <b>Arbeit</b> (z. B. Reiben, Zusammendrücken) oder durch <b>Wärme</b> Q, das ist Energie, die wegen eines Temperaturunterschieds von einem Körper auf einen anderen übertragen wird: <b>ΔU = W + Q</b>. Wärme ist eine <b>Prozessgröße</b>. Ein Körper „hat“ keine Wärme, er hat innere Energie. Alltagssprachliche Wendungen („Wärme speichern“, „Kälte strömt herein“) sind fachsprachlich falsch.</p><h3>Spezifische Wärmekapazität</h3><p>Soll ein Körper der Masse m um Δϑ erwärmt werden, braucht er die Wärme</p><p style="font-size:1.1rem"><b>Q = c·m·Δϑ</b></p>${tb(['Stoff','c in kJ/(kg·K)'],[['Wasser','4,19'],['Aluminium','0,90'],['Eisen','0,45'],['Kupfer','0,39']])}<p>Wasser kann besonders viel Energie speichern. Das erklärt das milde Klima am Meer. Bei Experimenten mit Wasser gilt: Heizleistung · Zeit = c·m·Δϑ (ohne Verluste).</p><h3>Mischung</h3><p>Zwei Wassermengen (m₁, ϑ₁) und (m₂, ϑ₂) ergeben die Mischtemperatur ϑ<sub>m</sub> = (m₁·ϑ₁ + m₂·ϑ₂)/(m₁ + m₂). Die vom wärmeren Wasser abgegebene Wärme ist so groß wie die vom kälteren aufgenommene.</p>${M('Hypothese prüfen: Q hängt von Masse, Temperaturerhöhung und Stoff ab. Je mehr Masse und je größer Δϑ, desto mehr Energie.')}`,
q:[Q('Was gilt fachsprachlich für Wärme?','Sie ist Energie, die wegen eines Temperaturunterschieds übertragen wird',['Ein Körper enthält Wärme','Sie ist dasselbe wie Temperatur','Sie ist eine Zustandsgröße'],'Wärme ist eine Prozessgröße.'),Q('Wie lautet die Formel für die zugeführte Wärme?','Q = c·m·Δϑ',['Q = c/m·Δϑ','Q = m·g·h','Q = U·I'],'c ist die spezifische Wärmekapazität.'),Q('Warum hat Wasser eine große Bedeutung für das Klima?','Es kann viel Energie speichern (hohe spezifische Wärmekapazität)',['Es ist durchsichtig','Es ist leicht','Es siedet bei 100 °C'],'Meere dämpfen Temperaturschwankungen.'),Q('Wie ändert man die innere Energie eines Körpers?','Durch Arbeit oder Wärme',['Nur durch Wärme','Nur durch Arbeit','Gar nicht'],'ΔU = W + Q.')],
m:[()=>{const m=rnd(1,5),d=rnd(10,80),Q1=4.19*m*d;return{t:`Wie viel Wärme in kJ braucht man, um ${m} kg Wasser um ${d} K zu erwärmen? (c = 4,19 kJ/(kg·K))`,a:Q1,tol:rt(Q1),h:'Q = c·m·Δϑ'}},()=>{const P=rnd(5,12)*200,m=rnd(1,2),v0=rnd(10,20),t=4190*m*(100-v0)/P;return{t:`Ein Wasserkocher (${P} W) soll ${m} kg Wasser von ${v0} °C auf 100 °C erhitzen, ohne Verluste (c = 4190 J/(kg·K)). Wie lange dauert das in s?`,a:t,tol:rt(t),h:'P·t = c·m·Δϑ'}},()=>{const m1=rnd(1,4),m2=rnd(1,4),a=rnd(10,30),b=rnd(50,90),T=(m1*a+m2*b)/(m1+m2);return{t:`${m1} kg Wasser (${a} °C) werden mit ${m2} kg Wasser (${b} °C) gemischt. Wie groß ist die Mischtemperatur in °C?`,a:T,tol:rt(T),h:'ϑ<sub>m</sub> = (m₁ϑ₁ + m₂ϑ₂) / (m₁ + m₂)'}}]},
transport:{n:'Wärmeleitung, Konvektion, Wärmestrahlung',
h:`<h3>Temperaturunterschied als Ursache</h3><p>Zwischen Orten verschiedener Temperatur fließt Energie vom wärmeren zum kälteren Ort, bis die Temperaturen ausgeglichen sind. Dafür gibt es drei Mechanismen.</p>${tb(['Art','Beschreibung','Beispiel'],[['Wärmeleitung','Teilchen geben durch Stöße Bewegungsenergie weiter, ohne dass Stoff strömt. Metalle leiten gut, Luft schlecht.','Löffel im heißen Tee'],['Konvektion','Strömung eines Gases oder einer Flüssigkeit transportiert Energie. Warme Luft hat geringere Dichte und steigt.','Heizung, Meeresströmungen, Aufwind'],['Wärmestrahlung','Elektromagnetische Strahlung transportiert Energie, auch im Vakuum. Jeder Körper strahlt.','Sonne, Lagerfeuer']])}<h3>Anwendung</h3><p>Isolierung nutzt Luftpolster (schlechte Leitung, gehemmte Konvektion). Die Thermoskanne hat Vakuum (keine Leitung, keine Konvektion) und verspiegelte Wände (wenig Strahlung). Die Erde wird nur durch <b>Strahlung</b> von der Sonne erwärmt, in der Atmosphäre wirken außerdem Leitung und Konvektion.</p>${M('Leitung: Teilchen reichen Energie weiter. Konvektion: Stoff strömt. Strahlung: kein Stoff nötig.')}`,
q:[Q('Welche Art von Wärmetransport funktioniert auch im Vakuum?','Wärmestrahlung',['Wärmeleitung','Konvektion','Keine'],'Strahlung braucht keinen Stoff.'),Q('Warum steigt warme Luft nach oben?','Sie hat eine geringere Dichte',['Sie ist schwerer','Sie hat mehr Teilchen','Sie wird angezogen'],'Das ist die Grundlage der Konvektion.'),Q('Warum sind Metalle gute Wärmeleiter?','Energie wird zwischen den Teilchen sehr gut weitergegeben',['Sie sind schwer','Sie glänzen','Sie sind hart'],'Bei Metallen helfen auch frei bewegliche Elektronen.'),Q('Wie erreicht die Energie der Sonne die Erde?','Durch Strahlung',['Durch Leitung','Durch Konvektion','Durch Wind'],'Zwischen Sonne und Erde ist fast ein Vakuum.')]},
klima:{n:'Treibhauseffekt und Klima',
h:`<h3>Strahlungsgleichgewicht</h3><p>Die Erde nimmt Strahlung der Sonne auf und strahlt selbst im Infraroten ab. Im <b>Strahlungsgleichgewicht</b> sind aufgenommene und abgegebene Strahlungsleistung gleich, die mittlere Temperatur bleibt konstant.</p><h3>Treibhauseffekt</h3><p>Treibhausgase (Wasserdampf, CO₂, Methan, Lachgas) lassen sichtbares Sonnenlicht weitgehend durch, absorbieren aber Infrarotstrahlung der Erdoberfläche und strahlen einen Teil zur Erde zurück. Dadurch ist die Erdoberfläche wärmer, als sie ohne Atmosphäre wäre: etwa +15 °C statt −18 °C. Das ist der natürliche Treibhauseffekt. Im Energieflussdiagramm zeichnet man Pfeile für einfallende Sonnenstrahlung, Reflexion, Abstrahlung und Gegenstrahlung.</p><h3>Anthropogener Einfluss</h3><p>Verbrennt man fossile Brennstoffe, steigt der CO₂-Gehalt der Atmosphäre. Mehr Treibhausgase bedeuten mehr Gegenstrahlung. Es stellt sich ein neues Strahlungsgleichgewicht bei höherer Temperatur ein (Erderwärmung).</p><h3>Maßnahmen</h3><p>Auf persönlicher Ebene: Energie sparen, Mobilität, Ernährung, Konsum. Auf gesellschaftlicher Ebene: erneuerbare Energien, Effizienz, CO₂-Preis, internationale Klimaziele. Physikalisch diskutiert man vor allem Wirksamkeit und Größenordnung der Maßnahmen.</p>${M('Das Klima ändert sich, weil sich das Strahlungsgleichgewicht verschiebt, nicht weil Energie „entsteht“.')}`,
q:[Q('Was passiert im Strahlungsgleichgewicht?','Aufgenommene und abgegebene Strahlungsleistung sind gleich groß',['Die Erde heizt sich auf','Die Erde kühlt sich ab','Es gibt keine Strahlung'],'Dann ändert sich die mittlere Temperatur nicht.'),Q('Was ist die Ursache des natürlichen Treibhauseffekts?','Treibhausgase absorbieren Infrarotstrahlung und strahlen einen Teil zurück',['Die Atmosphäre reflektiert Sonnenlicht vollständig','Die Sonne wird wärmer','Der Mond erwärmt die Erde'],'Gegenstrahlung erwärmt die Oberfläche.'),Q('Welcher Vorgang verstärkt den Treibhauseffekt?','Verbrennen fossiler Brennstoffe',['Photosynthese','Regen','Wind'],'Der CO₂-Gehalt der Atmosphäre steigt.'),Q('Welche Aussage über Klimaschutzmaßnahmen ist physikalisch sinnvoll?','Man prüft ihre Wirksamkeit und Größenordnung',['Alle Maßnahmen wirken gleich stark','Maßnahmen sind unnötig','Nur Technik zählt'],'Quantitative Abschätzungen helfen beim Bewerten.')]}}},
p96:{n:'Ph9 4 Profilbereich NTG: Klima',g:9,d:'Rückkopplungen, Kippelemente, Quellen bewerten',t:{
profil:{n:'Rückkopplungen und Kippelemente',
h:`<h3>Ozeane</h3><p>Wasser erwärmt sich beim Erwärmen und dehnt sich aus. Die <b>thermische Ausdehnung</b> der Ozeane ist neben dem Abschmelzen von Eis eine Ursache für den Meeresspiegelanstieg. Wegen der hohen Wärmekapazität nehmen die Ozeane viel Energie auf und <b>dämpfen</b> die Erwärmungsgeschwindigkeit der Erde.</p><h3>Rückkopplungen</h3><p>Eine <b>positive Rückkopplung</b> verstärkt eine Änderung, eine <b>negative</b> schwächt sie ab.</p><ul><li><b>Eis-Albedo-Rückkopplung (positiv):</b> Eis reflektiert viel Sonnenlicht. Schmilzt es, nimmt dunkleres Wasser mehr Energie auf, die Erwärmung wird verstärkt.</li><li><b>Wasserdampf (positiv):</b> Wärmere Luft nimmt mehr Wasserdampf auf, einem Treibhausgas.</li><li><b>Abstrahlung (negativ):</b> Ein wärmerer Körper strahlt mehr ab, das begrenzt die Erwärmung.</li></ul><h3>Kippelemente</h3><p>Manche Teile des Klimasystems können bei Überschreiten einer Schwelle sprunghaft in einen neuen Zustand wechseln, z. B. das Abschmelzen der Eisschilde oder eine Instabilität der atlantischen Umwälzströmung. Solche Änderungen sind schwer umkehrbar.</p><h3>Quellen beurteilen</h3><p>Zu alternativen Erklärungen der Erderwärmung prüft man: Wer ist der Autor, welche Interessen hat er, sind die Argumente physikalisch stimmig, sind die Daten belegt?</p>${M('Wissenschaft prüft Behauptungen an Messdaten und Modellen. Ein Argument wird nicht richtig, weil es oft wiederholt wird.')}`,
q:[Q('Was ist eine positive Rückkopplung?','Sie verstärkt eine Änderung',['Sie schwächt eine Änderung ab','Sie ist immer gut','Sie hat keine Wirkung'],'Die Eis-Albedo-Rückkopplung ist ein Beispiel.'),Q('Warum verstärkt das Schmelzen von Eis die Erwärmung?','Dunkleres Wasser reflektiert weniger Sonnenlicht als Eis',['Wasser ist wärmer','Eis kühlt die Luft','Wasser ist leichter'],'Albedo sinkt, mehr Energie wird aufgenommen.'),Q('Welcher Vorgang trägt zum Meeresspiegelanstieg bei?','Die thermische Ausdehnung des Wassers',['Das Verdunsten von Wasser','Die Wolkenbildung','Die Ebbe'],'Wärmeres Wasser nimmt mehr Volumen ein.'),Q('Was ist ein Kippelement im Klimasystem?','Ein Teilsystem, das bei Überschreiten einer Schwelle in einen neuen Zustand wechseln kann',['Ein Messgerät','Eine Wolkenart','Ein Treibhausgas'],'Zum Beispiel die Eisschilde.')]}}},
p101:{n:'Ph10 1 Elektromagnetismus',g:10,d:'Magnetfeld, Lorentzkraft, Motor, Induktion, Transformator',t:{
magnet:{n:'Magnetfeld und Feldlinien',
h:`<h3>Feldbegriff</h3><p>Ein <b>Feld</b> ordnet jedem Punkt des Raumes eine Eigenschaft zu. Ein <b>Magnetfeld</b> übt auf Magnete und bewegte Ladungen Kräfte aus. Man veranschaulicht es mit <b>Feldlinien</b>: Sie zeigen die Richtung der Kraft auf einen Nordpol, sind geschlossen, schneiden sich nie, und je dichter sie liegen, desto stärker ist das Feld.</p><h3>Feldlinienbilder</h3><ul><li><b>Stabmagnet:</b> Außen verlaufen die Linien vom Nord- zum Südpol, im Inneren vom Süd- zum Nordpol.</li><li><b>Gerader Leiter:</b> kreisförmige Feldlinien um den Leiter.</li><li><b>Spule:</b> Im Inneren fast gleichmäßiges Feld, außen wie ein Stabmagnet.</li><li><b>Erde:</b> Das Erdmagnetfeld gleicht dem eines Stabmagneten. Der magnetische Südpol liegt nahe dem geografischen Nordpol. Ursache sind Strömungen im flüssigen Eisenkern.</li></ul><h3>Rechte-Faust-Regel</h3><p>Gerader Leiter: Daumen der rechten Hand zeigt in <b>technische Stromrichtung</b>, die gekrümmten Finger zeigen die Feldrichtung. Spule: Die Finger der rechten Hand umfassen die Spule in Stromrichtung, der Daumen zeigt zum <b>Nordpol</b> der Spule.</p>${M('Das Magnetfeld einer Spule ist stärker bei mehr Windungen, größerer Stromstärke und Eisenkern.')}`,
q:[Q('Wie verlaufen Feldlinien außerhalb eines Stabmagneten?','Vom Nordpol zum Südpol',['Vom Südpol zum Nordpol','Gerade nach außen','Im Kreis um den Äquator'],'Im Inneren verlaufen sie umgekehrt, die Linien sind geschlossen.'),Q('Wie lässt sich das Magnetfeld einer Spule verstärken?','Mehr Windungen, größerer Strom, Eisenkern',['Weniger Windungen','Kleinerer Strom','Kupferkern'],'Alle drei Maßnahmen erhöhen die Feldstärke.'),Q('Was zeigt der Daumen bei der Rechten-Faust-Regel für eine Spule?','Zum Nordpol der Spule',['Zum Südpol der Spule','In Stromrichtung','Quer zur Spule'],'Die Finger umfassen die Spule in Stromrichtung.'),Q('Wo liegt der magnetische Südpol der Erde?','In der Nähe des geografischen Nordpols',['Am geografischen Südpol','Am Äquator','Im Mond'],'Daher zeigt der Nordpol der Kompassnadel nach Norden.')]},
lorentz:{n:'Lorentzkraft und Elektromotor',
h:`<h3>Kraft auf stromdurchflossenen Leiter</h3><p>Ein stromdurchflossener Leiter im Magnetfeld erfährt eine Kraft <b>senkrecht</b> zur Stromrichtung und senkrecht zum Magnetfeld. Sie wirkt auf die bewegten Ladungen im Leiter und heißt <b>Lorentzkraft</b>. Die Richtung bestimmt die <b>Drei-Finger-Regel</b> der rechten Hand (Ursache – Vermittlung – Wirkung):</p>${tb(['Finger','Größe'],[['Daumen','Ursache: Stromrichtung (bewegte positive Ladung)'],['Zeigefinger','Vermittlung: Magnetfeldrichtung (Nord nach Süd)'],['Mittelfinger','Wirkung: Kraftrichtung']])}<p>Kehrt man Strom- oder Feldrichtung um, kehrt sich die Kraft um (Leiterschaukel). Die Kraft ist größer bei größerer Stromstärke, stärkerem Magnetfeld und längerem Leiterstück im Feld.</p><h3>Elektromotor</h3><p>In einer Spule im Magnetfeld erfahren die gegenüberliegenden Spulenseiten entgegengesetzte Kräfte, die Spule dreht sich. Ein <b>Kommutator</b> (Polwender) kehrt nach einer halben Umdrehung die Stromrichtung um, damit die Drehung weitergeht. Der Lauf lässt sich variieren: mehr Stromstärke, mehr Windungen, stärkerer Magnet.</p><p>Elektrische Energie wird in Bewegungsenergie umgewandelt (plus Abwärme).</p>${M('Motoren und Generatoren trieben im späten 19. Jahrhundert die Elektrifizierung von Fabriken, Straßenbahnen und Städten an. Technischer Fortschritt und sozialer Wandel gingen Hand in Hand.')}`,
q:[Q('Wozu dient der Kommutator beim Elektromotor?','Er kehrt nach einer halben Umdrehung die Stromrichtung um',['Er erzeugt das Magnetfeld','Er kühlt den Motor','Er speichert Energie'],'So wirkt das Drehmoment immer in dieselbe Richtung.'),Q('Was zeigt der Mittelfinger bei der Drei-Finger-Regel?','Die Kraftrichtung',['Die Stromrichtung','Die Feldrichtung','Die Drehrichtung der Erde'],'Daumen: Ursache, Zeigefinger: Vermittlung, Mittelfinger: Wirkung.'),Q('Wie ändert sich die Kraft, wenn man die Stromrichtung umkehrt?','Die Kraft kehrt ihre Richtung um',['Sie bleibt gleich','Sie verschwindet','Sie wird doppelt so groß'],'Die Richtung hängt von Strom- und Feldrichtung ab.'),Q('Welche Energieumwandlung findet im Elektromotor statt?','Elektrische Energie in Bewegungsenergie',['Bewegungsenergie in elektrische Energie','Wärme in Licht','Licht in Wärme'],'Der Generator macht das Umgekehrte.')]},
induktion:{n:'Induktion und Generator',
h:`<h3>Induktionsspannung</h3><p>Ändert sich das Magnetfeld im Inneren einer Spule, entsteht an ihr eine Spannung, die <b>Induktionsspannung</b>. Das gelingt durch Bewegen eines Magneten in der Spule, Bewegen der Spule im Feld oder Ein- und Ausschalten eines Spulenstroms. Ohne Änderung (Magnet ruht) gibt es keine Spannung.</p><h3>Je-desto-Aussagen</h3><ul><li>Je schneller sich das Magnetfeld ändert, desto größer ist die Induktionsspannung.</li><li>Je mehr Windungen die Spule hat, desto größer ist sie.</li><li>Je stärker der Magnet, desto größer ist sie.</li></ul><p>Die Richtung des Induktionsstroms ist so, dass er seiner Ursache entgegenwirkt.</p><h3>Generator</h3><p>Dreht man eine Spule im Magnetfeld (oder einen Magneten in einer Spule), entsteht eine <b>Wechselspannung</b>. Die Frequenz entspricht der Drehzahl; das Stromnetz hat 50 Hz. Bewegungsenergie wird in elektrische Energie umgewandelt (Fahrraddynamo, Kraftwerk).</p>${M('Induktion braucht eine Änderung des Magnetfelds. Ein ruhender Magnet in einer ruhenden Spule erzeugt nichts.')}`,
q:[Q('Wann entsteht in einer Spule eine Induktionsspannung?','Wenn sich das Magnetfeld in der Spule ändert',['Wenn ein Magnet in der Spule ruht','Nur bei Gleichstrom','Wenn die Spule kalt ist'],'Es kommt auf die Änderung an.'),Q('Was vergrößert die Induktionsspannung?','Schnellere Bewegung, mehr Windungen, stärkerer Magnet',['Langsamere Bewegung','Weniger Windungen','Schwächerer Magnet'],'Je-desto-Aussagen aus dem Experiment.'),Q('Welche Spannung liefert ein Generator typischerweise?','Wechselspannung',['Nur Gleichspannung','Keine Spannung','Immer 1 V'],'Die Spule dreht sich im Magnetfeld.'),Q('Welche Frequenz hat die Netzspannung in Deutschland?','50 Hz',['5 Hz','500 Hz','230 Hz'],'230 V ist die Spannung, nicht die Frequenz.')]},
trafo:{n:'Transformator',
h:`<h3>Aufbau und Funktion</h3><p>Ein <b>Transformator</b> besteht aus zwei Spulen (Primärspule mit N₁, Sekundärspule mit N₂ Windungen) auf einem gemeinsamen Eisenkern. Die Wechselspannung an der Primärspule erzeugt ein sich änderndes Magnetfeld im Eisenkern. Dieses induziert in der Sekundärspule eine Wechselspannung. Mit Gleichspannung funktioniert ein Trafo nicht, weil sich das Magnetfeld dann nicht ändert.</p><h3>Idealer Transformator</h3><p style="font-size:1.1rem">${fr('U₁','U₂')} = ${fr('N₁','N₂')} &nbsp; und &nbsp; ${fr('I₁','I₂')} = ${fr('N₂','N₁')}</p><p>Spannung und Stromstärke werden <b>gegenläufig</b> übersetzt. Mit dem Energiekonzept: P₁ = P₂, also U₁·I₁ = U₂·I₂. Hochtransformieren der Spannung bedeutet kleinere Stromstärke.</p><h3>Hochspannungsleitungen</h3><p>Die Verlustleistung in der Leitung ist P<sub>V</sub> = R·I². Wird die Spannung hoch transformiert, sinkt die Stromstärke und damit die Verlustleistung stark. Deshalb wird Energie über große Strecken mit Hochspannung übertragen. Reale Trafos haben einen Wirkungsgrad knapp unter 100 %.</p>${M('Spannung rauf, Strom runter, Leistung gleich (ideal).')}`,
q:[Q('Welche Größe wird beim idealen Transformator gleich übertragen?','Die Leistung',['Die Spannung','Die Stromstärke','Die Windungszahl'],'P₁ = P₂.'),Q('Primärspule 1000 Windungen, Sekundärspule 100 Windungen, U₁ = 230 V. Wie groß ist U₂?','23 V',['2300 V','230 V','2,3 V'],'U₂ = U₁·N₂/N₁.'),Q('Warum funktioniert ein Trafo nicht mit Gleichspannung?','Das Magnetfeld im Kern ändert sich nicht, es wird nichts induziert',['Gleichspannung ist zu klein','Der Eisenkern schmilzt','Die Spulen sind zu kurz'],'Induktion braucht eine Feldänderung.'),Q('Warum werden Überlandleitungen mit Hochspannung betrieben?','Die Stromstärke und damit die Verlustleistung sinken',['Die Leitung wird dünner und teurer','Die Spannung geht verloren','Es gibt keinen Grund'],'P<sub>V</sub> = R·I².')],
m:[()=>{const N1=rnd(1,5)*200,k=pick([2,.5,.1,.25,5]),U=pick([12,24,230]);return{t:`Ein idealer Trafo hat ${N1} Windungen primär und ${N1*k} Windungen sekundär. Die Primärspannung beträgt ${U} V. Wie groß ist die Sekundärspannung in V?`,a:U*k,tol:rt(U*k),h:'U₁/U₂ = N₁/N₂'}},()=>{const U1=230,U2=pick([6,12,23,46]),N1=rnd(2,6)*100,N2=N1*U2/U1;return{t:`Ein idealer Trafo setzt ${U1} V auf ${U2} V herunter. Die Primärspule hat ${N1} Windungen. Wie viele Windungen hat die Sekundärspule (auf eine ganze Zahl gerundet)?`,a:Math.round(N2),tol:.6}},()=>{const I1=pick([.1,.2,.5]),k=pick([2,5,10,.1,.2]);return{t:`Ein idealer Trafo überträgt die Spannung im Verhältnis 1 : ${k}. Primär fließen ${dz(I1)} A. Wie groß ist die Stromstärke sekundär in A?`,a:I1/k,tol:.005,h:'Spannung und Stromstärke werden gegenläufig übersetzt (P₁ = P₂).'}}]}}},
p102:{n:'Ph10 2 Impulserhaltung in der Mechanik',g:10,d:'Impuls, Stöße, Wechselwirkungsgesetz',t:{
impuls:{n:'Impuls und Stöße',
h:`<h3>Impuls</h3><p>Der <b>Impuls</b> eines Körpers ist <b>p = m·v</b> (Einheit kg·m/s = N·s). Er ist eine <b>gerichtete</b> Größe (Vektor), die Energie dagegen nicht.</p><h3>Impulserhaltung</h3><p>In einem abgeschlossenen System bleibt der Gesamtimpuls erhalten: p<sub>vorher</sub> = p<sub>nachher</sub>. In zwei Dimensionen gilt das komponentenweise (x- und y-Richtung getrennt). Das zeigt man z. B. mit Stößen auf dem Luftkissentisch.</p><h3>Eindimensionale Stöße</h3>${tb(['Stoßart','Impuls','kinetische Energie'],[['elastisch (Körper trennen sich)','bleibt erhalten','bleibt erhalten'],['unelastisch (Körper bleiben zusammen)','bleibt erhalten','nimmt ab (Verformung, Wärme)']])}<p>Unelastischer Stoß, Körper 2 ruht zunächst:</p><p style="font-size:1.1rem">m₁·v₁ = (m₁ + m₂)·v′ &nbsp;⇒&nbsp; v′ = ${fr('m₁·v₁','m₁ + m₂')}</p><p>Beispiel: Ein Wagen (2 kg, 3 m/s) stößt auf einen ruhenden Wagen (1 kg) und beide haften: v′ = 6/3 = 2 m/s. Energie vorher 9 J, nachher 6 J, also gehen 3 J in Verformung und Wärme über.</p>${M('Impuls und Energie sind verschiedene Erhaltungsgrößen. Beim unelastischen Stoß bleibt nur der Impuls erhalten.')}`,
q:[Q('Welche Formel gilt für den Impuls?','p = m·v',['p = ½·m·v²','p = m·g·h','p = F·s'],'Impuls = Masse mal Geschwindigkeit.'),Q('Was bleibt bei einem unelastischen Stoß erhalten?','Der Gesamtimpuls',['Die kinetische Energie','Beides','Nichts'],'Ein Teil der Bewegungsenergie wird umgewandelt.'),Q('Was bedeutet „Impuls ist eine gerichtete Größe“?','Er hat neben dem Betrag auch eine Richtung',['Er ist immer positiv','Er hat keine Einheit','Er ist gleich der Energie'],'Bei Stößen in 2D rechnet man komponentenweise.'),Q('Was gilt bei einem elastischen Stoß?','Impuls und kinetische Energie bleiben erhalten',['Nur der Impuls','Nur die Energie','Keines von beiden'],'Die Körper trennen sich nach dem Stoß.')],
m:[()=>{const m=rnd(1,10),v=rnd(2,20);return{t:`Ein Körper (${m} kg) bewegt sich mit ${v} m/s. Wie groß ist sein Impuls in kg·m/s?`,a:m*v}},()=>{const m1=rnd(1,4),m2=rnd(1,4),v=rnd(2,9),vs=m1*v/(m1+m2);return{t:`Ein Wagen (${m1} kg, ${v} m/s) stößt unelastisch auf einen ruhenden Wagen (${m2} kg). Wie schnell bewegen sich beide danach in m/s (2 Nachkommastellen)?`,a:vs,tol:rt(vs),h:'m₁·v₁ = (m₁ + m₂)·v′'}},()=>{const m1=rnd(1,4),m2=rnd(1,4),v=rnd(2,9),vs=m1*v/(m1+m2),dE=.5*m1*v*v-.5*(m1+m2)*vs*vs;return{t:`Ein Wagen (${m1} kg, ${v} m/s) stößt unelastisch auf einen ruhenden Wagen (${m2} kg). Wie viel kinetische Energie in J geht in Verformung und Wärme über (2 Nachkommastellen)?`,a:dE,tol:rt(dE),h:'E<sub>vorher</sub> − E<sub>nachher</sub>'}}]},
wwg:{n:'Wechselwirkungsgesetz',
h:`<h3>Kräfte treten paarweise auf</h3><p><b>Wechselwirkungsgesetz:</b> Übt ein Körper A auf einen Körper B eine Kraft aus, übt B auf A eine gleich große, entgegengesetzt gerichtete Kraft aus: <b>F<sub>AB</sub> = −F<sub>BA</sub></b>. Beide Kräfte greifen an <b>verschiedenen Körpern</b> an und treten immer zusammen auf.</p><h3>Nicht verwechseln: Kräftegleichgewicht</h3><p>Beim <b>Kräftegleichgewicht</b> wirken zwei Kräfte auf <b>denselben Körper</b> und heben sich auf (z. B. Gewichtskraft und Auflagekraft eines ruhenden Buches). Ein Wechselwirkungspaar greift dagegen an zwei Körpern an (z. B. Erde zieht Buch, Buch zieht Erde).</p><h3>Zusammenhang mit der Impulserhaltung</h3><p>Weil die Kraft die Impulsänderung bestimmt (F = Δp/Δt), erfahren beide Körper entgegengesetzt gleich große Impulsänderungen. Der Gesamtimpuls bleibt erhalten.</p><p>Beispiele: Rückstoß beim Schuss, Rakete, Schwimmen (Wasser wird nach hinten gedrückt), Gehen (Fuß drückt Boden nach hinten, Boden drückt Mensch nach vorn).</p>${M('Wechselwirkungspaar: zwei Körper, zwei gleich große entgegengesetzte Kräfte. Kräftegleichgewicht: ein Körper, zwei Kräfte.')}`,
q:[Q('Was besagt das Wechselwirkungsgesetz?','Zwei Körper üben gleich große, entgegengesetzte Kräfte aufeinander aus',['Die Summe der Kräfte an einem Körper ist null','Kräfte wirken nur in eine Richtung','Der größere Körper übt mehr Kraft aus'],'Die Kräfte greifen an verschiedenen Körpern an.'),Q('Ein Buch liegt auf dem Tisch. Welche beiden Kräfte bilden ein Kräftegleichgewicht?','Gewichtskraft und Auflagekraft auf das Buch',['Erde zieht Buch und Buch zieht Erde','Tisch zieht Buch und Buch zieht Tisch','Keine'],'Beide wirken auf dasselbe Buch.'),Q('Was passiert beim Abschuss einer Kugel mit dem Gewehr?','Das Gewehr bekommt einen Rückstoß mit entgegengesetztem Impuls',['Nichts','Das Gewehr bekommt denselben Impuls wie die Kugel','Die Kugel bekommt keinen Impuls'],'Der Gesamtimpuls bleibt null.'),Q('Wie hängt das Wechselwirkungsgesetz mit der Impulserhaltung zusammen?','Die Impulsänderungen beider Körper sind entgegengesetzt gleich groß',['Gar nicht','Der Impuls geht verloren','Nur die Energie bleibt erhalten'],'F = Δp/Δt für beide Körper.')],
m:[()=>{const m1=rnd(1,5)*10,v=rnd(2,6),m2=rnd(1,5)*100;return{t:`Eine Person (${m1} kg) springt mit ${v} m/s von einem ruhenden Boot (${m2} kg) ab. Mit welcher Geschwindigkeit in m/s (Betrag, 2 Nachkommastellen) bewegt sich das Boot?`,a:m1*v/m2,tol:rt(m1*v/m2),h:'m₁·v₁ = m₂·v₂ (Gesamtimpuls null)'}},()=>{const m=rnd(2,6)/100,v=rnd(2,8)*100,M2=rnd(2,5);const x=m*v/M2;return{t:`Ein Gewehr (${M2} kg) schießt eine Kugel (${dz(m)} kg) mit ${v} m/s ab. Mit welcher Geschwindigkeit in m/s (Betrag, 2 Nachkommastellen) bewegt sich das Gewehr zurück?`,a:x,tol:rt(x)}},()=>{const F=rnd(2,20)*10;return{t:`Die Erde zieht einen Körper mit ${F} N an. Wie groß ist die Kraft in N, die der Körper auf die Erde ausübt?`,a:F,h:'Wechselwirkungsgesetz'}}]}}},
p103:{n:'Ph10 3 Bewegungen und ihre Modellierung',g:10,d:'Diagramme, Bewegungsfunktionen, waagrechter Wurf, Verkehr',t:{
kinem:{n:'Bewegungsfunktionen und Diagramme',
h:`<h3>Gleichförmige Bewegung</h3><p>Konstante Geschwindigkeit v: <b>x(t) = x₀ + v·t</b>. Das Zeit-Ort-Diagramm ist eine Gerade, deren Steigung die Geschwindigkeit ist. Das Zeit-Geschwindigkeit-Diagramm ist eine waagrechte Gerade, die Fläche darunter ist der zurückgelegte Weg. Umrechnung: km/h ÷ 3,6 = m/s.</p><h3>Konstante Beschleunigung</h3><p>Bei der Beschleunigung a gilt</p>${tb(['Größe','Funktion','Diagramm'],[['Geschwindigkeit','v(t) = v₀ + a·t','Gerade (linear)'],['Ort','x(t) = x₀ + v₀·t + ½·a·t²','Parabel (quadratisch)']])}<p>Aus v² = v₀² + 2a·Δx lässt sich die Zeit eliminieren. Die Steigung im t-x-Diagramm ist die momentane Geschwindigkeit, die Steigung im t-v-Diagramm die Beschleunigung, die Fläche unter dem t-v-Graphen der Weg.</p><h3>Freier Fall</h3><p>Ohne Luftwiderstand gilt a = g = 9,81 m/s²: <b>v = g·t</b>, <b>h = ½·g·t²</b>. Die Fallzeit aus der Höhe h ist t = √(2h/g), die Aufprallgeschwindigkeit v = √(2·g·h).</p>${M('Die Bewegungsfunktion eines Körpers mit konstanter Beschleunigung ist eine quadratische Funktion. Diesen Zusammenhang kennst du aus der Mathematik (Parabel).')}`,
w:plotW({tx:'Stelle x₀, v₀ und a ein. Du siehst das Zeit-Ort-Diagramm einer Bewegung mit konstanter Beschleunigung. Mit dem Knopf bekommst du eine Zielkurve.',f:(t,q)=>q[0]+q[1]*t+.5*q[2]*t*t,X:[0,8],Y:[-10,40],ps:[{k:'x₀',min:0,max:10,step:1,v:0},{k:'v₀',min:-5,max:10,step:1,v:2},{k:'a',min:-3,max:3,step:.5,v:0}],fm:q=>`x(t) = ${dz(q[0])} ${sg(q[1])}·t ${sg(.5*q[2])}·t²`}),wl:'Graph',
q:[Q('Was zeigt die Steigung im Zeit-Ort-Diagramm?','Die Geschwindigkeit',['Die Beschleunigung','Den Weg','Die Zeit'],'Δx/Δt.'),Q('Welche Form hat das Zeit-Ort-Diagramm bei konstanter Beschleunigung?','Eine Parabel',['Eine Gerade','Eine Hyperbel','Einen Kreis'],'x(t) enthält den Term ½·a·t².'),Q('Wie groß ist die Geschwindigkeit nach 3 s im freien Fall (v₀ = 0, g = 9,81 m/s²)?','29,4 m/s',['9,81 m/s','3 m/s','88,3 m/s'],'v = g·t.'),Q('Was ist die Fläche unter dem Graphen im Zeit-Geschwindigkeit-Diagramm?','Der zurückgelegte Weg',['Die Beschleunigung','Die Zeit','Die Kraft'],'Weg = v·t bei konstanter Geschwindigkeit.')],
m:[()=>{const v=rnd(2,30),t=rnd(2,30);return{t:`Ein Fahrrad fährt ${t} s lang mit ${v} km/h. Wie weit kommt es in m (1 Nachkommastelle)?`,a:v/3.6*t,tol:rt(v/3.6*t),h:'km/h durch 3,6 teilen'}},()=>{const a=rnd(1,5),t=rnd(2,10);return{t:`Ein Auto beschleunigt aus der Ruhe mit ${a} m/s² konstant. Welche Strecke in m legt es in ${t} s zurück?`,a:.5*a*t*t,h:'x = ½·a·t²'}},()=>{const t=rnd(1,5);return{t:`Ein Stein fällt ${t} s lang frei (g = 9,81 m/s², ohne Luftwiderstand). Aus welcher Höhe in m ist er gefallen (2 Nachkommastellen)?`,a:.5*GG*t*t,tol:rt(.5*GG*t*t),h:'h = ½·g·t²'}}]},
wurf:{n:'Waagrechter Wurf',
h:`<h3>Überlagerung zweier Bewegungen</h3><p>Beim waagrechten Wurf wird ein Körper aus der Höhe h mit der Anfangsgeschwindigkeit v₀ horizontal abgeworfen. Man betrachtet die Bewegung <b>komponentenweise</b>:</p>${tb(['Richtung','Bewegung','Funktion'],[['x (waagrecht)','gleichförmig mit v₀','x(t) = v₀·t, v<sub>x</sub> = v₀'],['y (senkrecht)','freier Fall','y(t) = h − ½·g·t², v<sub>y</sub> = −g·t']])}<p>Beide Bewegungen laufen unabhängig. Die Bahnkurve ist eine <b>Parabel</b>: y(x) = h − ${fr('g','2·v₀²')}·x².</p><h3>Wichtige Größen</h3><ul><li>Fallzeit: t<sub>F</sub> = √(2h/g). Sie hängt <b>nicht</b> von v₀ ab.</li><li>Wurfweite: w = v₀·t<sub>F</sub>.</li><li>Auftreffgeschwindigkeit: |v| = √(v₀² + (g·t<sub>F</sub>)²) = √(v₀² + 2g·h).</li></ul><p>Koordinatenschreibweise: <b>r(t) = (v₀·t | h − ½·g·t²)</b>. Das passt zum Experiment mit dem horizontal abgeschossenen Ball. Abweichungen zwischen Messung und Rechnung kommen z. B. von Luftwiderstand und Messunsicherheit.</p>${M('Waagrecht: nichts ändert sich, v bleibt v₀. Senkrecht: freier Fall. Eine Kugel, die waagrecht fliegt, fällt gleich schnell wie eine, die losgelassen wird.')}`,
w:plotW({tx:'Bahnkurve eines waagrechten Wurfs. Stelle die Abwurfgeschwindigkeit v₀ und die Höhe h ein. Die Wurfweite steht unten. Mit dem Knopf bekommst du eine Zielbahn.',f:(x,q)=>{const y=q[1]-GG*x*x/(2*q[0]*q[0]);return y<0?NaN:y},X:[0,14],Y:[0,10],ps:[{k:'v₀',min:1,max:10,step:1,v:5},{k:'h',min:1,max:10,step:1,v:5}],fm:q=>`Wurfweite w = ${dz(r2(q[0]*Math.sqrt(2*q[1]/GG)))} m`}),wl:'Bahn',
q:[Q('Welche Bahnform hat der waagrechte Wurf (ohne Luftwiderstand)?','Eine Parabel',['Eine Gerade','Einen Kreis','Eine Ellipse'],'y(x) = h − g·x² / (2·v₀²).'),Q('Wovon hängt die Fallzeit beim waagrechten Wurf nicht ab?','Von der Abwurfgeschwindigkeit v₀',['Von der Höhe h','Von g','Von keiner Größe'],'t = √(2h/g).'),Q('Wie ändert sich v<sub>x</sub> während des Fluges?','Gar nicht, v<sub>x</sub> = v₀',['Es nimmt zu','Es nimmt ab','Es wechselt das Vorzeichen'],'In x-Richtung wirkt keine Kraft.'),Q('Wie berechnet man die Wurfweite?','w = v₀·t<sub>F</sub>',['w = ½·g·t²','w = h·v₀','w = g·v₀'],'Waagrechte Bewegung: gleichförmig.')],
m:[()=>{const h=rnd(1,20),t=Math.sqrt(2*h/GG);return{t:`Ein Ball wird aus ${h} m Höhe waagrecht abgeworfen. Wie lange dauert der Flug in s (2 Nachkommastellen)?`,a:t,tol:rt(t),h:'t = √(2h/g)'}},()=>{const h=rnd(1,20),v=rnd(2,15),w=v*Math.sqrt(2*h/GG);return{t:`Ein Ball wird aus ${h} m Höhe mit ${v} m/s waagrecht abgeworfen. Wie weit fliegt er in m (1 Nachkommastelle)?`,a:w,tol:rt(w),h:'w = v₀·√(2h/g)'}},()=>{const h=rnd(2,20),v=rnd(2,15),s=Math.sqrt(v*v+2*GG*h);return{t:`Ein Ball wird aus ${h} m Höhe mit ${v} m/s waagrecht abgeworfen. Mit welchem Geschwindigkeitsbetrag in m/s trifft er auf (1 Nachkommastelle)?`,a:s,tol:rt(s),h:'|v| = √(v₀² + 2·g·h)'}}]},
verkehr:{n:'Anhalteweg und Verkehrssicherheit',
h:`<h3>Anhalteweg</h3><p>Der <b>Anhalteweg</b> setzt sich zusammen aus <b>Reaktionsweg</b> und <b>Bremsweg</b>:</p><p style="font-size:1.1rem">s<sub>A</sub> = s<sub>R</sub> + s<sub>B</sub> = v·t<sub>R</sub> + ${fr('v²','2·a')}</p><ul><li>Reaktionszeit t<sub>R</sub> ≈ 1 s (länger bei Müdigkeit, Ablenkung, Alkohol). Während dieser Zeit fährt das Fahrzeug mit v weiter.</li><li>Bremsverzögerung a: ca. 8 m/s² (trockener Asphalt), 4 bis 5 m/s² (nass), 1 bis 2 m/s² (Eis).</li><li>v in m/s einsetzen (km/h ÷ 3,6).</li></ul><p>Beispiel: 50 km/h ≈ 13,9 m/s: s<sub>R</sub> ≈ 14 m, s<sub>B</sub> ≈ 12 m, s<sub>A</sub> ≈ 26 m. Bei 100 km/h: s<sub>R</sub> ≈ 28 m, s<sub>B</sub> ≈ 48 m, s<sub>A</sub> ≈ 76 m.</p><p>Bei doppelter Geschwindigkeit wird der Bremsweg <b>viermal</b> so lang.</p><h3>Kritische Situationen bewerten</h3><p>Mit abgeschätzten Werten lässt sich prüfen, ob ein Hindernis rechtzeitig erreicht wird. Mögliche Sicherheitsvorkehrungen: Abstand halten, Geschwindigkeit anpassen, Handyverbot, technische Hilfen (ABS, Notbremsassistent). Reflektiere, wie du dich selbst als Rad- oder Autofahrer verhältst.</p>${M('Bremsweg wächst mit v². Wer schneller fährt, gewinnt wenig Zeit und verliert viel Sicherheit.')}`,
q:[Q('Woraus setzt sich der Anhalteweg zusammen?','Reaktionsweg plus Bremsweg',['Nur aus dem Bremsweg','Reaktionsweg minus Bremsweg','Bremsweg mal Zeit'],'Zuerst vergeht die Reaktionszeit.'),Q('Wie ändert sich der Bremsweg bei doppelter Geschwindigkeit?','Er wird 4-mal so lang',['Er wird doppelt so lang','Er bleibt gleich','Er wird halb so lang'],'s<sub>B</sub> = v²/(2a).'),Q('Welchen Wert hat die Bremsverzögerung auf nasser Straße etwa?','4 bis 5 m/s²',['9 bis 10 m/s²','1 m/s²','20 m/s²'],'Auf trockenem Asphalt sind es etwa 8 m/s².'),Q('Wie rechnet man 72 km/h in m/s um?','20 m/s',['72 m/s','259 m/s','7,2 m/s'],'72 : 3,6 = 20.')],
m:[()=>{const v=rnd(2,15)*10;return{t:`Rechne ${v} km/h in m/s um (1 Nachkommastelle).`,a:v/3.6,tol:.06}},()=>{const v=pick([10,15,20,25,30]),a=pick([4,5,8]);return{t:`Ein Auto fährt mit ${v} m/s und bremst mit ${a} m/s². Wie lang ist der Bremsweg in m (2 Nachkommastellen)?`,a:v*v/(2*a),tol:rt(v*v/(2*a)),h:'s = v²/(2a)'}},()=>{const kmh=pick([30,50,70,100,130]),v=kmh/3.6,s=v*1+v*v/16;return{t:`Ein Auto fährt mit ${kmh} km/h. Reaktionszeit 1 s, Bremsverzögerung 8 m/s². Wie lang ist der Anhalteweg in m (1 Nachkommastelle)?`,a:s,tol:rt(s),h:'s<sub>A</sub> = v·t<sub>R</sub> + v²/(2a), v in m/s'}}]}}},
p104:{n:'Ph10 4 Kernphysik',g:10,d:'Atomkern, Zerfälle, Halbwertszeit, Kernenergie, Strahlenschutz',t:{
kern:{n:'Atomkern und Quarks',
h:`<h3>Aufbau des Kerns</h3><p>Der Atomkern besteht aus <b>Protonen</b> (positiv) und <b>Neutronen</b> (ungeladen), zusammen <b>Nukleonen</b> genannt. Mit der Protonenzahl (Kernladungszahl) Z, der Neutronenzahl N und der Nukleonenzahl (Massenzahl) <b>A = Z + N</b> schreibt man ein Nuklid als <sup>A</sup><sub>Z</sub>X, z. B. <sup>14</sup><sub>6</sub>C (6 Protonen, 8 Neutronen). <b>Isotope</b> eines Elements haben dasselbe Z, aber verschiedenes N (¹²C, ¹⁴C).</p><h3>Quarks</h3><p>Nukleonen bestehen aus <b>Quarks</b>. Ein up-Quark hat die Ladung +⅔ e, ein down-Quark −⅓ e.</p>${tb(['Nukleon','Quarks','Ladung'],[['Proton','u u d','+⅔ + ⅔ − ⅓ = +1 e'],['Neutron','u d d','+⅔ − ⅓ − ⅓ = 0']])}<p>Die Protonen im Kern stoßen sich elektrisch ab. Zusammengehalten wird der Kern durch die <b>starke Wechselwirkung</b>, die auf kurze Distanzen wirkt und stärker ist als die elektrische Abstoßung.</p>${M('Bei einer Umwandlung im Kern ändern sich nur die Quarkzusammensetzung der Nukleonen, zum Beispiel wird ein down-Quark zu einem up-Quark (β⁻-Zerfall).')}`,
q:[Q('Was ist die Nukleonenzahl A?','Protonenzahl plus Neutronenzahl',['Nur die Protonenzahl','Nur die Neutronenzahl','Die Zahl der Elektronen'],'A = Z + N.'),Q('Woraus besteht ein Proton?','Aus zwei up-Quarks und einem down-Quark',['Aus drei up-Quarks','Aus einem up- und zwei down-Quarks','Aus Elektronen'],'Ladung: ⅔ + ⅔ − ⅓ = +1.'),Q('Was haben Isotope eines Elements gemeinsam?','Die Protonenzahl',['Die Neutronenzahl','Die Nukleonenzahl','Die Masse'],'Sie unterscheiden sich in N.'),Q('Was hält den Atomkern zusammen?','Die starke Wechselwirkung',['Die Gravitation allein','Die elektrische Anziehung','Der Magnetismus'],'Sie überwiegt die elektrische Abstoßung der Protonen.')],
m:[()=>{const [A,Z,x]=pick([[14,6,'C'],[12,6,'C'],[235,92,'U'],[238,92,'U'],[60,27,'Co'],[131,53,'I'],[226,88,'Ra'],[40,19,'K'],[137,55,'Cs']]);return{t:`Wie viele Neutronen hat das Nuklid ${A}${x} (Kernladungszahl Z = ${Z})?`,a:A-Z,h:'N = A − Z'}},()=>{const [A,Z,x]=pick([[14,6,'C'],[235,92,'U'],[60,27,'Co'],[131,53,'I'],[226,88,'Ra'],[137,55,'Cs']]);return{t:`Das Nuklid ${x} hat ${A-Z} Neutronen und die Nukleonenzahl ${A}. Wie groß ist die Kernladungszahl Z?`,a:Z}},()=>{const Z=rnd(10,40),N=rnd(10,50);return{t:`Ein Kern hat ${Z} Protonen und ${N} Neutronen. Wie viele Nukleonen hat er?`,a:Z+N}}]},
zerfall:{n:'α-, β- und γ-Strahlung, Zerfallsgleichungen',
h:`<h3>Strahlungsarten</h3>${tb(['Strahlung','Teilchen','Abschirmung','Veränderung des Kerns'],[['α','Heliumkern ⁴₂He (2 p, 2 n)','Papier, wenige cm Luft','A − 4, Z − 2'],['β⁻','Elektron e⁻, ein Neutron wandelt sich in ein Proton','Aluminiumblech (einige mm)','A gleich, Z + 1'],['γ','energiereiche Photonen','Blei, Beton','keine Änderung von A und Z, Kern gibt Energie ab']])}<p>γ-Strahlung folgt oft auf einen α- oder β-Zerfall, wenn der Kern noch angeregt ist. α-Strahlung ionisiert sehr stark, ist aber leicht abzuschirmen. γ-Strahlung durchdringt viel Materie.</p><h3>Zerfallsgleichungen</h3><p><sup>238</sup><sub>92</sub>U → <sup>234</sup><sub>90</sub>Th + <sup>4</sup><sub>2</sub>He (α-Zerfall)</p><p><sup>60</sup><sub>27</sub>Co → <sup>60</sup><sub>28</sub>Ni + e⁻ + Antineutrino (β⁻-Zerfall, danach γ)</p><p>Auf beiden Seiten stimmen die Summe der Nukleonenzahlen A und die Summe der Ladungen (Z) überein. Beim β⁻-Zerfall wandelt sich ein down-Quark in ein up-Quark um (Neutron → Proton).</p>${M('α: A−4, Z−2. β⁻: A bleibt, Z+1. γ: keine Änderung. Immer beide Zahlen bilanzieren.')}`,
q:[Q('Woraus besteht α-Strahlung?','Aus Heliumkernen',['Aus Elektronen','Aus Photonen','Aus Neutronen'],'2 Protonen und 2 Neutronen.'),Q('Wie ändert sich Z bei einem β⁻-Zerfall?','Z nimmt um 1 zu',['Z nimmt um 1 ab','Z nimmt um 2 ab','Z bleibt gleich'],'Ein Neutron wird zum Proton.'),Q('Welche Strahlung ist durch Papier abgeschirmt?','α-Strahlung',['γ-Strahlung','β-Strahlung','Alle'],'α-Teilchen haben nur geringe Reichweite.'),Q('Was ändert sich bei einem reinen γ-Zerfall?','Weder A noch Z, nur die Energie des Kerns',['Z um 2','A um 4','Z um 1'],'Der Kern gibt ein Photon ab.')],
m:[()=>{const A=rnd(100,240);return{t:`Ein Kern mit der Nukleonenzahl A = ${A} zerfällt durch α-Zerfall. Wie groß ist die Nukleonenzahl des Tochterkerns?`,a:A-4}},()=>{const Z=rnd(60,92);return{t:`Ein Kern mit Z = ${Z} Protonen zerfällt durch α-Zerfall. Wie groß ist die Kernladungszahl des Tochterkerns?`,a:Z-2}},()=>{const Z=rnd(60,92);return{t:`Ein Kern mit Z = ${Z} zerfällt zuerst durch α-Zerfall und dann durch β⁻-Zerfall. Welche Kernladungszahl hat der Endkern?`,a:Z-1,h:'α: Z − 2, β⁻: Z + 1'}}]},
hwz:{n:'Halbwertszeit und Zerfallsgesetz',
h:`<h3>Zufall und Gesetzmäßigkeit</h3><p>Wann ein einzelner Kern zerfällt, ist zufällig. Bei sehr vielen Kernen zeigt sich eine feste Gesetzmäßigkeit: Nach der <b>Halbwertszeit T</b> ist die Hälfte der ursprünglichen Kerne zerfallen.</p><p style="font-size:1.1rem">N(t) = N₀·(½)<sup>t/T</sup></p><p>Das ist ein exponentieller Zerfall. In der Schreibweise aus der Mathematik: <b>B(t) = B(0)·a<sup>t</sup></b> mit dem Faktor a = (½)<sup>1/T</sup> pro Zeiteinheit. Die <b>Aktivität</b> A = ΔN/Δt (Zerfälle pro Sekunde, Einheit Bq = 1/s) nimmt im gleichen Verhältnis ab.</p>${tb(['Nuklid','Halbwertszeit'],[['Iod-131','ca. 8 Tage'],['Cobalt-60','ca. 5,3 Jahre'],['Cäsium-137','ca. 30 Jahre'],['Radium-226','ca. 1600 Jahre'],['Kohlenstoff-14','ca. 5730 Jahre']])}<h3>Bestimmung</h3><p>Graphisch aus der Zerfallskurve: Lies die Zeit ab, in der der Wert auf die Hälfte fällt. Rechnerisch: Aus dem Verhältnis N/N₀ und der Zeit t folgt die Anzahl der Halbwertszeiten (z. B. ⅛ nach 3 Halbwertszeiten). Mit der Halbwertszeit lassen sich Isotope identifizieren und Altersbestimmungen (¹⁴C-Methode) durchführen.</p>${M('Nach 1 Halbwertszeit ½, nach 2 ¼, nach 3 ⅛, nach 10 etwa ein Tausendstel.')}`,
w:plotW({tx:'Zerfallskurve N(t) = N₀·(½)^(t/T). Stelle N₀ und T ein und lies die Halbwertszeit ab. Mit dem Knopf bekommst du eine Zielkurve.',f:(t,q)=>q[0]*Math.pow(.5,t/q[1]),X:[0,10],Y:[0,200],ps:[{k:'N₀',min:50,max:200,step:50,v:100},{k:'T',min:1,max:5,step:1,v:2}],fm:q=>`N(t) = ${q[0]}·(½)<sup>t/${q[1]}</sup>`}),wl:'Zerfallskurve',
q:[Q('Wie viel ist nach drei Halbwertszeiten noch vorhanden?','Ein Achtel',['Ein Drittel','Ein Sechstel','Die Hälfte'],'(½)³ = ⅛.'),Q('Was ist die Halbwertszeit?','Die Zeit, nach der die Hälfte der Kerne zerfallen ist',['Die Hälfte der Lebensdauer eines Kerns','Die Zeit bis alle Kerne zerfallen sind','Die Hälfte der Aktivität'],'Sie ist für jedes Nuklid charakteristisch.'),Q('Ist der Zeitpunkt des Zerfalls eines einzelnen Kerns vorhersagbar?','Nein, er ist zufällig',['Ja, genau','Ja, nach genau T','Nur bei α-Strahlern'],'Nur für viele Kerne gilt das Zerfallsgesetz.'),Q('Welche Funktionsart beschreibt den radioaktiven Zerfall?','Exponentiell fallend',['Linear fallend','Quadratisch','Konstant'],'Pro Zeitschritt wird mit demselben Faktor multipliziert.')],
m:[()=>{const k=rnd(1,5),N=rnd(1,8)*64;return{t:`Von ${N} Kernen eines Nuklids sind nach ${k} Halbwertszeiten noch wie viele unzerfallen?`,a:N/2**k,tol:.01}},()=>{const T=rnd(2,10),k=rnd(1,4),N=rnd(1,5)*160;return{t:`Ein Nuklid hat die Halbwertszeit ${T} Tage. Anfangs sind ${N} Kerne vorhanden. Wie viele sind nach ${k*T} Tagen noch übrig?`,a:N/2**k,tol:.01}},()=>{const T=rnd(2,10),k=rnd(1,4),N=rnd(1,5)*160;return{t:`Von ${N} Kernen sind nach einer Zeit t noch ${N/2**k} übrig. Die Halbwertszeit beträgt ${T} Tage. Wie groß ist t in Tagen?`,a:k*T,h:'Wie oft wurde halbiert?'}}]},
energie:{n:'Masse-Energie-Äquivalenz und Kernreaktor',
h:`<h3>Masse und Energie</h3><p>Nach Einstein sind Masse und Energie äquivalent: <b>E = Δm·c²</b> mit c = 3,00·10⁸ m/s. Ändert sich bei einem Prozess die Gesamtmasse um Δm (<b>Massendefekt</b>), wird Energie in dieser Größe freigesetzt. Praktisch: 1 u = 1,66·10⁻²⁷ kg entspricht <b>931,5 MeV</b> (1 MeV = 1,602·10⁻¹³ J).</p><h3>α-Zerfall</h3><p>Die Summe der Massen von Tochterkern und α-Teilchen ist kleiner als die Masse des Ausgangskerns. Die Differenz Δm wird als kinetische Energie der Produkte frei: E = Δm·c². Beim Zerfall von Uran-238 sind es etwa 4,3 MeV.</p><h3>Kernspaltung und Reaktor</h3><p>Ein Neutron spaltet einen Uran-235-Kern in zwei Bruchstücke und setzt 2 bis 3 weitere Neutronen sowie etwa 200 MeV frei. So entsteht eine <b>Kettenreaktion</b>.</p>${tb(['Bauteil im Reaktor','Aufgabe'],[['Brennstäbe','enthalten spaltbares Uran'],['Moderator (Wasser)','bremst Neutronen ab, damit sie Kerne spalten'],['Steuerstäbe','absorbieren Neutronen und regeln die Reaktion'],['Kühlmittel','transportiert die Wärme zum Dampferzeuger']])}<p>Die Wärme erzeugt Dampf, der eine Turbine mit Generator antreibt (Wärme, Bewegungsenergie, elektrische Energie).</p>${M('Bei Kernreaktionen sind die Energien rund eine Million Mal größer als bei chemischen Reaktionen. Dafür gelten besondere Sicherheitsanforderungen.')}`,
q:[Q('Wie lautet die Äquivalenz von Masse und Energie?','E = Δm·c²',['E = m·g·h','E = ½·m·v²','E = U·I·t'],'Massendefekt mal Lichtgeschwindigkeit zum Quadrat.'),Q('Wozu dient der Moderator im Reaktor?','Er bremst Neutronen ab',['Er absorbiert Neutronen','Er kühlt die Turbine','Er speichert Strom'],'Langsame Neutronen spalten U-235 besser.'),Q('Wozu dienen die Steuerstäbe?','Sie absorbieren Neutronen und regeln die Kettenreaktion',['Sie sind der Brennstoff','Sie bremsen Neutronen','Sie erzeugen Dampf'],'Eingefahren bremsen sie die Reaktion.'),Q('Wie viel Energie entspricht 1 u?','Etwa 931,5 MeV',['Etwa 1 MeV','Etwa 1 J','Etwa 931,5 J'],'Das ist der Umrechnungsfaktor.')],
m:[()=>{const x=rnd(1,9);return{t:`Ein Massendefekt beträgt ${x}·10⁻²⁹ kg. Wie groß ist die freigesetzte Energie in der Einheit 10⁻¹³ J (c = 3,00·10⁸ m/s)?`,a:x*9,tol:.05,h:'E = Δm·c²'}},()=>{const k=rnd(1,9);return{t:`Ein Massendefekt beträgt ${dz(k/1000)} u. Wie viel Energie in MeV wird frei (1 u ≙ 931,5 MeV, 1 Nachkommastelle)?`,a:k/1000*931.5,tol:rt(k/1000*931.5),h:'E = Δm · 931,5 MeV/u'}},()=>{const E=pick([1,4.3,5,8,200]);return{t:`Rechne ${dz(E)} MeV in die Einheit 10⁻¹³ J um (1 MeV = 1,602·10⁻¹³ J, 2 Nachkommastellen).`,a:E*1.602,tol:rt(E*1.602)}}]},
strahl:{n:'Strahlenwirkung und Strahlenschutz',
h:`<h3>Biologische Wirkung</h3><p>Ionisierende Strahlung (α, β, γ, Röntgenstrahlung) schlägt Elektronen aus Atomen und Molekülen. In Zellen kann sie die DNA schädigen und so Krebs oder Erbgutveränderungen verursachen. Die biologische Wirkung beschreibt die <b>Äquivalenzdosis</b> in Sievert (1 Sv = 1 J/kg), die Strahlenart und Gewebe berücksichtigt. Die natürliche Strahlenbelastung beträgt in Deutschland etwa 2 bis 3 mSv pro Jahr (Boden, Radon, Höhenstrahlung, Nahrung).</p><h3>Strahlenschutz</h3>${tb(['Maßnahme','Wirkung'],[['Abstand vergrößern','Intensität nimmt mit 1/r² ab (doppelter Abstand: ein Viertel)'],['Abschirmen','Papier (α), Aluminium (β), Blei oder Beton (γ)'],['Aufenthaltszeit verkürzen','Dosis ist proportional zur Zeit'],['Aufnahme in den Körper vermeiden','Inkorporation (Atmen, Essen) ist besonders gefährlich bei α-Strahlern']])}<h3>Nutzen und Risiko</h3><p>Anwendungen: Medizin (Röntgen, Szintigrafie, Krebstherapie), Altersbestimmung, Sterilisation, Materialprüfung. Bewerte immer Nutzen und Risiko und beziehe außerfachliche Aspekte ein (Gesundheit, Umwelt, Kosten, Gesellschaft). Prüfe Argumente in Medien auf fachliche Korrektheit und die Interessen der Urheber.</p>${M('Je weniger Dosis, desto besser: Abstand, Abschirmung, Zeit. Aber auch der Nutzen zählt, etwa bei medizinischer Diagnostik.')}`,
q:[Q('Welche Einheit hat die Äquivalenzdosis?','Sievert (Sv)',['Becquerel (Bq)','Watt (W)','Joule (J)'],'1 Sv = 1 J/kg. Becquerel ist die Aktivität.'),Q('Wie ändert sich die Strahlungsintensität bei doppeltem Abstand zur punktförmigen Quelle?','Sie sinkt auf ein Viertel',['Sie halbiert sich','Sie bleibt gleich','Sie verdoppelt sich'],'Intensität ∝ 1/r².'),Q('Womit schirmt man γ-Strahlung gut ab?','Mit Blei oder dicken Betonwänden',['Mit Papier','Mit einem Blatt Alufolie','Gar nicht'],'γ-Strahlung durchdringt viel Material.'),Q('Warum ist ein α-Strahler im Körper besonders gefährlich?','Er gibt seine Energie auf kleinem Raum an das Gewebe ab',['α-Strahlung ist unsichtbar','α-Strahlung ist radioaktiver','Er ist immer schwerer'],'α-Strahlung ionisiert sehr stark.')],
m:[()=>{const k=rnd(2,5),I=rnd(1,8)*100;return{t:`Im Abstand 1 m von einer punktförmigen Quelle beträgt die Intensität ${I} Einheiten. Wie groß ist sie im Abstand ${k} m?`,a:I/(k*k),tol:rt(I/(k*k)),h:'I ∝ 1/r²'}},()=>{const P=rnd(1,9)*5,t=rnd(2,12);return{t:`Die Dosisleistung an einem Ort beträgt ${P} µSv/h. Welche Dosis in µSv erhält man bei ${t} h Aufenthalt?`,a:P*t}},()=>{const D=rnd(2,6),y=rnd(1,5);return{t:`Die jährliche natürliche Strahlenbelastung beträgt ${D} mSv. Welche Dosis in mSv ergibt sich in ${y} Jahren?`,a:D*y}}]}}},
p105:{n:'Ph10 5 Profilbereich NTG: Halbleiter',g:10,d:'Halbleiter, Diode, Transistor',t:{
diode:{n:'Halbleiter, Diode und Transistor',
h:`<h3>Halbleiter</h3><p><b>Halbleiter</b> (Silizium, Germanium) leiten schlechter als Metalle, aber besser als Isolatoren. Ihre Leitfähigkeit steigt mit der Temperatur und mit <b>Dotierung</b>: n-Dotierung bringt zusätzliche bewegliche Elektronen, p-Dotierung erzeugt „Löcher“ (Elektronenmangel).</p><h3>Diode</h3><p>Eine <b>Diode</b> hat einen pn-Übergang. In <b>Durchlassrichtung</b> leitet sie erst ab einer Schwellenspannung (Silizium ≈ 0,7 V), in <b>Sperrrichtung</b> fließt praktisch kein Strom. Die Kennlinie I(U) ist daher nicht linear (kein ohmscher Widerstand). Anwendungen: Gleichrichter, <b>LED</b> (Photonen entstehen bei der Rekombination), Solarzelle (umgekehrter Vorgang).</p><p>Eine LED braucht einen Vorwiderstand: R = (U₀ − U<sub>LED</sub>)/I.</p><h3>Transistor</h3><p>Ein bipolarer Transistor hat drei Anschlüsse: Basis (B), Kollektor (C) und Emitter (E). Ein kleiner Basisstrom I<sub>B</sub> steuert einen großen Kollektorstrom I<sub>C</sub> = B·I<sub>B</sub>. Als <b>Schalter</b>: Basisstrom an, Transistor leitet; aus, Transistor sperrt. Als <b>Verstärker</b>: kleine Änderungen von I<sub>B</sub> bewirken große Änderungen von I<sub>C</sub>.</p>${M('Diode: Einbahnstraße für den Strom. Transistor: Wasserhahn, den ein kleiner Strom auf- und zudreht.')}`,
w:plotW({tx:'Kennlinie einer Diode: Stelle die Schwellenspannung und die Steilheit ein. Unterhalb der Schwelle (und in Sperrrichtung) fließt kein Strom. Mit dem Knopf bekommst du eine Zielkennlinie.',f:(u,q)=>u<q[0]?0:(u-q[0])*q[1],X:[-2,2],Y:[-1,8],ps:[{k:'U₀',min:.3,max:1,step:.1,v:.7},{k:'k',min:1,max:5,step:1,v:3}],fm:q=>`Schwellenspannung ${dz(q[0])} V, Steilheit ${q[1]} mA/V`}),wl:'Kennlinie',
q:[Q('Wann leitet eine Silizium-Diode?','In Durchlassrichtung ab etwa 0,7 V',['In beiden Richtungen immer','Nur in Sperrrichtung','Nur bei 230 V'],'Darunter fließt fast kein Strom.'),Q('Was bewirkt die Dotierung eines Halbleiters?','Sie erhöht die Zahl beweglicher Ladungsträger',['Sie macht ihn zum Isolator','Sie verringert die Leitfähigkeit auf null','Sie ändert nichts'],'n: Elektronen, p: Löcher.'),Q('Wozu braucht man bei einer LED einen Vorwiderstand?','Er begrenzt die Stromstärke',['Er macht die LED heller als erlaubt','Er erzeugt die Spannung','Er dient als Dekoration'],'Ohne ihn fließt ein zu großer Strom.'),Q('Was ist die Hauptaufgabe eines Transistors?','Ein kleiner Strom steuert einen großen (Schalter, Verstärker)',['Er speichert Energie','Er erzeugt Spannung','Er leitet nur Wärme'],'I<sub>C</sub> = B·I<sub>B</sub>.')],
m:[()=>{const U0=pick([5,9,12]),I=pick([10,20]),R=(U0-2)/(I/1000);return{t:`Eine LED (Betriebsspannung 2 V) soll bei ${I} mA an ${U0} V betrieben werden. Wie groß muss der Vorwiderstand in Ω sein?`,a:R,tol:rt(R),h:'R = (U₀ − U<sub>LED</sub>) / I, I in A'}},()=>{const U=pick([3,5,9]),R=pick([100,200,500]),I=(U-.7)/R*1000;return{t:`Eine Si-Diode (0,7 V Schwellenspannung) liegt in Durchlassrichtung mit einem Widerstand von ${R} Ω an ${U} V. Wie groß ist die Stromstärke in mA (2 Nachkommastellen)?`,a:I,tol:rt(I),h:'I = (U − 0,7 V) / R'}},()=>{const B=pick([50,100,200]),IB=pick([.1,.2,.5]);return{t:`Ein Transistor hat die Stromverstärkung B = ${B}. Der Basisstrom beträgt ${dz(IB)} mA. Wie groß ist der Kollektorstrom in mA?`,a:B*IB,h:'I<sub>C</sub> = B·I<sub>B</sub>'}}]}}}
}};F.chemie={"n":"Chemie","sb":"NTG · Jahrgangsstufen 9 und 10","c":"#46b7a0","sub":{"c9_1":{"n":"Wie Chemiker denken und arbeiten","g":9,"d":"Gefahrstoffe, Erkenntnisweg, Modelle, Daten und Fachsprache","t":{"grundlagen":{"n":"Sicher experimentieren und wissenschaftlich arbeiten","h":"<h3>Gefahrstoffe und Sicherheit</h3><p>Chemikalien können ätzend, giftig, reizend, entzündlich oder umweltgefährlich sein. Das GHS-System kennzeichnet Gefahren mit Piktogrammen. <b>H-Sätze</b> beschreiben Gefahren, <b>P-Sätze</b> nennen Schutzmaßnahmen. Vor jedem Versuch werden Etikett und Sicherheitsinformationen gelesen. Schutzbrille, geeignete Kleidung und die Anweisungen der Lehrkraft sind verbindlich. Chemikalien niemals probieren oder direkt einatmen. Reinigungsmittel niemals miteinander mischen. Abfälle nach schulischen Vorgaben getrennt sammeln.</p><h3>Erkenntnisweg</h3><p>Eine chemische Untersuchung beginnt mit einer Beobachtung und einer Fragestellung. Eine Hypothese ist eine überprüfbare Vermutung. Danach werden Versuch, veränderte und gemessene Größen sowie Kontrollbedingungen geplant. Messwerte werden dokumentiert, in Tabellen oder Diagrammen dargestellt und interpretiert. Anschließend wird die Hypothese beurteilt und nach Fehlerquellen gesucht.</p><h3>Stoff- und Teilchenebene</h3><p>Auf der Stoffebene beschreiben wir Beobachtungen wie Farbänderung, Gasentwicklung oder Temperaturänderung. Auf der Teilchenebene erklären wir diese Beobachtungen mithilfe von Atomen, Molekülen und Ionen. Die Ebenen dürfen nicht verwechselt werden.</p><h3>Modelle, Fachsprache und Bewertung</h3><p>Modelle vereinfachen die Wirklichkeit und besitzen Grenzen. Sie müssen anhand von Beobachtungen geprüft und gegebenenfalls weiterentwickelt werden. Fachsprache und Formelsprache machen Aussagen eindeutig. Quellen werden auf Belege, Aktualität und mögliche Interessen geprüft. Chemische Anwendungen werden hinsichtlich Nutzen, Risiken und Folgen für Mensch und Umwelt abgewogen.</p><div class=merke>Beobachtung → Fragestellung → Hypothese → Experiment → Daten → Auswertung → Bewertung. H-Sätze = Gefahren, P-Sätze = Schutzmaßnahmen.</div>","q":[["Was beschreiben H-Sätze?",["Gefahrenhinweise","Schutzmaßnahmen","Messwerte","Entsorgungsorte"],0,"H-Sätze beschreiben die Gefahren eines Stoffes oder Gemisches."],["Was ist eine Hypothese?",["Eine überprüfbare Vermutung","Ein endgültiger Beweis","Ein Messgerät","Eine beliebige Meinung"],0,"Eine Hypothese wird durch geeignete Experimente geprüft."],["Welche Aussage gehört zur Stoffebene?",["Die Lösung färbt sich blau","Ein Elektronenpaar wird geteilt","Ein Ion besitzt die Ladung 2+","Ein Orbital wird besetzt"],0,"Eine beobachtete Farbänderung ist eine Beschreibung auf der Stoffebene."],["Warum müssen Modelle kritisch betrachtet werden?",["Sie vereinfachen die Wirklichkeit und haben Grenzen","Sie sind immer vollständig richtig","Sie ersetzen alle Experimente","Sie können nie verändert werden"],0,"Modelle bilden nur ausgewählte Aspekte ab und werden durch neue Erkenntnisse weiterentwickelt."],["Wie werden Chemikalienreste entsorgt?",["Nach schulischen Vorgaben getrennt sammeln","Immer in den Ausguss geben","Mit allen anderen Stoffen vermischen","In Getränkeflaschen füllen"],0,"Die Entsorgung richtet sich nach Stoffeigenschaften und Sicherheitsvorgaben."]]}}},"c9_2":{"n":"Atombau und gekürztes Periodensystem","g":9,"d":"Kern-Hülle-Modell, Isotope, Energiestufen, Ionisierungsenergie und Edelgasregel","t":{"grundlagen":{"n":"Vom Kern-Hülle-Modell zum Periodensystem","h":"<h3>Atomkern und Elektronenhülle</h3><p>Ein Atom besteht aus einem positiv geladenen Kern mit Protonen und Neutronen sowie einer negativ geladenen Elektronenhülle. Protonen tragen die Ladung +1, Neutronen 0 und Elektronen −1. Ein neutrales Atom besitzt gleich viele Protonen wie Elektronen. Die <b>Ordnungszahl Z</b> gibt die Protonenzahl an. Die <b>Nukleonenzahl A</b> ist Protonenzahl plus Neutronenzahl; damit gilt N = A − Z.</p><h3>Isotope</h3><p>Isotope sind Atome desselben Elements mit gleicher Protonenzahl, aber unterschiedlicher Neutronenzahl. Beispiel: Kohlenstoff-12 und Kohlenstoff-14 haben beide sechs Protonen, aber sechs bzw. acht Neutronen.</p><h3>Energiestufen und Ionisierungsenergie</h3><p>Elektronen können nur bestimmte Energiestufen einnehmen. Beim Übergang auf eine höhere Stufe wird Energie aufgenommen, beim Zurückfallen abgegeben. Die <b>Ionisierungsenergie</b> ist die Energie, die nötig ist, um ein Elektron aus einem gasförmigen Atom zu entfernen. Große Sprünge zwischen aufeinanderfolgenden Ionisierungsenergien weisen auf den Übergang von Außenelektronen zu inneren Elektronen hin. Flammenfärbung und Linienspektren beruhen auf solchen Energieübergängen.</p><h3>Periodensystem und Ionen</h3><p>Die Elemente sind nach steigender Ordnungszahl geordnet. Die Periode gibt im einfachen Schalenmodell die Zahl der besetzten Energiestufen an. Bei Hauptgruppenelementen gibt die Hauptgruppe Hinweise auf die Valenzelektronenzahl. Atome bilden häufig Ionen, um eine energetisch günstige Edelgaskonfiguration zu erreichen: Natrium wird zu Na⁺, Magnesium zu Mg²⁺ und Sauerstoff zu O²⁻. Das Modell ist eine Vereinfachung und gilt nicht ausnahmslos.</p><div class=merke>Z = Protonenzahl; A = Protonen + Neutronen. Periode = besetzte Energiestufen. Hauptgruppe = Valenzelektronen (Hauptgruppen).</div>","q":[["Was gibt die Ordnungszahl an?",["Die Protonenzahl","Die Neutronenzahl","Die Nukleonenzahl","Die Zahl der Isotope"],0,"Die Protonenzahl bestimmt das Element."],["Ein Atom hat Z = 11 und A = 23. Wie viele Neutronen besitzt es?",["12","11","23","34"],0,"N = A − Z = 23 − 11 = 12."],["Was sind Isotope?",["Atome desselben Elements mit unterschiedlicher Neutronenzahl","Atome mit unterschiedlicher Protonenzahl desselben Elements","Geladene Moleküle","Atome ohne Elektronen"],0,"Isotope haben gleiche Protonenzahl und unterschiedliche Neutronenzahl."],["Was ist die Ionisierungsenergie?",["Energie zum Entfernen eines Elektrons aus einem gasförmigen Atom","Energie zum Schmelzen eines Stoffes","Energie zur Bildung eines Neutrons","Energie zum Spalten des Atomkerns"],0,"Ionisierung bedeutet, ein Elektron vollständig aus dem Atom zu entfernen."],["Welches Ion bildet Sauerstoff häufig?",["O²⁻","O⁺","O²⁺","O⁻"],0,"Sauerstoff nimmt häufig zwei Elektronen auf und bildet ein zweifach negatives Ion."]]}}},"c9_3":{"n":"Donator-Akzeptor-Konzept – Elektronenübergänge","g":9,"d":"Ionenbildung, Salzbildung, Elektrolyse, Metallabscheidung und Batterien","t":{"grundlagen":{"n":"Redoxreaktionen, Elektrolyse und Batterien","h":"<h3>Elektronenübergänge</h3><p>Bei einer Redoxreaktion werden Elektronen übertragen. Der <b>Elektronendonator</b> gibt Elektronen ab und wird oxidiert. Der <b>Elektronenakzeptor</b> nimmt Elektronen auf und wird reduziert. Oxidation und Reduktion laufen immer gekoppelt ab. Beispiel: <code>Na → Na⁺ + e⁻</code> und <code>Cl + e⁻ → Cl⁻</code>.</p><h3>Salzbildung und Gitterenergie</h3><p>Bei der Salzbildung entstehen aus Metall- und Nichtmetallatomen Ionen. Entgegengesetzt geladene Ionen ziehen sich an und bilden ein Ionengitter. Bei dessen Bildung wird Gitterenergie frei. Sie trägt dazu bei, dass die Gesamtreaktion der Salzbildung exotherm verlaufen kann.</p><h3>Metalle in Metallsalzlösungen</h3><p>Ein unedleres Metall kann Ionen eines edleren Metalls reduzieren. Beispiel: <code>Zn + Cu²⁺ → Zn²⁺ + Cu</code>. Zink gibt Elektronen ab, Kupfer(II)-Ionen nehmen sie auf. Redoxteilgleichungen machen diese Vorgänge sichtbar.</p><h3>Elektrolyse</h3><p>Bei der Elektrolyse erzwingt elektrische Energie eine Redoxreaktion. Kationen wandern zur Kathode und werden dort reduziert; an der Anode findet Oxidation statt. Bei einer Kupfer(II)-chlorid-Lösung kann an der Kathode Kupfer entstehen: <code>Cu²⁺ + 2 e⁻ → Cu</code>. Die Produkte hängen von Elektrolyt, Elektroden und Bedingungen ab.</p><h3>Batterien und Reversibilität</h3><p>Eine galvanische Zelle nutzt eine freiwillige Redoxreaktion zur Stromerzeugung. Beim Entladen wird chemische in elektrische Energie umgewandelt. Beim Laden eines Akkus wird durch Energiezufuhr eine Gegenreaktion erzwungen. „Leer“ bedeutet daher nicht, dass keine Stoffe mehr vorhanden sind. Rohstoffbedarf, Recycling und Entsorgung sind wichtige ökologische Aspekte.</p><div class=merke>Oxidation = Elektronenabgabe; Reduktion = Elektronenaufnahme. Elektrolyse erzwingt, Batterie nutzt eine freiwillige Redoxreaktion.</div>","q":[["Was geschieht bei einer Oxidation?",["Elektronen werden abgegeben","Elektronen werden aufgenommen","Neutronen werden übertragen","Die Protonenzahl steigt"],0,"Oxidation ist die Abgabe von Elektronen."],["Was geschieht an der Kathode einer Elektrolyse?",["Reduktion: Teilchen nehmen Elektronen auf","Oxidation: Teilchen geben Elektronen ab","Es findet keine Reaktion statt","Es entstehen immer Protonen"],0,"An der Kathode werden Elektronen aufgenommen."],["Was passiert bei Zn + Cu²⁺ → Zn²⁺ + Cu?",["Zink wird oxidiert, Kupfer(II) wird reduziert","Zink wird reduziert, Kupfer oxidiert","Beide Stoffe werden oxidiert","Es findet eine Neutralisation statt"],0,"Zink gibt Elektronen ab; Kupfer(II)-Ionen nehmen sie auf."],["Was treibt eine Elektrolyse an?",["Zugeführte elektrische Energie","Eine freiwillige Reaktion","Ausschließlich Wärme","Die Schwerkraft"],0,"Elektrolyse benötigt elektrische Energie, um die Reaktion zu erzwingen."],["Was bedeutet das Laden eines Akkus?",["Eine durch Energiezufuhr erzwungene Gegenreaktion","Dass alle Stoffe entfernt werden","Dass keine Redoxreaktion stattfindet","Dass der Akku mit Wasser gefüllt wird"],0,"Beim Laden wird die Entladereaktion durch Energiezufuhr umgekehrt."]]}}},"c9_4":{"n":"Moleküle – Orbitalmodell und Molekülbau","g":9,"d":"Orbitale, Elektronenpaarbindung, Valenzstrichformeln, Mesomerie, Geometrie und Kohlenwasserstoffe","t":{"grundlagen":{"n":"Elektronenpaarbindung und räumlicher Molekülbau","h":"<h3>Orbitalmodell</h3><p>Ein Orbital beschreibt einen Aufenthaltsraum, in dem sich ein Elektron mit hoher Wahrscheinlichkeit befindet. Atome können Bindungen bilden, wenn geeignete Atomorbitale überlappen. Dabei entstehen Molekülorbitale. Ein bindendes Molekülorbital besitzt geringere Energie und stabilisiert die Bindung; ein antibindendes Orbital besitzt höhere Energie.</p><h3>Valenzstrichformeln und Bindigkeit</h3><p>Ein Strich in einer Valenzstrichformel steht für ein gemeinsames Elektronenpaar. Freie Elektronenpaare werden ebenfalls eingezeichnet. Die Edelgasregel hilft, typische Bindigkeiten vorherzusagen: H bildet meist eine, O zwei, N drei und C vier Bindungen. Einfach-, Doppel- und Dreifachbindungen enthalten ein, zwei bzw. drei gemeinsame Elektronenpaare. Formalladungen müssen mit der Gesamtladung übereinstimmen.</p><h3>Mesomerie</h3><p>Manche Teilchen lassen sich nur durch mehrere Grenzstrukturen beschreiben. Die tatsächliche Elektronenverteilung ist delokalisiert. Beim Carbonat-Ion sind dadurch die drei C–O-Bindungen gleichwertig. Grenzstrukturen sind keine wechselnden realen Zustände, sondern Modellbilder.</p><h3>Elektronenpaarabstoßungsmodell</h3><p>Elektronengruppen am Zentralatom stoßen sich ab und ordnen sich mit möglichst großem Abstand an. Zwei Gruppen führen zu linearer, drei zu trigonal-planarer, vier zu tetraedrischer Anordnung. Freie Elektronenpaare beanspruchen mehr Raum: Wasser ist gewinkelt, Ammoniak trigonal-pyramidal, Methan tetraedrisch.</p><h3>Kohlenwasserstoffe und Nomenklatur</h3><p>Alkane besitzen Einfachbindungen, Alkene mindestens eine C=C-Doppelbindung und Alkine mindestens eine C≡C-Dreifachbindung. Verzweigte und ringförmige Moleküle können Konstitutionsisomere bilden. Bei Doppelbindungen kann E/Z-Isomerie auftreten. Molekül-, Struktur-, Halbstruktur- und Skelettformeln zeigen unterschiedliche Details; systematische Namen und Formeln sollen ineinander übersetzt werden können.</p><div class=merke>Ein Strich = ein bindendes Elektronenpaar. EPA-Modell erklärt die Molekülgestalt. Alkane -an, Alkene -en, Alkine -in.</div>","q":[["Was stellt ein Strich in einer Valenzstrichformel dar?",["Ein bindendes Elektronenpaar","Ein Proton","Ein Neutron","Eine Energiestufe"],0,"Ein Strich symbolisiert zwei gemeinsam genutzte Elektronen."],["Welche Gestalt besitzt Methan CH₄?",["Tetraedrisch","Linear","Gewinkelt","Trigonal-planar"],0,"Vier bindende Elektronengruppen ordnen sich tetraedrisch an."],["Warum ist das Wassermolekül gewinkelt?",["Zwei freie Elektronenpaare am Sauerstoff beeinflussen die Anordnung","Wasser besitzt keine Elektronen","Wasser ist ein Ionengitter","Die Wasserstoffatome stoßen sich nicht ab"],0,"Zwei bindende und zwei freie Elektronenpaare führen zur gewinkelten Gestalt."],["Was beschreibt Mesomerie?",["Eine delokalisierte Elektronenverteilung, die mehrere Grenzstrukturen benötigt","Das Wandern ganzer Atome zwischen Molekülen","Die Bildung eines Ionengitters","Eine Kernreaktion"],0,"Mehrere Grenzstrukturen beschreiben gemeinsam dieselbe reale Elektronenverteilung."],["Welche Bindung kennzeichnet ein Alkin?",["Mindestens eine C≡C-Dreifachbindung","Mindestens eine C=C-Doppelbindung","Nur Einfachbindungen","Eine Ionenbindung"],0,"Alkine enthalten mindestens eine Kohlenstoff-Kohlenstoff-Dreifachbindung."]]}}},"c9_5":{"n":"Wechselwirkungskonzept – Anziehung zwischen Teilchen","g":9,"d":"Elektronegativität, organische Stoffklassen, zwischenmolekulare Kräfte, Wasser und Lösevorgänge","t":{"grundlagen":{"n":"Polarität, Stoffeigenschaften und Lösungsvorgänge","h":"<h3>Elektronegativität und Polarität</h3><p>Elektronegativität beschreibt, wie stark ein Atom Bindungselektronen anzieht. Bei unterschiedlicher Elektronegativität entstehen Partialladungen δ⁺ und δ⁻; die Bindung ist polar. Die Molekülpolarität hängt zusätzlich von der Geometrie ab: CO₂ ist linear und insgesamt unpolar, Wasser ist gewinkelt und ein Dipol.</p><h3>Organische Stoffklassen</h3><p>Funktionelle Gruppen kennzeichnen Stoffklassen: Alkohole besitzen eine Hydroxygruppe (–OH), Aldehyde eine Aldehydgruppe (–CHO), Ketone eine Carbonylgruppe (>C=O) und Carbonsäuren eine Carboxygruppe (–COOH). Typische Vertreter sind Ethanol, Ethanal, Propanon und Ethansäure. IUPAC-Namen helfen, Moleküle eindeutig zu benennen.</p><h3>Zwischenmolekulare Wechselwirkungen</h3><ul><li><b>London-Dispersionskräfte:</b> wirken zwischen allen Teilchen.</li><li><b>Dipol-Dipol-Wechselwirkungen:</b> zwischen permanenten Dipolen.</li><li><b>Wasserstoffbrücken:</b> besonders starke Wechselwirkungen bei H–N, H–O oder H–F.</li><li><b>Ion-Dipol-Wechselwirkungen:</b> zwischen Ionen und polaren Molekülen.</li></ul><p>Diese Kräfte beeinflussen Siedetemperatur, Viskosität und Löslichkeit. Molekülgröße, Gestalt und Oberfläche spielen ebenfalls eine Rolle.</p><h3>Wasser und Lösemittel</h3><p>Wasser ist polar und bildet Wasserstoffbrücken. Es besitzt eine ungewöhnlich hohe Siedetemperatur, hohe Oberflächenspannung und eine Dichteanomalie: Bei etwa 4 °C ist seine Dichte am größten. Polare und ionische Stoffe lösen sich häufig gut in Wasser; unpolare Stoffe eher in Benzin. Als Faustregel gilt: Ähnliches löst sich in Ähnlichem.</p><h3>Salze lösen sich</h3><p>Beim Lösen wird das Ionengitter aufgebrochen und die Ionen werden von Wassermolekülen umgeben. Dies heißt Hydratation. Die Energiebilanz aus Gitterzerlegung und Hydratation entscheidet, ob Wärme aufgenommen oder abgegeben wird. Lösungsenthalpien können durch Temperaturmessungen quantitativ verglichen werden. Erdölprodukte wie Kohlenwasserstoffe werden als Schmierstoffe und Lösemittel verwendet; ihre Umweltfolgen müssen beurteilt werden.</p><div class=merke>Molekülpolarität = Bindungspolarität + Geometrie. Wasser ist polar. Hydratation stabilisiert Ionen in Lösung.</div>","q":[["Warum ist CO₂ insgesamt unpolar?",["Die lineare Geometrie hebt die Bindungsdipole auf","Die C=O-Bindungen sind unpolar","CO₂ enthält keine Elektronen","Kohlenstoff ist ein Ion"],0,"Die beiden gleich großen Bindungsdipole zeigen in entgegengesetzte Richtungen."],["Welche Gruppe kennzeichnet Alkohole?",["Hydroxygruppe –OH","Carboxygruppe –COOH","Aldehydgruppe –CHO","Carbonylgruppe >C=O"],0,"Alkohole besitzen eine Hydroxygruppe."],["Welche Wechselwirkung tritt zwischen allen Molekülen auf?",["London-Dispersionskräfte","Nur Wasserstoffbrücken","Nur Ion-Dipol-Wechselwirkungen","Nur Ionenbindungen"],0,"London-Dispersionskräfte wirken zwischen allen Teilchen."],["Wann können Wasserstoffbrücken auftreten?",["Wenn H an N, O oder F gebunden ist und mit einem freien Elektronenpaar wechselwirkt","Zwischen beliebigen Metallen","Nur zwischen Edelgasen","Nur in unpolaren Kohlenwasserstoffen"],0,"Wasserstoffbrücken setzen stark polarisierte H–N-, H–O- oder H–F-Bindungen voraus."],["Was bedeutet Hydratation?",["Wassermoleküle lagern sich an gelöste Ionen an","Ein Salz wird zu einem Metall","Wasser wird verdampft","Ein Molekül wird oxidiert"],0,"Wassermoleküle umgeben die Ionen und stabilisieren sie in Lösung."]]}}},"c10_1":{"n":"Wie Chemiker denken und arbeiten","g":10,"d":"Selbstständige Experimente, Maßlösungen, Titration, Datenkritik und Entscheidungsfindung","t":{"grundlagen":{"n":"Quantitativ arbeiten und Entscheidungen begründen","h":"<h3>Selbstständige Untersuchungen</h3><p>Komplexere Phänomene aus Alltag und Technik werden in chemische Fragestellungen übersetzt. Schülerinnen und Schüler formulieren Hypothesen, planen qualitative oder quantitative Experimente, wählen Messmethoden aus und dokumentieren ihre Ergebnisse selbstständig. Messdaten werden auf Gültigkeit, Trends, Strukturen, Beziehungen und mögliche Störgrößen geprüft.</p><h3>Konzentrationen</h3><p>Die Stoffmengenkonzentration ist <code>c = n/V</code>, wobei n die Stoffmenge in mol und V das Volumen in Litern ist. Beim Verdünnen bleibt die Stoffmenge des gelösten Stoffes gleich: <code>c₁V₁ = c₂V₂</code>. Der Massenanteil ist <code>w = m(Stoff)/m(Lösung)</code>; die Massenkonzentration gibt die Masse pro Volumen an. Diese Größen sind nicht zu verwechseln.</p><h3>Maßlösungen und Titration</h3><p>Eine Maßlösung besitzt eine genau bekannte Konzentration. Sie kann durch Einwiegen eines Stoffes und Auffüllen auf ein genaues Volumen oder durch Verdünnen einer Vorratslösung hergestellt werden. Bei einer Titration wird eine unbekannte Konzentration mit einer Maßlösung bestimmt. Am Äquivalenzpunkt liegen die Stoffmengen im stöchiometrischen Verhältnis der Reaktionsgleichung vor.</p><h3>Modelle, Quellen und Entscheidungen</h3><p>Wissenschaftliche Modelle beruhen auf empirischen Daten, sind aber vorläufig und können weiterentwickelt werden. Fachquellen und Internetinformationen werden kritisch geprüft. Bei Entscheidungen zu chemischen Anwendungen werden Kriterien wie Gesundheit, Umwelt, Wirtschaftlichkeit und technische Machbarkeit priorisiert und gegeneinander abgewogen.</p><div class=merke>c = n/V; Verdünnung: c₁V₁ = c₂V₂. Titrationen werden über den Äquivalenzpunkt und die Reaktionsgleichung ausgewertet.</div>","q":[["Wie lautet die Formel der Stoffmengenkonzentration?",["c = n/V","c = V/n","c = n·V","c = m·V"],0,"Die Stoffmengenkonzentration ist Stoffmenge pro Volumen."],["Was bleibt beim Verdünnen einer Lösung gleich?",["Die Stoffmenge des gelösten Stoffes","Das Volumen","Die Konzentration","Die Dichte"],0,"Beim Verdünnen wird Lösungsmittel zugegeben, die Stoffmenge des gelösten Stoffes bleibt gleich."],["Was kennzeichnet den Äquivalenzpunkt einer Titration?",["Die Stoffmengen liegen im stöchiometrischen Verhältnis vor","Der Indikator muss blau sein","Das gesamte Lösungsmittel ist verdampft","Die Temperatur beträgt 0 °C"],0,"Am Äquivalenzpunkt haben die Reaktionspartner im Verhältnis der Reaktionsgleichung reagiert."],["Was beschreibt der Massenanteil?",["Masse des Stoffes geteilt durch Gesamtmasse der Lösung","Stoffmenge geteilt durch Volumen","Volumen geteilt durch Masse","Masse geteilt durch Zeit"],0,"Der Massenanteil ist das Verhältnis der Masse eines Bestandteils zur Gesamtmasse."],["Welche Kriterien gehören zu einer Technikbewertung?",["Umwelt, Gesundheit, Wirtschaftlichkeit und Machbarkeit","Nur Farbe und Form","Nur Werbung","Nur der Markenname"],0,"Eine systematische Entscheidung berücksichtigt mehrere relevante Kriterien."]]}}},"c10_2":{"n":"Protonenübergänge – Säuren und Basen","g":10,"d":"Brønsted-Konzept, pH-Wert, Ampholyte, Acidität, Reversibilität, Neutralisation und Titration","t":{"grundlagen":{"n":"Säure-Base-Reaktionen und pH-Wert","h":"<h3>Brønsted-Konzept</h3><p>Eine Säure ist ein Protonendonator, eine Base ein Protonenakzeptor. Bei <code>HCl + H₂O → H₃O⁺ + Cl⁻</code> gibt Chlorwasserstoff ein Proton ab und Wasser nimmt es auf. Wasser ist ein <b>Ampholyt</b>, weil es sowohl Protonen aufnehmen als auch abgeben kann.</p><h3>pH-Wert und Indikatoren</h3><p>Bei 25 °C gilt: pH kleiner 7 sauer, pH = 7 neutral, pH größer 7 basisch. Saure Lösungen enthalten Oxonium-Ionen H₃O⁺, basische Lösungen Hydroxid-Ionen OH⁻. Die pH-Skala ist logarithmisch: Eine pH-Stufe entspricht einem Faktor 10 bei der Oxonium-Ionen-Konzentration. Indikatoren zeigen den pH-Bereich durch Farbänderung an. Auch Pflanzenfarbstoffe können als Indikatoren dienen.</p><h3>Acidität und Reversibilität</h3><p>Die Säurestärke hängt von der Struktur des Teilchens ab. Carbonsäuren sind saurer als vergleichbare Alkohole, weil das Carboxylat-Ion durch Mesomerie stabilisiert wird. Protonenübergänge sind reversibel; ein Gleichgewichtspfeil zeigt Hin- und Rückreaktion. Die Bildung und Zersetzung von Kohlensäure ist ein Beispiel für ein von äußeren Bedingungen beeinflusstes Gleichgewicht.</p><h3>Neutralisation</h3><p>Oxonium- und Hydroxid-Ionen reagieren zu Wasser: <code>H₃O⁺ + OH⁻ → 2 H₂O</code>. Die Reaktion ist exotherm. Die übrigen Ionen bilden ein Salz. Neutralisation kann zur Behandlung saurer oder basischer Lösungen dienen, muss aber kontrolliert und sicher durchgeführt werden.</p><h3>Konzentration und Titration</h3><p>Lösungen definierter Konzentration werden mit <code>c = n/V</code> berechnet und hergestellt. Bei der Titration wird eine unbekannte Säure- oder Basenkonzentration
