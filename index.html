m91:{n:'M9 1 Quadratwurzeln',g:9,d:'Wurzeln, reelle Zahlen, Heron-Verfahren',t:{
wurzel:{n:'Quadratwurzeln und Rechenregeln',
h:`<h3>Definition</h3><p>Die <b>Quadratwurzel</b> √a (a ≥ 0) ist die nichtnegative Zahl, deren Quadrat a ergibt: (√a)² = a. Es gilt √(a²) = |a|. Beispiel: √((−3)²) = √9 = 3 = |−3|.</p><h3>Rechenregeln (a, b ≥ 0)</h3>${tb(['Regel','Beispiel'],[['√a · √b = √(a·b)','√2 · √8 = √16 = 4'],['√a : √b = √(a:b), b &gt; 0','√18 : √2 = √9 = 3'],['(√a)² = a','(√7)² = 7']])}<p>Achtung: √a + √b ist <b>nicht</b> √(a + b). Es ist √9 + √16 = 7, aber √25 = 5.</p><h3>Teilweise radizieren</h3><p>Ziehe das größte Quadrat aus der Wurzel: √72 = √(36·2) = 6·√2. Gleichartige Wurzeln kann man addieren: 3√2 + 5√2 = 8√2.</p><h3>Nenner rational machen</h3><p>${fr('6','√3')} = ${fr('6·√3','√3·√3')} = ${fr('6√3','3')} = 2√3. Man erweitert mit der Wurzel im Nenner.</p><h3>Mit Variablen</h3><p>√(x²) = |x|, also √(9x²) = 3·|x|. Die Betragsstriche sind nötig, weil x negativ sein kann.</p>${M('Wurzeln: Produkte und Quotienten darf man unter einer Wurzel zusammenfassen, Summen und Differenzen nicht.')}`,
q:[['Wie groß ist √((−5)²)?',['5','−5','25','nicht definiert'],0,'√(a²) = |a|, also |−5| = 5.'],['Welche Aussage ist falsch?',['√9 + √16 = √25','√9 · √16 = √144','√50 = 5√2','(√7)² = 7'],0,'√9 + √16 = 3 + 4 = 7, aber √25 = 5. Summen darf man nicht unter einer Wurzel zusammenfassen.'],['Vereinfache √48 vollständig.',['4√3','6√2','2√12','16√3'],0,'48 = 16 · 3, also √48 = 4√3.'],['Mache den Nenner von 6/√3 rational.',['2√3','6√3','√3/2','3√2'],0,'Mit √3 erweitern: 6√3 / 3 = 2√3.']],
m:[()=>{const a=rnd(2,15);return{t:`Berechne √${a*a}.`,a,h:'Welche Zahl ergibt mit sich selbst multipliziert die Zahl unter der Wurzel?'}},()=>{const k=rnd(2,9),m=pick([2,3,5,6,7,10]);return{t:`Schreibe √${k*k*m} in der Form a·√b, wobei b möglichst klein ist. Gib a an.`,a:k,h:`Welches Quadrat ist ein Teiler von ${k*k*m}?`}},()=>{const s=pick([2,3,5,6,7]),c=rnd(2,9);return{t:`Berechne ${c}/√${s} und runde auf 3 Nachkommastellen.`,a:c/Math.sqrt(s),tol:.002,h:`Erweitere mit √${s}.`}}]},
irrat:{n:'Irrationale und reelle Zahlen',
h:`<h3>Zahlbereiche</h3><p>ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. <b>Rationale Zahlen</b> (ℚ) lassen sich als Bruch schreiben. Ihre Dezimaldarstellung bricht ab oder wird periodisch (0,25 oder 0,333…). <b>Irrationale Zahlen</b> sind nicht als Bruch darstellbar. Ihre Dezimaldarstellung ist unendlich und nicht periodisch, z. B. √2, √3 und π. Alle zusammen bilden die <b>reellen Zahlen</b> (ℝ). Sie füllen die Zahlengerade lückenlos.</p><h3>Indirekter Beweis: √2 ist irrational</h3><p>Beim <b>indirekten Beweis</b> nimmt man das Gegenteil an und führt es zum Widerspruch.</p><ol><li>Annahme: √2 = p/q mit teilerfremden ganzen Zahlen p, q.</li><li>Quadrieren: 2 = p²/q², also p² = 2q².</li><li>Dann ist p² gerade, also auch p. Schreibe p = 2k.</li><li>Einsetzen: 4k² = 2q², also q² = 2k². Damit ist auch q gerade.</li><li>Widerspruch: p und q sind beide gerade, also nicht teilerfremd. Die Annahme war falsch, √2 ist irrational.</li></ol>${M('Beweisen heißt: lückenlos aus Bekanntem folgern. Ein Beispiel prüfen genügt nicht.')}`,
q:[['Welche Zahl ist irrational?',['√2','√16','0,25','−3'],0,'√16 = 4 und 0,25 = 1/4 sind rational.'],['Wie geht ein indirekter Beweis?',['Man nimmt das Gegenteil an und führt es zum Widerspruch','Man prüft viele Beispiele','Man rechnet mit dem Taschenrechner','Man zeichnet eine Skizze'],0,'Der Widerspruch zeigt, dass die Annahme falsch ist.'],['Welche Aussage über rationale Zahlen stimmt?',['Ihre Dezimaldarstellung bricht ab oder ist periodisch','Sie sind immer ganze Zahlen','Ihre Nachkommastellen haben kein Muster','Sie sind alle Wurzeln'],0,'Jeder Bruch hat eine endliche oder periodische Dezimaldarstellung.'],['Welche Menge enthält alle anderen?',['ℝ','ℚ','ℤ','ℕ'],0,'ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ.']]},
heron:{n:'Heron-Verfahren',
h:`<h3>Näherung für Quadratwurzeln</h3><p>Idee: Ein Rechteck mit dem Flächeninhalt a hat die Seiten x und a/x. Das Quadrat mit Seite √a ist der Idealfall. Nimmt man den Mittelwert der Seiten als neue Seite, wird das Rechteck „quadratischer“.</p><p><b>Heron-Verfahren</b> für √a: Wähle einen Startwert x₀ &gt; 0 und rechne</p><p style="font-size:1.1rem">x<sub>n+1</sub> = ½ · (x<sub>n</sub> + ${fr('a','x<sub>n</sub>')})</p>${tb(['n','x<sub>n</sub> für √2, x₀ = 1'],[['0','1'],['1','1,5'],['2','1,41667'],['3','1,41422']])}<p>Das Verfahren ist <b>iterativ</b>: Derselbe Rechenschritt wird wiederholt, und jeder Wert liegt näher an √a. Es lässt sich leicht in einem Tabellenkalkulationsprogramm umsetzen: In B2 steht <code>=(B1+2/B1)/2</code>, nach unten kopieren.</p>${M('Ein Algorithmus, der sich schrittweise annähert, heißt iterativ. Beim Heron-Verfahren verdoppelt sich die Anzahl der richtigen Stellen etwa mit jedem Schritt.')}`,
q:[['Wie lautet die Heron-Formel für √a?',['x<sub>n+1</sub> = ½·(x<sub>n</sub> + a/x<sub>n</sub>)','x<sub>n+1</sub> = x<sub>n</sub>² + a','x<sub>n+1</sub> = a/x<sub>n</sub>²','x<sub>n+1</sub> = x<sub>n</sub> − a'],0,'Mittelwert aus x und a/x.'],['a = 2, x₀ = 1. Wie groß ist x₁?',['1,5','2','1,25','1,4'],0,'½·(1 + 2/1) = 1,5.'],['Was bedeutet „iterativ“?',['Derselbe Rechenschritt wird wiederholt, man nähert sich schrittweise an','Man rechnet einmal exakt','Man rät den Wert','Man rundet sofort'],0,'Das Ergebnis eines Schritts ist die Eingabe des nächsten.']],
m:[()=>{const a=rnd(2,9),x=rnd(1,4);return{t:`Heron-Verfahren für √${a} mit x₀ = ${x}. Berechne x₁.`,a:(x+a/x)/2,tol:.002,h:`x₁ = ½·(${x} + ${a}/${x})`}},()=>{const a=rnd(2,9),x=rnd(1,4),y=(x+a/x)/2;return{t:`Heron-Verfahren für √${a} mit x₀ = ${x}. Berechne x₂ (3 Nachkommastellen).`,a:(y+a/y)/2,tol:.002,h:'Berechne zuerst x₁ und setze es dann ein.'}},()=>{const a=rnd(10,60),x=rnd(3,7),y=(x+a/x)/2;return{t:`Heron-Verfahren für √${a} mit x₀ = ${x}. Berechne x₂ (3 Nachkommastellen).`,a:(y+a/y)/2,tol:.002,h:'Berechne zuerst x₁ und setze es dann ein.'}}]}}},
m92:{n:'M9 2 Quadratische Funktionen',g:9,d:'Parabeln, quadratische Gleichungen, Anwendungen',t:{
parab:{n:'Parabeln und Darstellungsformen',
h:`<h3>Scheitelpunktform und Parameter</h3><p>Die Normalparabel ist f(x) = x². Allgemein: <b>f(x) = a·(x + d)² + e</b>.</p>${tb(['Parameter','Wirkung'],[['a','Streckung (|a| &gt; 1 enger) und Spiegelung (a &lt; 0: nach unten geöffnet)'],['d','Verschiebung in x-Richtung um −d'],['e','Verschiebung in y-Richtung um e']])}<p>Der <b>Scheitel</b> ist S(−d | e). Die Anzahl der Nullstellen hängt von a und e ab: Haben a und e verschiedene Vorzeichen, gibt es zwei, bei e = 0 eine, bei gleichem Vorzeichen keine.</p><h3>Drei Darstellungsformen</h3>${tb(['Form','Term','Vorteil'],[['allgemein','ax² + bx + c','y-Achsenabschnitt c'],['Scheitelpunktform','a(x − x<sub>S</sub>)² + y<sub>S</sub>','Scheitel direkt ablesbar'],['Nullstellenform','a(x − x₁)(x − x₂)','Nullstellen direkt ablesbar']])}<h3>Scheitel bestimmen (quadratische Ergänzung)</h3><p>x² + 6x + 5 = (x + 3)² − 9 + 5 = (x + 3)² − 4, also S(−3 | −4). Mit den binomischen Formeln geht das auch bei ax² + bx + c. Merkregel: x<sub>S</sub> = −b/(2a).</p><h3>Eigenschaften am Graphen</h3><p>Ablesbar sind Wertemenge, Nullstellen, Intervalle mit positiven bzw. negativen Funktionswerten, Monotonie, größter bzw. kleinster Funktionswert und der y-Achsenabschnitt.</p>`,
w:plotW({tx:'Verändere a, d und e. Mit dem Knopf bekommst du eine Zielparabel, die du nachbauen sollst. Ein Gitterkästchen entspricht einer Einheit.',f:(x,q)=>q[0]*(x+q[1])**2+q[2],X:[-6,6],Y:[-6,6],ps:[{k:'a',min:-3,max:3,step:.5,v:1,nz:1},{k:'d',min:-4,max:4,step:1,v:0},{k:'e',min:-4,max:4,step:1,v:0}],fm:q=>`f(x) = ${dz(q[0])}·(x ${sg(q[1])})² ${sg(q[2])} &nbsp; Scheitel S(${pm(-q[1])}|${pm(q[2])})`}),wl:'Graph',
q:[['Wo liegt der Scheitel von f(x) = 2(x − 3)² + 1?',['S(3|1)','S(−3|1)','S(3|−1)','S(2|1)'],0,'Scheitel (x<sub>S</sub> | y<sub>S</sub>) in der Form a(x − x<sub>S</sub>)² + y<sub>S</sub>.'],['Was bewirkt a &lt; 0 bei f(x) = a·x²?',['Die Parabel ist nach unten geöffnet','Sie ist nach oben geöffnet und enger','Sie wird nach links verschoben','Sie hat keinen Scheitel'],0,'Ein negatives a spiegelt an der x-Achse.'],['Wie viele Nullstellen hat f(x) = (x + 1)² + 4?',['0','1','2','3'],0,'Der Scheitel (−1|4) liegt über der x-Achse, die Parabel ist nach oben geöffnet.'],['Welche Form zeigt die Nullstellen direkt?',['a(x − x₁)(x − x₂)','ax² + bx + c','a(x − x<sub>S</sub>)² + y<sub>S</sub>','keine'],0,'Ein Produkt ist 0, wenn ein Faktor 0 ist.']],
m:[()=>{const p=rnd(-6,6),q=rnd(-6,6),a=pick([1,2,3,-1,-2]);return{t:`Gib die x-Koordinate des Scheitels von f(x) = ${a}·(x ${sg(-p)})² ${sg(q)} an.`,a:p,h:'Der Scheitel liegt dort, wo die Klammer 0 wird.'}},()=>{const b=2*rnd(-5,5)||2,c=rnd(-9,9);return{t:`Bestimme die x-Koordinate des Scheitels von f(x) = x² ${sg(b)}x ${sg(c)}.`,a:-b/2,h:'Quadratische Ergänzung: x<sub>S</sub> = −b/2.'}},()=>{const b=2*rnd(1,5)*pick([1,-1]),c=rnd(-9,9);return{t:`Wie groß ist der kleinste Funktionswert von f(x) = x² ${sg(b)}x ${sg(c)}?`,a:c-b*b/4,h:'Quadratisch ergänzen: (x + b/2)² + c − b²/4.'}}]},
gleich:{n:'Quadratische Gleichungen',
h:`<h3>Lösungsformel</h3><p>Die Gleichung <b>ax² + bx + c = 0</b> (a ≠ 0) löst man mit</p><p style="font-size:1.1rem">x<sub>1,2</sub> = ${fr('−b ± √(b² − 4ac)','2a')}</p><p>Die <b>Diskriminante</b> D = b² − 4ac entscheidet über die Anzahl der Lösungen:</p>${tb(['D','Lösungen'],[['D &gt; 0','zwei'],['D = 0','eine'],['D &lt; 0','keine']])}<h3>Welches Verfahren?</h3><ul><li><b>c fehlt</b> (x² + bx = 0): Ausklammern, x(x + b) = 0, also x = 0 oder x = −b.</li><li><b>b fehlt</b> (x² = k): Wurzel ziehen, x = ±√k für k &gt; 0.</li><li>sonst: Lösungsformel.</li></ul><p>Beispiel: x² − 5x + 6 = 0 hat D = 25 − 24 = 1, also x = (5 ± 1)/2 = 3 oder 2.</p><h3>Skizze als Kontrolle</h3><p>Die Lösungen sind die Nullstellen der Parabel y = ax² + bx + c. Eine Skizze zeigt, ob die Anzahl der Lösungen passt.</p>${M('Erst überlegen, ob Ausklammern oder Wurzelziehen reicht. Die Lösungsformel ist der Allzweck-Weg.')}`,
q:[['Was sagt D = b² − 4ac &lt; 0 aus?',['Keine Lösung','Zwei Lösungen','Genau eine Lösung','Unendlich viele'],0,'Die Parabel schneidet die x-Achse nicht.'],['Wie löst man x² − 7x = 0 am einfachsten?',['Ausklammern: x(x − 7) = 0','Nur mit der Lösungsformel','Es ist nicht lösbar','Durch Wurzelziehen'],0,'x = 0 oder x = 7.'],['Wie viele Lösungen hat x² − 6x + 9 = 0?',['Eine','Zwei','Keine','Drei'],0,'D = 36 − 36 = 0, also x = 3.'],['Welche Lösungen hat x² = 16?',['4 und −4','nur 4','nur −4','8'],0,'Beide Vorzeichen: x = ±4.']],
m:[()=>{const k=rnd(2,12);return{t:`Löse x² = ${k*k}. Gib beide Lösungen an, getrennt durch ;`,a:[k,-k]}},()=>{const b=rnd(1,9)*pick([1,-1]);return{t:`Löse x² ${sg(b)}x = 0. Gib beide Lösungen an, getrennt durch ;`,a:[0,-b],h:'Klammere x aus.'}},()=>{let r1,r2;do{r1=rnd(-6,6);r2=rnd(-6,6)}while(r1==r2||r1+r2==0||r1*r2==0);return{t:`Löse x² ${sg(-(r1+r2))}x ${sg(r1*r2)} = 0. Gib beide Lösungen an, getrennt durch ;`,a:[r1,r2],h:'Lösungsformel: x = (−b ± √D) / 2a'}}]},
anw:{n:'Anwendungen quadratischer Funktionen',
h:`<h3>Parabel durch drei Punkte</h3><p>Für f(x) = ax² + bx + c braucht man drei Bedingungen. Jeder Punkt liefert eine Gleichung, es entsteht ein <b>lineares Gleichungssystem mit drei Unbekannten</b>.</p><p>Beispiel: P₁(0|1), P₂(1|0), P₃(2|1). Aus P₁ folgt c = 1. Dann a + b = −1 und 4a + 2b = 0, also b = −2a und a = 1, b = −2. Ergebnis: f(x) = x² − 2x + 1.</p><p>Das Vorgehen ist ein <b>Algorithmus</b>: Eine Unbekannte nach der anderen eliminieren.</p><h3>Bruchgleichungen</h3><p>Zuerst die <b>Definitionsmenge</b> bestimmen (Nenner ≠ 0), dann mit dem Hauptnenner multiplizieren. So entsteht oft eine quadratische Gleichung.</p><p>Schnitt von Gerade und Hyperbel: 4/x = x − 3 ⇒ 4 = x² − 3x ⇒ x² − 3x − 4 = 0 ⇒ x = 4 oder x = −1. Schnittpunkte (4|1) und (−1|−4).</p><h3>Extremwertprobleme</h3><p>Rechteck mit Umfang 20 m: Seiten x und 10 − x. Fläche A(x) = x·(10 − x) = −x² + 10x. Der Scheitel liegt bei x = 5, A = 25 m². Vorgehen: Zielgröße als Funktion einer Variablen aufstellen, Scheitel bestimmen, Ergebnis im Sachzusammenhang prüfen.</p>${M('Extremwertprobleme laufen oft auf den Scheitel einer Parabel hinaus: größter bzw. kleinster Funktionswert.')}`,
q:[['Wie viele Punkte legen f(x) = ax² + bx + c eindeutig fest?',['3','2','1','4'],0,'Drei Unbekannte brauchen drei Gleichungen.'],['Wie geht man bei Bruchgleichungen vor?',['Definitionsmenge bestimmen, mit dem Hauptnenner multiplizieren, lösen, Lösungen prüfen','Nenner einfach weglassen','Immer quadrieren','Nur raten'],0,'Lösungen, bei denen ein Nenner 0 wird, sind auszuschließen.'],['Rechteck mit Umfang 20 m. Wie groß ist der Flächeninhalt maximal?',['25 m²','50 m²','100 m²','20 m²'],0,'Das Quadrat mit Seite 5 m ist optimal.']],
m:[()=>{const U=4*rnd(3,15);return{t:`Ein Rechteck hat den Umfang ${U} m. Wie groß ist sein maximaler Flächeninhalt in m²?`,a:(U/4)**2,h:'Seiten x und U/2 − x, Scheitel der Flächenfunktion.'}},()=>{let r1,r2;do{r1=rnd(-6,6);r2=rnd(-6,6)}while(r1==r2||r1+r2==0||r1*r2==0);const k=-(r1+r2),c=-r1*r2;return{t:`Löse ${pm(c)}/x = x ${sg(k)}. Gib beide Lösungen an, getrennt durch ;`,a:[r1,r2],h:'Mit x multiplizieren, dann quadratische Gleichung lösen.'}},()=>{const a=pick([1,2,3,-1,-2]),b=rnd(-4,4),c=rnd(-5,5);return{t:`Eine Parabel f(x) = ax² + bx + c geht durch P₁(0|${pm(c)}), P₂(1|${pm(a+b+c)}) und P₃(2|${pm(4*a+2*b+c)}). Bestimme a.`,a,h:'Aus P₁ folgt c. Dann bleibt ein System für a und b.'}}]}}},
m93:{n:'M9 3 Wahrscheinlichkeit verknüpfter Ereignisse',g:9,d:'Vierfeldertafel und Additionssatz',t:{
vier:{n:'Vierfeldertafel und Additionssatz',
h:`<h3>Verknüpfte Ereignisse</h3>${tb(['Schreibweise','Bedeutung'],[['A ∩ B','A und B treten beide ein'],['A ∪ B','A oder B (mindestens eines) tritt ein'],['Ā','A tritt nicht ein (Gegenereignis)']])}<h3>Vierfeldertafel</h3><p>100 Personen: 60 spielen Fußball (A), 40 spielen Gitarre (B), 15 beides.</p>${tb(['','B','B̄','Summe'],[['A','15','45','60'],['Ā','25','15','40'],['Summe','40','60','100']])}<p>Teilt man alle Zahlen durch 100, erhält man Wahrscheinlichkeiten, z. B. P(A ∩ B) = 0,15 und P(Ā ∩ B̄) = 0,15.</p><h3>Additionssatz</h3><p style="font-size:1.1rem">P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</p><p>Hier: 0,6 + 0,4 − 0,15 = 0,85. Der Schnitt wird abgezogen, weil er sonst doppelt zählt. „Weder A noch B“ ist das Gegenereignis von A ∪ B: 1 − 0,85 = 0,15.</p>${M('Verbale Beschreibung ↔ formale Schreibweise: „und“ = ∩, „oder“ = ∪, „nicht“ = Gegenereignis.')}`,
q:[['Was bedeutet A ∩ B?',['A und B treten beide ein','A oder B tritt ein','A tritt nicht ein','Weder A noch B'],0,'∩ steht für „und“.'],['Welche Formel gilt allgemein?',['P(A ∪ B) = P(A) + P(B) − P(A ∩ B)','P(A ∪ B) = P(A) · P(B)','P(A ∪ B) = P(A) − P(B)','P(A ∪ B) = P(A ∩ B)'],0,'Der Schnitt würde sonst doppelt gezählt.'],['P(A) = 0,5; P(B) = 0,4; P(A ∩ B) = 0,2. Wie groß ist P(A ∪ B)?',['0,7','0,9','0,1','0,2'],0,'0,5 + 0,4 − 0,2 = 0,7.'],['Wie berechnet man P(Ā)?',['1 − P(A)','P(A) − 1','1 + P(A)','P(A)²'],0,'Ein Ereignis und sein Gegenereignis ergeben zusammen 1.']],
m:[()=>{const a=rnd(3,6)/10,b=rnd(3,6)/10,i=rnd(1,2)/10;return{t:`Es gilt P(A) = ${dz(a)}, P(B) = ${dz(b)} und P(A∩B) = ${dz(i)}. Berechne P(A∪B).`,a:a+b-i,tol:.002,h:'Additionssatz.'}},()=>{const A=rnd(30,50),B=rnd(30,50),c=rnd(10,25);return{t:`Von 100 Personen spielen ${A} Fußball, ${B} Gitarre und ${c} beides. Wie viele spielen weder Fußball noch Gitarre?`,a:100-(A+B-c),h:'Erst die Anzahl für „mindestens eines“ bestimmen.'}},()=>{const a=rnd(4,6)/10,b=rnd(4,6)/10,i=rnd(1,3)/10;return{t:`Es gilt P(A) = ${dz(a)}, P(B) = ${dz(b)} und P(A∪B) = ${dz(a+b-i)}. Berechne P(A∩B).`,a:i,tol:.002,h:'Stelle den Additionssatz nach P(A∩B) um.'}}]}}},
m94:{n:'M9 4 Ähnlichkeit und Strahlensatz',g:9,d:'Ähnlichkeit, Strahlensätze, Maßstab',t:{
aehn:{n:'Ähnlichkeit und Maßstab',
h:`<h3>Ähnliche Figuren</h3><p>Zwei Figuren sind <b>ähnlich</b>, wenn sie die gleiche Gestalt, aber evtl. unterschiedliche Größe haben. Sie gehen durch eine zentrische Streckung (mit Faktor k) und evtl. Verschieben/Drehen/Spiegeln auseinander hervor. Entsprechende Winkel sind gleich groß, entsprechende Strecken stehen im gleichen Verhältnis k.</p><p><b>Dreiecke</b> sind ähnlich, wenn sie in zwei Winkeln übereinstimmen oder in allen drei Seitenverhältnissen.</p><h3>Veränderung bei Maßstabsänderung</h3>${tb(['Größe','Faktor bei Streckfaktor k'],[['Länge','k'],['Flächeninhalt','k²'],['Volumen','k³']])}<p>Beispiel k = 3: Längen ×3, Flächen ×9, Volumina ×27. Wird ein Würfel mit k = 2 vergrößert, hat er das 8-fache Volumen.</p>${M('Verdoppelt man alle Längen, wird die Fläche 4-mal und das Volumen 8-mal so groß.')}`,
q:[['Wann sind zwei Dreiecke ähnlich?',['Wenn sie in zwei Winkeln übereinstimmen','Wenn sie gleichen Umfang haben','Wenn sie gleiche Fläche haben','Wenn sie gleich hoch sind'],0,'Dann stimmt auch der dritte Winkel überein.'],['Eine Figur wird mit k = 3 vergrößert. Wie ändert sich der Flächeninhalt?',['Er wird 9-mal so groß','Er wird 3-mal so groß','Er wird 6-mal so groß','Er bleibt gleich'],0,'k² = 9.'],['Ein Würfel wird mit k = 2 vergrößert. Sein Volumen wird…',['8-mal so groß','2-mal so groß','4-mal so groß','6-mal so groß'],0,'k³ = 8.']],
m:[()=>{const k=rnd(2,5),A=rnd(2,12);return{t:`Eine Figur mit ${A} cm² Flächeninhalt wird mit dem Faktor ${k} vergrößert. Wie groß ist die neue Fläche in cm²?`,a:A*k*k,h:'Flächen ändern sich mit k².'}},()=>{const k=rnd(2,4),V=rnd(2,10);return{t:`Ein Körper mit ${V} cm³ Volumen wird mit dem Faktor ${k} maßstäblich vergrößert. Wie groß ist das neue Volumen in cm³?`,a:V*k**3,h:'Volumen ändert sich mit k³.'}},()=>{const A=rnd(2,9),k=rnd(2,5);return{t:`Zwei ähnliche Figuren haben die Flächeninhalte ${A} cm² und ${A*k*k} cm². Welchen Streckfaktor k hat die Streckung von der kleineren zur größeren Figur?`,a:k,h:'Flächenverhältnis = k².'}}]},
strahl:{n:'Strahlensätze',
h:`<h3>Voraussetzung</h3><p>Zwei Geraden schneiden sich in einem Punkt Z (Zentrum) und werden von zwei <b>parallelen</b> Geraden geschnitten. Auf dem einen Strahl entstehen die Punkte A und A′, auf dem anderen B und B′ (AB ∥ A′B′).</p><h3>1. Strahlensatz</h3><p>Abschnitte auf <b>demselben Strahl</b> stehen im gleichen Verhältnis wie auf dem anderen Strahl:</p><p style="font-size:1.1rem">${fr('ZA','ZA′')} = ${fr('ZB','ZB′')}</p><h3>2. Strahlensatz</h3><p>Die Abschnitte auf den Parallelen verhalten sich wie die Abschnitte auf einem Strahl vom Zentrum aus:</p><p style="font-size:1.1rem">${fr('ZA','ZA′')} = ${fr('AB','A′B′')}</p><h3>Anwendung</h3><p>Ein 2 m langer Stab wirft 3 m Schatten, ein Baum gleichzeitig 12 m. Höhe h des Baumes: ${fr('h','2')} = ${fr('12','3')}, also h = 8 m. Die entstehenden Bruchgleichungen löst man wie in Jahrgangsstufe 8.</p>${M('Zuerst prüfen: Sind die Geraden wirklich parallel? Dann Verhältnisse gleichsetzen und nach der gesuchten Strecke auflösen.')}`,
q:[['Was besagt der 1. Strahlensatz?',['Die Abschnitte auf einem Strahl stehen im gleichen Verhältnis wie die auf dem anderen Strahl','Parallelen sind immer gleich lang','Winkel sind immer 90°','Die Summe der Abschnitte ist konstant'],0,'ZA : ZA′ = ZB : ZB′.'],['Ein 2 m langer Stab wirft 3 m Schatten, ein Baum 12 m. Wie hoch ist der Baum?',['8 m','6 m','18 m','4 m'],0,'h/2 = 12/3, also h = 8.'],['Welche Voraussetzung gilt für die Strahlensätze?',['Zwei Geraden durch einen Punkt werden von Parallelen geschnitten','Das Dreieck ist rechtwinklig','Alle Strecken sind gleich lang','Es gibt einen Kreis'],0,'Ohne Parallelität gelten die Verhältnisse nicht.']],
m:[()=>{const a=rnd(2,6),k=rnd(2,4),b=rnd(2,6);return{t:`Zwei Strahlen mit Anfangspunkt Z werden von zwei Parallelen geschnitten. Es gilt ZA = ${a} cm, ZA′ = ${a*k} cm und ZB = ${b} cm. Wie lang ist ZB′ in cm?`,a:b*k,h:'1. Strahlensatz.'}},()=>{const s=rnd(1,3),sh=rnd(1,4),k=rnd(2,9);return{t:`Ein ${s} m langer Stab wirft einen Schatten von ${sh} m. Gleichzeitig wirft ein Baum einen Schatten von ${sh*k} m. Wie hoch ist der Baum in m?`,a:s*k,h:'Verhältnis Höhe : Schatten ist gleich.'}},()=>{const p=rnd(2,5),k=rnd(2,3),AB=rnd(2,6);return{t:`Es gilt AB ∥ A′B′. Gegeben: ZA = ${p} cm, ZA′ = ${p*k} cm und A′B′ = ${AB*k} cm. Wie lang ist AB in cm?`,a:AB,h:'2. Strahlensatz.'}}]}}},
m95:{n:'M9 5 Potenzfunktionen und Potenzbegriff',g:9,d:'a·xⁿ, n-te Wurzel, rationale Exponenten',t:{
potf:{n:'Potenzfunktionen mit natürlichen Exponenten',
h:`<h3>Funktionen f(x) = a·xⁿ</h3><p>Der Verlauf hängt von n und a ab. Alle Graphen gehen durch den Ursprung (0|0).</p>${tb(['','n gerade','n ungerade'],[['Symmetrie','achsensymmetrisch zur y-Achse: f(−x) = f(x)','punktsymmetrisch zum Ursprung: f(−x) = −f(x)'],['a &gt; 0','U-förmig, nach oben offen','von links unten nach rechts oben'],['a &lt; 0','nach unten offen','von links oben nach rechts unten']])}<p>Je größer n, desto flacher verläuft der Graph nahe 0 und desto steiler außerhalb von [−1; 1]. Der Faktor a streckt oder staucht (|a| &gt; 1 bzw. |a| &lt; 1) und spiegelt für a &lt; 0 an der x-Achse. Gemeinsame Punkte der Graphen mit a = 1: (0|0) und (1|1).</p><p>Experimentiere im Tab „Graph“ mit a und n.</p>`,
w:plotW({tx:'Verändere a und n und beobachte Symmetrie und Verlauf. Mit dem Knopf bekommst du eine Zielkurve.',f:(x,q)=>q[0]*x**q[1],X:[-3,3],Y:[-6,6],ps:[{k:'a',min:-2,max:2,step:.5,v:1,nz:1},{k:'n',min:1,max:6,step:1,v:2}],fm:q=>`f(x) = ${dz(q[0])}·x<sup>${q[1]}</sup>`}),wl:'Graph',
q:[['Welche Symmetrie hat f(x) = x⁴?',['Achsensymmetrie zur y-Achse','Punktsymmetrie zum Ursprung','Keine','Symmetrie zur x-Achse'],0,'Gerader Exponent: f(−x) = f(x).'],['Welche Symmetrie hat f(x) = −2x³?',['Punktsymmetrie zum Ursprung','Achsensymmetrie zur y-Achse','Keine','Symmetrie zur x-Achse'],0,'Ungerader Exponent: f(−x) = −f(x).'],['Welchen Punkt enthält jeder Graph von f(x) = a·xⁿ?',['(0|0)','(1|1)','(0|1)','(1|0)'],0,'0ⁿ = 0.']],
m:[()=>{const a=pick([1,2,3,-1,-2]),n=rnd(2,4),x=rnd(-2,2);return{t:`Berechne f(${pm(x)}) für f(x) = ${a}·x<sup>${n}</sup>.`,a:a*x**n}},()=>{const a=pick([1,2,3,-1,-2]);return{t:`Der Graph von f(x) = a·x³ geht durch P(2|${pm(8*a)}). Wie groß ist a?`,a,h:'f(2) = a · 2³'}},()=>{const a=pick([1,2,3,-1,-2]),n=pick([2,3,4,5]);return{t:`Der Graph von f(x) = a·x<sup>${n}</sup> geht durch P(2|${pm(a*2**n)}). Wie groß ist f(−2)?`,a:a*(-2)**n,h:'Gerade oder ungerade Potenz? Symmetrie nutzen.'}}]},
wurz:{n:'n-te Wurzel und rationale Exponenten',
h:`<h3>n-te Wurzel</h3><p>ⁿ√a (a ≥ 0) ist die nichtnegative Zahl, deren n-te Potenz a ergibt. Damit löst man Gleichungen xⁿ = c:</p>${tb(['n','c &gt; 0','c = 0','c &lt; 0'],[['gerade','zwei Lösungen ±ⁿ√c','x = 0','keine Lösung'],['ungerade','eine Lösung ⁿ√c','x = 0','eine Lösung −ⁿ√|c|']])}<p>Beispiele: x⁴ = 81 ⇒ x = ±3. x³ = −8 ⇒ x = −2. Eine Skizze der Potenzfunktion macht die Lösungsanzahl plausibel.</p><h3>Rationale Exponenten</h3><p>a<sup>1/n</sup> = ⁿ√a und a<sup>m/n</sup> = (ⁿ√a)<sup>m</sup> (a &gt; 0). Beispiel: 8<sup>2/3</sup> = (³√8)² = 2² = 4.</p><h3>Rechengesetze</h3>${tb(['Gesetz','Beispiel'],[['a<sup>r</sup> · a<sup>s</sup> = a<sup>r+s</sup>','x<sup>1/2</sup> · x<sup>1/3</sup> = x<sup>5/6</sup>'],['a<sup>r</sup> : a<sup>s</sup> = a<sup>r−s</sup>','x<sup>3/4</sup> : x<sup>1/4</sup> = x<sup>1/2</sup>'],['(a<sup>r</sup>)<sup>s</sup> = a<sup>r·s</sup>','(x<sup>2/3</sup>)<sup>3</sup> = x²'],['a<sup>r</sup> · b<sup>r</sup> = (ab)<sup>r</sup>','4<sup>1/2</sup> · 9<sup>1/2</sup> = 36<sup>1/2</sup> = 6']])}${M('Wurzeln und Potenzen mit rationalem Exponenten sind zwei Schreibweisen derselben Sache. So lassen sich Wurzelterme mit den Potenzgesetzen vereinfachen.')}`,
q:[['Wie viele Lösungen hat x⁴ = 81?',['Zwei (3 und −3)','Eine','Vier','Keine'],0,'Gerader Exponent, c &gt; 0.'],['Wie viele Lösungen hat x³ = −8?',['Eine (−2)','Zwei','Keine','Drei'],0,'Ungerader Exponent: genau eine Lösung.'],['Was ist 16<sup>1/2</sup>?',['4','8','2','256'],0,'Hochzahl 1/2 bedeutet Quadratwurzel.'],['Wie schreibt man ³√5 als Potenz?',['5<sup>1/3</sup>','5<sup>3</sup>','3<sup>1/5</sup>','5<sup>−3</sup>'],0,'a<sup>1/n</sup> = ⁿ√a.']],
m:[()=>{const n=pick([2,4]),k=rnd(2,n==4?3:6);return{t:`Löse x<sup>${n}</sup> = ${k**n}. Gib alle Lösungen an, getrennt durch ;`,a:[k,-k]}},()=>{const k=rnd(2,4),s=pick([1,-1]);return{t:`Löse x<sup>3</sup> = ${pm(s*k**3)}.`,a:s*k,h:'Bei ungeradem Exponenten gibt es genau eine Lösung.'}},()=>{const b=rnd(2,4),n=pick([2,3]),m=pick([1,2,3]);return{t:`Berechne ${b**n}<sup>${m}/${n}</sup>.`,a:b**m,h:`Erst die ${n}-te Wurzel, dann die ${m}. Potenz.`}}]}}},
m96:{n:'M9 6 Satz des Pythagoras',g:9,d:'Satz, Umkehrung, Beweis, Anwendungen',t:{
pyth:{n:'Satz des Pythagoras',
h:`<h3>Der Satz</h3><p>In einem <b>rechtwinkligen</b> Dreieck mit den Katheten a, b und der Hypotenuse c gilt <b>a² + b² = c²</b>. Die Hypotenuse liegt dem rechten Winkel gegenüber und ist die längste Seite.</p><h3>Umkehrung</h3><p>Gilt in einem Dreieck a² + b² = c², dann ist es rechtwinklig (Pythagoras-Zahlen: 3-4-5, 5-12-13, 8-15-17). Der Satz hat die Form „Wenn A, dann B“. Seine Umkehrung „Wenn B, dann A“ ist eine eigene Aussage, die hier zufällig auch gilt.</p><h3>Beweis mit dem Ergänzungsquadrat</h3><p>Lege vier kongruente rechtwinklige Dreiecke in ein Quadrat der Seitenlänge a + b. Die Fläche ist (a + b)² = c² + 4 · ½ab. Ausmultipliziert: a² + 2ab + b² = c² + 2ab, also a² + b² = c².</p><h3>Anwendungen</h3><ul><li>Diagonale im Rechteck: d = √(a² + b²).</li><li>Höhe im gleichschenkligen Dreieck: h = √(s² − (b/2)²).</li><li>Abstände im Koordinatensystem und in Körpern.</li></ul>${M('Skizze zeichnen, rechtwinkliges Dreieck finden, Hypotenuse und Katheten benennen, Gleichung aufstellen.')}`,
q:[['Welche Seite ist die Hypotenuse?',['Die Seite gegenüber dem rechten Winkel','Die kürzeste Seite','Eine Seite am rechten Winkel','Die Grundseite'],0,'Sie ist auch die längste Seite.'],['Katheten 6 cm und 8 cm. Wie lang ist die Hypotenuse?',['10 cm','14 cm','12 cm','48 cm'],0,'36 + 64 = 100.'],['Ein Dreieck hat die Seiten 5, 12 und 13. Ist es rechtwinklig?',['Ja, denn 5² + 12² = 13²','Nein','Nur wenn man misst','Nicht entscheidbar'],0,'25 + 144 = 169.'],['Was sagt die Umkehrung des Satzes?',['Gilt a² + b² = c², ist das Dreieck rechtwinklig','Jedes Dreieck hat einen rechten Winkel','Die Hypotenuse ist die längste Kathete','Die Winkelsumme ist 180°'],0,'Man schließt von der Gleichung auf den rechten Winkel.']],
m:[()=>{const t=pick(TR),k=rnd(1,2);return{t:`Die Katheten eines rechtwinkligen Dreiecks sind ${t[0]*k} cm und ${t[1]*k} cm lang. Berechne die Hypotenuse in cm.`,a:t[2]*k}},()=>{const t=pick(TR),k=rnd(1,2);return{t:`Die Hypotenuse eines rechtwinkligen Dreiecks ist ${t[2]*k} cm lang, eine Kathete ${t[0]*k} cm. Wie lang ist die andere Kathete in cm?`,a:t[1]*k,h:'b² = c² − a²'}},()=>{const a=rnd(2,9),b=rnd(2,9);return{t:`Ein Rechteck ist ${a} cm lang und ${b} cm breit. Wie lang ist die Diagonale (2 Nachkommastellen)?`,a:Math.hypot(a,b),tol:.01}}]}}},
m97:{n:'M9 7 Trigonometrie',g:9,d:'sin, cos, tan, Einheitskreis, Sinus- und Kosinussatz',t:{
trig:{n:'Trigonometrie im rechtwinkligen Dreieck',
h:`<h3>Sinus, Kosinus, Tangens</h3><p>Im rechtwinkligen Dreieck legt jeder spitze Winkel α die Seitenverhältnisse fest (ähnliche Dreiecke!). Umgekehrt legt ein Seitenverhältnis den Winkel fest.</p>${tb(['','Formel'],[['sin α','Gegenkathete / Hypotenuse'],['cos α','Ankathete / Hypotenuse'],['tan α','Gegenkathete / Ankathete']])}<p>„Gegenkathete“ und „Ankathete“ beziehen sich immer auf den Winkel α.</p><h3>Zusammenhänge</h3><ul><li>(sin α)² + (cos α)² = 1 (folgt aus dem Satz des Pythagoras)</li><li>tan α = sin α / cos α</li><li>cos α = sin(90° − α) und sin α = cos(90° − α)</li></ul><h3>Anwenden</h3><p>Leiter 5 m lang, Winkel 70° zum Boden: Höhe = 5 · sin 70° ≈ 4,70 m. Einen Winkel berechnet man mit der Umkehrfunktion: tan α = 3/4 ⇒ α = tan⁻¹(0,75) ≈ 36,9°.</p>${M('Taschenrechner auf DEG (Gradmaß) stellen! Skizze mit Hilfslinien hilft bei Vermessungs- und Physikaufgaben.')}`,
q:[['Wie lautet sin α im rechtwinkligen Dreieck?',['Gegenkathete / Hypotenuse','Ankathete / Hypotenuse','Gegenkathete / Ankathete','Hypotenuse / Gegenkathete'],0,'sin = Gegenkathete durch Hypotenuse.'],['Welche Beziehung gilt immer?',['(sin α)² + (cos α)² = 1','sin α + cos α = 1','sin α · cos α = 1','tan α = cos α / sin α'],0,'Folgt aus dem Satz des Pythagoras im Einheitsdreieck.'],['Es gilt sin 30° = 0,5. Wie groß ist cos 60°?',['0,5','1','0,866','0'],0,'cos α = sin(90° − α).'],['Welche Taschenrechner-Einstellung braucht man für Winkel in Grad?',['DEG','RAD','GRA','keine'],0,'RAD wäre das Bogenmaß.']],
m:[()=>{const t=pick(TR.slice(0,2));return{t:`Im rechtwinkligen Dreieck ist die Gegenkathete von α ${t[0]} cm und die Hypotenuse ${t[2]} cm lang. Berechne sin α (als Dezimalzahl oder Bruch).`,a:t[0]/t[2],tol:.005}},()=>{const c=rnd(5,15),al=pick([20,30,35,40,50,60,70]);return{t:`Im rechtwinkligen Dreieck ist c = ${c} cm und α = ${al}°. Berechne die Gegenkathete a (2 Nachkommastellen).`,a:c*Math.sin(al*Math.PI/180),tol:.01,h:'a = c · sin α, Rechner auf DEG.'}},()=>{const a=rnd(2,9),b=rnd(2,9);return{t:`Die Katheten eines rechtwinkligen Dreiecks sind a = ${a} cm (Gegenkathete) und b = ${b} cm. Berechne α in Grad (1 Nachkommastelle).`,a:Math.atan(a/b)*180/Math.PI,tol:.06,h:'tan α = a/b, dann Umkehrfunktion.'}}]},
einheit:{n:'Einheitskreis (0° bis 360°)',
h:`<h3>Sinus und Kosinus am Einheitskreis</h3><p>Der Einheitskreis hat Radius 1 und Mittelpunkt im Ursprung. Der Punkt zum Winkel α (gemessen von der positiven x-Achse gegen den Uhrzeigersinn) hat die Koordinaten <b>P(cos α | sin α)</b>. So sind sin und cos auch für Winkel über 90° erklärt.</p><h3>Vorzeichen nach Quadranten</h3>${tb(['Quadrant','Winkel','sin','cos'],[['I','0° bis 90°','+','+'],['II','90° bis 180°','+','−'],['III','180° bis 270°','−','−'],['IV','270° bis 360°','−','+']])}<h3>Wichtige Werte</h3>${tb(['α','0°','30°','45°','60°','90°'],[['sin α','0','1/2','√2/2','√3/2','1'],['cos α','1','√3/2','√2/2','1/2','0']])}<h3>Symmetrien und Gleichungen</h3><p>sin(180° − α) = sin α und cos(180° − α) = −cos α. Die Gleichung sin x = 0,5 hat im Bereich [0°; 360°[ zwei Lösungen: 30° und 150°. Der Taschenrechner liefert nur einen Winkel (evtl. negativ), die zweite Lösung findest du am Einheitskreis.</p>${M('Immer Quadranten prüfen: Das Vorzeichen von sin und cos sagt, in welchem Quadranten der Winkel liegt.')}`,
q:[['In welchem Bereich sind sin und cos beide negativ?',['180° bis 270°','90° bis 180°','270° bis 360°','0° bis 90°'],0,'Quadrant III.'],['Wie groß ist sin 150°?',['0,5','−0,5','0,866','−0,866'],0,'sin(180° − 30°) = sin 30° = 0,5.'],['Wie viele Lösungen hat sin x = 0,5 zwischen 0° und 360°?',['2 (30° und 150°)','1','4','3'],0,'Der Sinus ist in Quadrant I und II positiv.'],['Der Taschenrechner liefert für cos x = −0,5 den Winkel 120°. Welche weitere Lösung gibt es in [0°; 360°[?',['240°','60°','300°','180°'],0,'cos(360° − α) = cos α, also 360° − 120° = 240°.']],
m:[()=>{const al=pick([30,45,60,120,135,150,210,225,240,300,315,330]),f=pick(['sin','cos']);return{t:`Berechne ${f} ${al}° (3 Nachkommastellen).`,a:Math[f](al*Math.PI/180),tol:.002,h:'Taschenrechner auf DEG.'}},()=>{const a=rnd(2,8)*10;return{t:`Es gilt sin ${a}° = sin x mit 90° &lt; x &lt; 180°. Bestimme x in Grad.`,a:180-a,h:'sin(180° − α) = sin α'}},()=>{const a=rnd(2,8)*10;return{t:`Es gilt cos ${a}° = cos x mit 180° &lt; x &lt; 360°. Bestimme x in Grad.`,a:360-a,h:'cos(360° − α) = cos α'}}]},
sks:{n:'Sinus- und Kosinussatz',
h:`<h3>Allgemeine Dreiecke</h3><p>Im Dreieck ABC liegen die Seiten a, b, c den Winkeln α, β, γ gegenüber.</p><h3>Sinussatz</h3><p style="font-size:1.1rem">${fr('a','sin α')} = ${fr('b','sin β')} = ${fr('c','sin γ')}</p><p>Beweisidee: Die Höhe h<sub>c</sub> ist sowohl b·sin α als auch a·sin β.</p><h3>Kosinussatz</h3><p style="font-size:1.1rem">c² = a² + b² − 2ab·cos γ</p><p>Für γ = 90° ist cos γ = 0, und man erhält den Satz des Pythagoras: Er ist ein Spezialfall des Kosinussatzes.</p><h3>Welcher Satz wann?</h3>${tb(['Gegeben','Satz'],[['zwei Seiten und der eingeschlossene Winkel (SWS)','Kosinussatz'],['drei Seiten (SSS), gesucht Winkel','Kosinussatz (umgestellt)'],['zwei Winkel und eine Seite (WSW, SWW)','Sinussatz'],['zwei Seiten und ein gegenüberliegender Winkel (SsW)','Sinussatz, evtl. zwei Lösungen']])}${M('Kosinussatz bei SWS und SSS, Sinussatz bei zwei Winkeln. Mit diesen Sätzen löst man nun auch rechnerisch Aufgaben, die bisher nur konstruktiv gingen.')}`,
q:[['Welcher Satz passt bei zwei Seiten und dem eingeschlossenen Winkel?',['Kosinussatz','Sinussatz','Strahlensatz','Satz von Vieta'],0,'SWS führt auf den Kosinussatz.'],['Für welchen Winkel wird der Kosinussatz zum Satz des Pythagoras?',['90°','60°','180°','45°'],0,'cos 90° = 0.'],['Welcher Satz passt bei zwei Winkeln und einer Seite?',['Sinussatz','Kosinussatz','Satz des Pythagoras','Strahlensatz'],0,'Aus zwei Winkeln folgt der dritte, dann Sinussatz.']],
m:[()=>{const a=rnd(3,9),b=rnd(3,9),g=pick([60,90,120]);return{t:`In einem Dreieck ist a = ${a} cm, b = ${b} cm und γ = ${g}°. Berechne c (2 Nachkommastellen).`,a:Math.sqrt(a*a+b*b-2*a*b*Math.cos(g*Math.PI/180)),tol:.01,h:'Kosinussatz.'}},()=>{const al=pick([30,40,50,60]),be=pick([70,80,35]),b=rnd(4,12);return{t:`In einem Dreieck ist α = ${al}°, β = ${be}° und b = ${b} cm. Berechne a (2 Nachkommastellen).`,a:b*Math.sin(al*Math.PI/180)/Math.sin(be*Math.PI/180),tol:.01,h:'Sinussatz: a / sin α = b / sin β'}},()=>{const [a,b,c]=pick([[4,5,6],[5,6,7],[6,7,8],[3,4,6],[5,7,9]]);return{t:`Ein Dreieck hat die Seiten a = ${a} cm, b = ${b} cm und c = ${c} cm. Berechne γ (1 Nachkommastelle, in Grad).`,a:Math.acos((a*a+b*b-c*c)/(2*a*b))*180/Math.PI,tol:.06,h:'Kosinussatz nach cos γ umstellen.'}}]}}},
m101:{n:'M10 1 Exponentielles Wachstum und Logarithmus',g:10,d:'Wachstum, Exponentialfunktion, Logarithmus, Anwendungen',t:{
wachs:{n:'Exponentielles Wachstum und Exponentialfunktion',
h:`<h3>Linear oder exponentiell?</h3>${tb(['','linear','exponentiell'],[['pro Schritt','dasselbe addiert','mit demselben Faktor a multipliziert'],['Term','B(t) = B(0) + d·t','B(t) = B(0)·aᵗ'],['Graph (stetig)','Gerade','Kurve, die immer steiler (q &gt; 1) bzw. flacher wird']])}<p>Der <b>Wachstumsfaktor</b> a = 1 + p/100 gilt bei p % Zunahme pro Zeiteinheit. a &gt; 1: <b>Zunahme</b>, 0 &lt; a &lt; 1: <b>Abnahme</b>.</p><h3>Exponentialfunktion B(t) = B(0)·aᵗ (a &gt; 0, a ≠ 1)</h3><p>B(0) ist der Anfangsbestand, a der Wachstumsfaktor und t die Zeit.</p><ul><li>Schnittpunkt mit der B-Achse: (0|B(0)).</li><li>a &gt; 1 (B(0) &gt; 0): streng monoton steigend. 0 &lt; a &lt; 1: streng monoton fallend.</li><li><b>Asymptote:</b> Die x-Achse. Der Graph nähert sich ihr beliebig nahe, erreicht sie nie.</li><li>B(0) &lt; 0 spiegelt den Graphen an der t-Achse.</li></ul><p>Beispiel: Ein Kapital von 1000 € wächst jährlich um 4 %. Nach t Jahren: B(t) = 1000·1,04ᵗ €. Nach 10 Jahren etwa 1480 €.</p>${M('Linear = gleicher Zuwachs pro Schritt. Exponentiell = gleicher Faktor pro Schritt.')}`,
w:plotW({tx:'Untersuche B(t) = B(0)·aᵗ. Beobachte die Asymptote und das Monotonieverhalten. Mit dem Knopf bekommst du eine Zielkurve.',f:(x,q)=>q[0]*q[1]**x,X:[-4,4],Y:[-4,8],ps:[{k:'B(0)',min:-3,max:3,step:.5,v:1,nz:1},{k:'a',min:.2,max:3,step:.1,v:2}],fm:q=>`B(t) = ${dz(q[0])}·${dz(q[1])}<sup>t</sup> &nbsp; B(0) = ${dz(q[0])}`}),wl:'Graph',
q:[['Eine Größe nimmt täglich um 5 % zu. Welcher Wachstumsfaktor passt?',['1,05','0,05','5','1,5'],0,'a = 1 + 5/100.'],['Welche Asymptote hat der Graph von B(t) = 2·3ᵗ?',['Die x-Achse (y = 0)','Die y-Achse','y = 2','y = 3'],0,'Die Funktionswerte nähern sich 0 an.'],['Für welches a ist B(t) = B(0)·aᵗ (B(0) &gt; 0) streng monoton fallend?',['0 &lt; a &lt; 1','a &gt; 1','a &lt; 0','a = 1'],0,'Dann wird mit einem Faktor kleiner als 1 multipliziert.'],['Was unterscheidet exponentielles von linearem Wachstum?',['Pro Schritt wird mit demselben Faktor multipliziert statt dasselbe addiert','Es wächst langsamer','Es hat keinen Startwert','Es fällt immer'],0,'Der Zuwachs wird bei exponentiellem Wachstum immer größer.']],
m:[()=>{const K=rnd(10,50)*100,p=pick([2,3,4,5,6,8,10]),n=rnd(2,10);return{t:`Ein Kapital von ${K} € wächst jährlich um ${p} %. Wie viel ist es nach ${n} Jahren (auf ganze Euro gerundet)?`,a:K*(1+p/100)**n,tol:1,h:`K · ${dz(1+p/100)}<sup>${n}</sup>`}},()=>{const b=rnd(2,10)*10,q=pick([1.5,2,3,.5,.8]);return{t:`Eine Kultur hat zu Beginn ${b} Zellen und nach 1 Stunde ${b*q}. Wie lautet der Wachstumsfaktor a?`,a:q,tol:.005}},()=>{const b=rnd(1,5),a=pick([2,3,4]),x=rnd(2,4);return{t:`Berechne B(${x}) für B(t) = ${b}·${a}<sup>t</sup>.`,a:b*a**x}}]},
log:{n:'Logarithmus und Exponentialgleichungen',
h:`<h3>Definition</h3><p>Der <b>Logarithmus</b> log<sub>b</sub>(c) ist die Zahl x, für die b<sup>x</sup> = c gilt (b &gt; 0, b ≠ 1, c &gt; 0).</p><p>log₂ 8 = 3, denn 2³ = 8. log₁₀ 1000 = 3. log<sub>b</sub> 1 = 0 und log<sub>b</sub> b = 1.</p><h3>Rechenregel</h3><p>log<sub>b</sub>(u<sup>z</sup>) = z · log<sub>b</sub>(u).</p><h3>Taschenrechner</h3><p>Die Taste „log“ (lg) berechnet den Zehnerlogarithmus. Basiswechsel: log<sub>b</sub>(c) = lg c / lg b.</p><h3>Exponentialgleichungen</h3><p>a<sup>x</sup> = c ⇒ x = log<sub>a</sub>(c) = lg c / lg a. Beispiel: 2<sup>x</sup> = 20 ⇒ x = lg 20 / lg 2 ≈ 4,32. Bei B(0)·a<sup>t</sup> = B(t) zuerst durch B(0) teilen. Probe machen!</p>${M('Der Logarithmus ist die Umkehrung des Potenzierens: Er fragt nach dem Exponenten.')}`,
q:[['Was ist log₂ 8?',['3','4','2','16'],0,'2³ = 8.'],['Was bedeutet log<sub>b</sub>(c) = x?',['b hoch x ergibt c','x hoch b ergibt c','b mal x ergibt c','c hoch b ergibt x'],0,'b<sup>x</sup> = c.'],['Wie löst man 3<sup>x</sup> = 50 mit dem Taschenrechner?',['x = lg 50 / lg 3','x = 50 / 3','x = 3 / 50','x = lg 3 / lg 50'],0,'x = log₃(50).'],['Welche Regel gilt?',['log<sub>b</sub>(u<sup>z</sup>) = z · log<sub>b</sub>(u)','log<sub>b</sub>(u<sup>z</sup>) = log<sub>b</sub>(u) + z','log<sub>b</sub>(u·z) = log<sub>b</sub>(u) · log<sub>b</sub>(z)','log<sub>b</sub>(u + z) = log<sub>b</sub>(u) + log<sub>b</sub>(z)'],0,'Der Exponent kommt als Faktor nach vorn.']],
m:[()=>{const b=pick([2,3,5,10]),k=rnd(1,4);return{t:`Berechne log<sub>${b}</sub>(${b**k}).`,a:k,h:`${b} hoch wie viel ergibt ${b**k}?`}},()=>{const b=pick([2,3,5]),c=rnd(10,100);return{t:`Löse ${b}<sup>x</sup> = ${c} (2 Nachkommastellen).`,a:Math.log(c)/Math.log(b),tol:.01,h:'x = lg c / lg b'}},()=>{const b=rnd(1,5),a=pick([2,3,5]),x=rnd(1,4);return{t:`Löse ${b}·${a}<sup>t</sup> = ${b*a**x}.`,a:x,h:`Teile zuerst durch ${b}.`}}]},
zerfall:{n:'Wachstums- und Zerfallsprozesse',
h:`<h3>Modelle aufstellen</h3><p>Wachstum und Abnahme beschreibt man mit B(t) = B(0) · a<sup>t</sup>. B(0) ist der Anfangsbestand, a der Faktor pro Zeiteinheit. Bei Prozessen mit <b>Halbwertszeit</b> T ist a<sup>T</sup> = ½, bei <b>Verdopplungszeit</b> T ist a<sup>T</sup> = 2. Beispiel: radioaktiver Zerfall mit T = 8 Tagen und B(0) = 80 g. Nach 24 Tagen sind es 80 · (½)³ = 10 g.</p><h3>Gesuchte Zeit</h3><p>Aus B(0)·a<sup>t</sup> = B(t) folgt a<sup>t</sup> = B(t)/B(0) und damit t = lg(B(t)/B(0)) / lg(a).</p><h3>Grenzen von Modellen</h3><p>Ungebremstes exponentielles Wachstum ist in der Realität nicht möglich: Platz, Nahrung und Rohstoffe sind begrenzt. Ergebnisse müssen im Sachzusammenhang kritisch geprüft, das Modell bei Bedarf angepasst werden (z. B. Bevölkerungsentwicklung, Pandemien, Zinsen).</p>${M('Modellieren: Situation → Modell (q bestimmen) → rechnen → Ergebnis deuten und Grenzen benennen.')}`,
q:[['Halbwertszeit 5 Tage, Anfangsmenge 80 g. Wie viel bleibt nach 15 Tagen?',['10 g','40 g','20 g','5 g'],0,'80 → 40 → 20 → 10.'],['Warum ist unbegrenztes exponentielles Wachstum oft unrealistisch?',['Es gibt Grenzen wie Platz und Nahrung','Weil q negativ ist','Weil Exponentialfunktionen nicht existieren','Weil es linear ist'],0,'Das Modell passt nur in einem begrenzten Bereich.'],['Wie berechnet man t aus B(0)·a<sup>t</sup> = B(t)?',['t = lg(B(t)/B(0)) / lg(a)','t = B(t)/(B(0)·a)','t = B(t) − B(0)','t = lg(a) / lg(B(t))'],0,'Durch N₀ teilen, dann logarithmieren.']],
m:[()=>{const T=rnd(2,9),k=rnd(2,4),N0=16*rnd(1,8);return{t:`Ein Stoff hat die Halbwertszeit ${T} Tage. Die Anfangsmenge beträgt ${N0} g. Wie viel ist nach ${k*T} Tagen noch übrig (in g)?`,a:N0/2**k,h:`${k} Halbwertszeiten.`}},()=>{const T=rnd(2,6),k=rnd(2,5),N0=rnd(2,9)*10;return{t:`Eine Population verdoppelt sich alle ${T} Stunden und hat zu Beginn ${N0} Individuen. Wie viele sind es nach ${k*T} Stunden?`,a:N0*2**k}},()=>{const q=pick([2,3]),n=rnd(2,6),K=rnd(1,9)*100;return{t:`Ein Wert von ${K} wird jede Woche mit dem Faktor ${q} multipliziert. Nach wie vielen Wochen beträgt er ${K*q**n}?`,a:n,h:'t = lg(B(t) / B(0)) / lg(a)'}}]}}},
m102:{n:'M10 2 Zufallsexperimente und Simulationen',g:10,d:'Baumdiagramme, Pfadregeln, Monte-Carlo-Methode',t:{
baum:{n:'Baumdiagramme und Pfadregeln',
h:`<h3>Mehrstufige Zufallsexperimente</h3><p>Zusammengesetzte Zufallsexperimente (mehrere Stufen) stellt man im <b>Baumdiagramm</b> dar. Jeder Ast trägt seine Wahrscheinlichkeit, die Äste eines Knotens ergeben zusammen 1. Ein <b>Pfad</b> von der Wurzel bis zum Ende ist ein Ergebnis. Urnenexperimente dienen als Modell vieler Situationen.</p><h3>Pfadregeln</h3><ul><li><b>1. Pfadregel (Produktregel):</b> Die Wahrscheinlichkeit eines Pfades ist das Produkt der Astwahrscheinlichkeiten.</li><li><b>2. Pfadregel (Summenregel):</b> Die Wahrscheinlichkeit eines Ereignisses ist die Summe der Wahrscheinlichkeiten der Pfade, die zu ihm gehören.</li></ul><p>Beispiel: Urne mit 3 roten und 2 blauen Kugeln, zweimal ziehen <b>ohne Zurücklegen</b>. P(rr) = ${fr('3','5')}·${fr('2','4')} = ${fr('3','10')}. Beim zweiten Zug hat sich die Urne verändert, die Wahrscheinlichkeiten ändern sich. <b>Mit Zurücklegen</b> bleibt P(rr) = (3/5)² = 9/25.</p><p>„Mindestens einmal rot“ berechnet man oft über das Gegenereignis: 1 − P(bb).</p>${M('Entlang eines Pfades multiplizieren, mehrere Pfade addieren. Bei Gegenereignissen: 1 − P.')}`,
q:[['Wie berechnet man die Wahrscheinlichkeit eines Pfades?',['Produkt der Wahrscheinlichkeiten entlang des Pfades','Summe der Wahrscheinlichkeiten','Differenz','Mittelwert'],0,'1. Pfadregel.'],['Wie erhält man die Wahrscheinlichkeit eines Ereignisses aus mehreren Pfaden?',['Summe der Pfadwahrscheinlichkeiten','Produkt der Pfade','größte Pfadwahrscheinlichkeit','kleinste'],0,'2. Pfadregel.'],['Urne: 3 rote und 2 blaue Kugeln. Zwei Züge ohne Zurücklegen. P(zweimal rot)?',['3/10','9/25','6/25','3/5'],0,'3/5 · 2/4 = 3/10.'],['Eine faire Münze wird dreimal geworfen. P(dreimal Zahl)?',['1/8','1/3','3/8','1/2'],0,'(1/2)³ = 1/8.']],
m:[()=>{const r=rnd(1,5),s=rnd(1,5),n=r+s;return{t:`Eine Urne enthält ${r} rote und ${s} blaue Kugeln. Es wird zweimal mit Zurücklegen gezogen. Wie groß ist P(zweimal rot)? (Dezimalzahl oder Bruch)`,a:(r/n)**2,tol:.003}},()=>{const r=rnd(2,6),s=rnd(1,5),n=r+s;return{t:`Eine Urne enthält ${r} rote und ${s} blaue Kugeln. Es wird zweimal ohne Zurücklegen gezogen. Wie groß ist P(zweimal rot)? (Dezimalzahl oder Bruch)`,a:r/n*(r-1)/(n-1),tol:.003,h:'Beim zweiten Zug ist eine rote Kugel weniger in der Urne.'}},()=>{const r=rnd(1,5),s=rnd(1,5),n=r+s;return{t:`Eine Urne enthält ${r} rote und ${s} blaue Kugeln. Es wird zweimal mit Zurücklegen gezogen. Wie groß ist P(mindestens einmal rot)? (Dezimalzahl oder Bruch)`,a:1-(s/n)**2,tol:.003,h:'Gegenereignis: zweimal blau.'}}]},
sim:{n:'Simulation und Monte-Carlo-Methode',
h:`<h3>Zufall am Rechner</h3><p>Bei einer <b>Simulation</b> wiederholt man ein Zufallsexperiment sehr oft mit Zufallszahlen und nutzt die relative Häufigkeit als Näherung für die Wahrscheinlichkeit. Mit wachsender Versuchszahl stabilisiert sich die relative Häufigkeit (Gesetz der großen Zahlen). So untersucht man Probleme, die man noch nicht berechnen kann, z. B. das „Ziegenproblem“, die „vertauschten Briefe“ oder das „Geburtstagsproblem“, oder prüft berechnete Werte auf Plausibilität.</p><h3>Monte-Carlo-Methode für π</h3><p>Zufallspunkte (x|y) im Quadrat [0;1]². Ein Punkt liegt im Viertelkreis, wenn x² + y² ≤ 1. Der Viertelkreis hat den Flächeninhalt π/4, das Quadrat 1. Also ist der Anteil der Treffer ungefähr π/4:</p><p style="font-size:1.1rem">π ≈ 4 · ${fr('Treffer','alle Punkte')}</p><p>In einer Tabellenkalkulation nutzt man <code>ZUFALLSZAHL()</code> und eine bedingte Anweisung <code>=WENN(A2^2+B2^2&lt;=1;1;0)</code>. Zum Vergleich gibt es nicht zufallsbasierte Verfahren, z. B. die Streifenmethode.</p>${M('Je mehr Punkte, desto genauer, aber nur im Durchschnitt. Zufallsergebnisse schwanken.')}`,
w:mcW,wl:'Experiment',
q:[['Wie nähert man π mit Monte-Carlo?',['π ≈ 4 · (Treffer im Viertelkreis / alle Punkte)','π ≈ Treffer / alle Punkte','π ≈ 2 · alle Punkte','π ≈ 4 · alle Punkte'],0,'Treffer-Anteil ≈ π/4.'],['Was passiert mit der relativen Häufigkeit bei sehr vielen Versuchen?',['Sie stabilisiert sich nahe der Wahrscheinlichkeit','Sie wird 0','Sie wird 1','Sie schwankt immer stärker'],0,'Gesetz der großen Zahlen.'],['Wann liegt ein Punkt (x|y) im Viertelkreis mit Radius 1?',['x² + y² ≤ 1','x + y ≤ 1','x · y ≤ 1','x ≤ y'],0,'Abstand zum Ursprung höchstens 1.']],
m:[()=>{const T=rnd(770,800);return{t:`Von 1000 Zufallspunkten liegen ${T} im Viertelkreis. Welcher Näherungswert für π ergibt sich (Monte-Carlo)?`,a:4*T/1000,tol:.0005}},()=>{const T=rnd(150,165);return{t:`Von 200 Zufallspunkten liegen ${T} im Viertelkreis. Welcher Näherungswert für π ergibt sich?`,a:4*T/200,tol:.0005}},()=>{const h=rnd(60,100);return{t:`Bei 500 Würfen eines Würfels fiel die Sechs genau ${h}-mal. Wie groß ist die relative Häufigkeit? (Dezimalzahl)`,a:h/500,tol:.0005}}]}}},
m103:{n:'M10 3 Sinus- und Kosinusfunktion',g:10,d:'Bogenmaß, Graphen, Parameter, periodische Vorgänge',t:{
bogen:{n:'Bogenmaß und Einheitskreis',
h:`<h3>Bogenmaß</h3><p>Das <b>Bogenmaß</b> x eines Winkels ist die Länge des zugehörigen Bogens auf dem Einheitskreis. Der ganze Kreis hat den Umfang 2π, also gilt 360° = 2π und 180° = π.</p>${tb(['Grad','30°','45°','60°','90°','180°','270°','360°'],[['Bogenmaß','π/6','π/4','π/3','π/2','π','3π/2','2π']])}<p>Umrechnung: x = α · ${fr('π','180°')} und α = x · ${fr('180°','π')}. Das Bogenmaß ist eine reelle Zahl. Deshalb eignet es sich für Funktionsgraphen. Taschenrechner auf RAD stellen.</p><h3>Werte über 2π und negative Winkel</h3><p>Nach einer vollen Umdrehung (2π) liegt man wieder am selben Punkt: sin(x + 2π) = sin x, cos(x + 2π) = cos x. Negative Winkel laufen im Uhrzeigersinn: sin(−x) = −sin x, cos(−x) = cos x. So führt man jeden Wert auf einen Winkel in [0; 2π[ zurück. Beispiel: sin(7π/2) = sin(3π/2) = −1.</p>${M('Ein Punkt auf dem Einheitskreis mit dem Bogenmaß x hat die Koordinaten (cos x | sin x).')}`,
q:[['Welches Bogenmaß hat 90°?',['π/2','π','π/4','2π'],0,'180° entsprechen π.'],['Welchem Winkel entspricht π/3?',['60°','30°','45°','120°'],0,'π/3 · 180°/π = 60°.'],['Wie groß ist sin(7π/2)?',['−1','1','0','−0,5'],0,'7π/2 − 2π = 3π/2, sin(3π/2) = −1.'],['Welche Taschenrechner-Einstellung braucht man für das Bogenmaß?',['RAD','DEG','GRA','keine'],0,'DEG wäre das Gradmaß.']],
m:[()=>{const al=pick([30,45,60,90,120,135,150,180,270]);return{t:`Rechne ${al}° ins Bogenmaß um (2 Nachkommastellen).`,a:al*Math.PI/180,tol:.006,h:'x = α · π / 180°'}},()=>{const x=pick([.5,1,1.5,2,2.5,3]);return{t:`Rechne x = ${dz(x)} (Bogenmaß) in Grad um (1 Nachkommastelle).`,a:x*180/Math.PI,tol:.1,h:'α = x · 180° / π'}},()=>{const x=pick([1,2,3,4,5]);return{t:`Berechne sin(${x}) mit dem Taschenrechner im Bogenmaß (3 Nachkommastellen).`,a:Math.sin(x),tol:.002,h:'Rechner auf RAD.'}}]},
sinf:{n:'Graphen von Sinus und Kosinus',
h:`<h3>Die Sinuskurve</h3><p>f(x) = sin x hat die <b>Periode 2π</b>, die Wertemenge [−1; 1], die Nullstellen kπ und ist punktsymmetrisch zum Ursprung. Der Kosinus hat dieselbe Form, ist aber achsensymmetrisch zur y-Achse: cos x = sin(x + π/2). Der Verlauf ergibt sich aus der y-Koordinate (Sinus) bzw. x-Koordinate (Kosinus) des Punktes am Einheitskreis.</p><h3>Parameter bei f(x) = a·sin(b·(x + c)) + d</h3>${tb(['Parameter','Wirkung'],[['a','Amplitude |a|, Streckung in y-Richtung (a &lt; 0: Spiegelung)'],['b','Periode p = 2π/|b|'],['c','Verschiebung in x-Richtung um −c'],['d','Verschiebung in y-Richtung (Mittellage)']])}<p>Wertemenge: [d − |a|; d + |a|].</p><h3>Term aus dem Graphen</h3><p>Amplitude |a| = (Max − Min)/2, Mittellage d = (Max + Min)/2, b = 2π/Periode, Phase c aus einem Nulldurchgang oder Hochpunkt.</p><h3>Anwendungen</h3><p>Periodische Vorgänge: Gezeiten, Tageslänge im Jahr, Schwingungen, Wechselspannung. Modelliere mit sin oder cos und variiere die Parameter, bis die Daten passen.</p>`,
w:plotW({tx:'Verändere a, b, c und d und beobachte die Sinuskurve. Mit dem Knopf bekommst du eine Zielkurve. Die x-Achse ist im Bogenmaß.',f:(x,q)=>q[0]*Math.sin(q[1]*(x+q[2]))+q[3],X:[-7,7],Y:[-5,5],ps:[{k:'a',min:-3,max:3,step:.5,v:1,nz:1},{k:'b',min:.5,max:3,step:.5,v:1},{k:'c',min:-3,max:3,step:.5,v:0},{k:'d',min:-3,max:3,step:1,v:0}],fm:q=>`f(x) = ${dz(q[0])}·sin(${dz(q[1])}·(x ${sg(q[2])})) ${sg(q[3])} &nbsp; Periode ${dz(2*Math.PI/q[1])}`}),wl:'Graph',
q:[['Welche Periode hat f(x) = sin(2x)?',['π','2π','4π','π/2'],0,'p = 2π/2 = π.'],['Welche Wertemenge hat f(x) = 3·sin x + 1?',['[−2; 4]','[−3; 3]','[−1; 1]','[1; 4]'],0,'[1 − 3; 1 + 3].'],['Welcher Parameter verschiebt den Graphen in y-Richtung?',['d','a','b','c'],0,'d ist die Mittellage.'],['Welche Symmetrie hat der Graph von cos x?',['Achsensymmetrie zur y-Achse','Punktsymmetrie zum Ursprung','keine','Symmetrie zur x-Achse'],0,'cos(−x) = cos x.']],
m:[()=>{const b=pick([2,3,4,.5,1.5]);return{t:`Berechne die Periode von f(x) = sin(${dz(b)}·x) (2 Nachkommastellen).`,a:2*Math.PI/b,tol:.01,h:'p = 2π / |b|'}},()=>{const a=rnd(1,4),d=rnd(-3,3);return{t:`Wie groß ist der größte Funktionswert von f(x) = ${a}·sin x ${sg(d)}?`,a:a+d,h:'Maximum bei sin x = 1.'}},()=>{const mx=rnd(2,6),mn=mx-2*rnd(1,3);return{t:`Eine Funktion f(x) = a·sin(b·x) + d hat das Maximum ${mx} und das Minimum ${pm(mn)}. Bestimme d.`,a:(mx+mn)/2,h:'d = (Max + Min) / 2'}}]}}},
m104:{n:'M10 4 Ganzrationale Funktionen',g:10,d:'Grad, Randverhalten, Symmetrie, Nullstellen',t:{
gr:{n:'Verhalten und Symmetrie',
h:`<h3>Ganzrationale Funktionen</h3><p>f(x) = aₙxⁿ + … + a₁x + a₀ mit aₙ ≠ 0 und n ∈ ℕ₀ heißt <b>ganzrationale Funktion</b> vom <b>Grad</b> n. Sie ist die Summe von Potenzfunktionen mit nicht negativen ganzzahligen Exponenten. aₙ heißt Leitkoeffizient.</p><h3>Verhalten für |x| → ∞</h3><p>Der Summand mit dem höchsten Exponenten bestimmt das Verhalten an den Rändern.</p>${tb(['Grad','aₙ','x → +∞','x → −∞'],[['gerade','&gt; 0','+∞','+∞'],['gerade','&lt; 0','−∞','−∞'],['ungerade','&gt; 0','+∞','−∞'],['ungerade','&lt; 0','−∞','+∞']])}<h3>Symmetrie</h3><ul><li>Nur gerade Exponenten (z. B. x⁴ − 3x² + 1): achsensymmetrisch zur y-Achse, f(−x) = f(x).</li><li>Nur ungerade Exponenten (z. B. x³ + 2x): punktsymmetrisch zum Ursprung, f(−x) = −f(x).</li><li>Gemischt: keine dieser Symmetrien.</li></ul><h3>Rückschlüsse aus dem Graphen</h3><p>Der Grad ist mindestens so groß wie die Anzahl der Nullstellen und mindestens (Anzahl der Extrempunkte + 1). Das Randverhalten verrät, ob der Grad gerade oder ungerade ist.</p>`,
w:plotW({tx:'Untersuche f(x) = a·x³ + b·x² + c·x + d: Randverhalten, Symmetrie, Nullstellen. Mit dem Knopf bekommst du eine Zielkurve.',f:(x,q)=>q[0]*x**3+q[1]*x**2+q[2]*x+q[3],X:[-4,4],Y:[-8,8],ps:[{k:'a',min:-2,max:2,step:.5,v:1,nz:1},{k:'b',min:-3,max:3,step:1,v:0},{k:'c',min:-4,max:4,step:1,v:0},{k:'d',min:-4,max:4,step:1,v:0}],fm:q=>`f(x) = ${dz(q[0])}x³ ${sg(q[1])}x² ${sg(q[2])}x ${sg(q[3])}`}),wl:'Graph',
q:[['Wie verhält sich f(x) = −2x⁴ + x für x → +∞?',['f(x) → −∞','f(x) → +∞','f(x) → 0','f(x) → 1'],0,'Gerader Grad, negativer Leitkoeffizient.'],['Welche Symmetrie hat f(x) = x⁴ − 3x²?',['Achsensymmetrie zur y-Achse','Punktsymmetrie zum Ursprung','keine','beide'],0,'Nur gerade Exponenten.'],['Welche Symmetrie hat f(x) = x³ + 2x?',['Punktsymmetrie zum Ursprung','Achsensymmetrie zur y-Achse','keine','beide'],0,'Nur ungerade Exponenten.'],['Grad 3, positiver Leitkoeffizient. Was gilt für x → −∞?',['f(x) → −∞','f(x) → +∞','f(x) → 0','keine Aussage'],0,'Ungerader Grad: die Enden gehen in entgegengesetzte Richtungen.']],
m:[()=>{const n=pick([3,4,5,6]);return{t:`Welchen Grad hat f(x) = ${rnd(1,4)}x<sup>${n}</sup> ${sg(rnd(-4,4)||1)}x<sup>2</sup> ${sg(rnd(1,5))}?`,a:n,h:'Der höchste Exponent zählt.'}},()=>{const a=rnd(1,3),b=rnd(1,3)*pick([1,-1]),c=rnd(-4,4),x=pick([-2,-1,2,3]);return{t:`Berechne f(${pm(x)}) für f(x) = ${a}x³ ${sg(b)}x² ${sg(c)}.`,a:a*x**3+b*x*x+c}},()=>{const n=rnd(3,7);return{t:`Eine ganzrationale Funktion hat den Grad ${n}. Wie viele Nullstellen kann sie höchstens haben?`,a:n,h:'Höchstens so viele wie der Grad.'}}]},
nst:{n:'Nullstellen bestimmen',
h:`<h3>Verfahren</h3><ul><li><b>Ausklammern und Nullprodukt:</b> x³ − 4x = x(x² − 4) = x(x − 2)(x + 2). Ein Produkt ist 0, wenn ein Faktor 0 ist: x = 0, 2, −2.</li><li><b>Biquadratische Gleichungen</b> ax⁴ + bx² + c = 0: Substituiere z = x². Löse az² + bz + c = 0. Dann x = ±√z (nur für z ≥ 0).</li></ul><p>Beispiel: x⁴ − 5x² + 4 = 0 ⇒ z² − 5z + 4 = 0 ⇒ z = 1 oder z = 4 ⇒ x = ±1 oder x = ±2.</p><h3>Vielfachheit</h3><p>Steht der Faktor (x − x₀) genau k-mal im Term, ist x₀ eine <b>Nullstelle der Vielfachheit k</b>. Bei geradem k berührt der Graph die x-Achse (kein Vorzeichenwechsel), bei ungeradem k schneidet er sie (Vorzeichenwechsel).</p><p>Beispiel: f(x) = (x − 1)²·(x + 2) hat bei x = 1 eine doppelte Nullstelle (Berührpunkt) und bei x = −2 eine einfache.</p><h3>Skizze</h3><p>Nullstellen, Vielfachheiten, y-Achsenabschnitt und Randverhalten genügen für eine Skizze. Mit einem Funktionenplotter lässt sie sich kontrollieren.</p>${M('Faktorisieren ist der Schlüssel: Aus der Produktform liest man Nullstellen und ihre Vielfachheit direkt ab.')}`,
q:[['Wie löst man x³ − 9x = 0 am besten?',['Ausklammern: x(x² − 9) = 0','Wurzel ziehen','Substitution z = x³','Gar nicht'],0,'x = 0, 3, −3.'],['Welche Nullstellen hat f(x) = x⁴ − 5x² + 4?',['−2, −1, 1, 2','1 und 4','2 und −2','keine'],0,'z = x²: z = 1 oder 4.'],['f(x) = (x − 1)²·(x + 2). Wie verhält sich der Graph bei x = 1?',['Er berührt die x-Achse (doppelte Nullstelle)','Er schneidet die x-Achse mit Vorzeichenwechsel','Er hat dort eine Polstelle','Er hat dort keine Nullstelle'],0,'Gerade Vielfachheit: kein Vorzeichenwechsel.'],['Was besagt der Satz vom Nullprodukt?',['Ein Produkt ist 0, wenn mindestens ein Faktor 0 ist','Ein Produkt ist immer 0','Alle Faktoren müssen gleich sein','Eine Summe ist 0, wenn ein Summand 0 ist'],0,'Er ist die Grundlage der Faktorisierungsmethode.']],
m:[()=>{const a=rnd(2,6),b=rnd(1,6);return{t:`Gib die größte Nullstelle von f(x) = x·(x − ${a})·(x + ${b}) an.`,a,h:'Nullprodukt: jeder Faktor einzeln gleich 0.'}},()=>{let p,q;do{p=rnd(1,4);q=rnd(1,4)}while(p==q);return{t:`Löse x<sup>4</sup> ${sg(-(p*p+q*q))}x<sup>2</sup> ${sg(p*p*q*q)} = 0. Gib die größte Lösung an.`,a:Math.max(p,q),h:'Substituiere z = x².'}},()=>{let a,b;do{a=rnd(1,5);b=rnd(1,5)}while(a==b);return{t:`Löse x·(x − ${a})·(x + ${b}) = 0. Gib alle Lösungen an, getrennt durch ;`,a:[0,a,-b]}}]}}},
m105:{n:'M10 5 Raumgeometrie',g:10,d:'Pyramide, Kegel, Kugel, Rotationskörper',t:{
koerper:{n:'Pyramide, Kegel und Kugel',
h:`<h3>Formeln</h3>${tb(['Körper','Volumen','Oberfläche'],[['Prisma','V = G · h','O = 2G + M'],['Pyramide','V = ⅓ · G · h','O = G + M'],['Zylinder','V = π·r²·h','O = 2πr² + 2πrh'],['Kegel','V = ⅓ · π·r²·h','O = πr² + πrs'],['Kugel','V = ⁴⁄₃ · π·r³','O = 4πr²']])}<p>Beim Kegel ist s = √(r² + h²) die Mantellinie (Satz des Pythagoras).</p><h3>Rotationskörper</h3><p>Dreht man ein Rechteck um eine Seite, entsteht ein <b>Zylinder</b>, ein rechtwinkliges Dreieck um eine Kathete ein <b>Kegel</b>, einen Halbkreis um seinen Durchmesser eine <b>Kugel</b>.</p><h3>Begründungen</h3><ul><li><b>Cavalieri:</b> Körper gleicher Höhe, deren Querschnitte in jeder Höhe gleichen Flächeninhalt haben, haben gleiches Volumen. Deshalb gilt V = G·h auch für schiefe Prismen.</li><li><b>Pyramide:</b> Ein Würfel lässt sich in drei kongruente Pyramiden zerlegen. Daher der Faktor ⅓.</li><li><b>Kegel:</b> Grenzfall von Pyramiden, deren Grundfläche ein n-Eck mit n → ∞ ist.</li><li><b>Kegelmantel:</b> Im Netz ist der Mantel ein Kreissektor mit Radius s und Bogenlänge 2πr. Fläche: ½·s·2πr = πrs.</li></ul><p>Bei Sachaufgaben kombiniert man Volumen- und Oberflächenformeln mit Pythagoras, Strahlensatz und Trigonometrie. Zeichne immer eine Skizze.</p>${M('Rotationskörper, Netze und Schrägbilder: Wer sich den Körper vorstellen kann, findet die richtige Formel.')}`,
q:[['Wie lautet die Volumenformel des Kegels?',['⅓·π·r²·h','π·r²·h','⅔·π·r²·h','π·r·s'],0,'Ein Drittel von Grundfläche mal Höhe.'],['Aus welcher Figur entsteht ein gerader Kreiskegel durch Rotation?',['Rechtwinkliges Dreieck (Drehung um eine Kathete)','Rechteck','Halbkreis','Kreis'],0,'Die Kathete ist die Drehachse.'],['Wie groß ist die Oberfläche einer Kugel mit Radius r?',['4πr²','πr²','⁴⁄₃πr³','2πr²'],0,'Vierfache Kreisfläche.'],['Was besagt das Prinzip von Cavalieri?',['Gleiche Höhe und in jeder Höhe flächengleiche Schnitte bedeuten gleiches Volumen','Alle Pyramiden haben gleiches Volumen','Das Volumen ist immer ⅓·G·h','Jeder Körper hat gleiche Oberfläche'],0,'Es begründet V = G·h auch für schiefe Prismen.']],
m:[()=>{const G=3*rnd(2,10),h=rnd(2,9);return{t:`Eine Pyramide hat die Grundfläche G = ${G} cm² und die Höhe h = ${h} cm. Berechne das Volumen in cm³.`,a:G*h/3}},()=>{const r=rnd(2,6),h=rnd(2,9);return{t:`Berechne das Volumen eines Kegels mit r = ${r} cm und h = ${h} cm (1 Nachkommastelle).`,a:Math.PI*r*r*h/3,tol:.06,h:'V = ⅓·π·r²·h'}},()=>{const r=rnd(2,8);return{t:`Berechne den Oberflächeninhalt einer Kugel mit r = ${r} cm (1 Nachkommastelle).`,a:4*Math.PI*r*r,tol:.06,h:'O = 4·π·r²'}}]}}}
}};
function mcW(el){let M0={n:0,h:0,p:[]};
 el.innerHTML=`<p class=task>Würfle Zufallspunkte in das Quadrat. Punkte im Viertelkreis (x² + y² ≤ 1) sind Treffer.</p><svg id=mc class=pl viewBox="0 0 320 320"></svg><p id=mo class=mono></p><div><button class=btn id=m1>+100 Punkte</button><button class=btn2 id=m2>+1000 Punkte</button><button class=btn2 id=m3>Zurücksetzen</button></div><div id=out></div>`;
 const dr=()=>{$('#mc').innerHTML=`<rect width="320" height="320" fill="none" stroke="var(--bd)"/>`+M0.p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="1.6" fill="${q[2]?'var(--ok)':'var(--er)'}"/>`).join('')+`<path d="M320 320A320 320 0 0 0 0 0" fill="none" stroke="var(--ac)" stroke-width="2"/>`;
  $('#mo').innerHTML=M0.n?`${M0.n} Punkte, ${M0.h} Treffer: π ≈ 4·${M0.h}/${M0.n} = <b>${(4*M0.h/M0.n).toFixed(4).replace('.',',')}</b>`:'Noch keine Punkte.';
  if(M0.n>=1000){const g=once('w',10);if(g)$('#out').innerHTML=`<p class=good>Schon 1000 Punkte! +${g} XP</p>`}};
 const add=k=>{for(let i=0;i<k;i++){const x=Math.random(),y=Math.random(),t=x*x+y*y<=1;M0.n++;if(t)M0.h++;if(M0.p.length<4000)M0.p.push([+(x*320).toFixed(1),+(320-y*320).toFixed(1),t])}dr()};
 $('#m1').onclick=()=>add(100);$('#m2').onclick=()=>add(1000);$('#m3').onclick=()=>{M0={n:0,h:0,p:[]};dr()};dr()}
function plotW(c){return el=>{
 const P=c.ps,v=P.map(p=>p.v),W=460,H=320,[x0,x1]=c.X,[y0,y1]=c.Y,sx=x=>(x-x0)/(x1-x0)*W,sy=y=>H-(y-y0)/(y1-y0)*H;let tg=null,won=0;
 const path=q=>{let d='',on=0;for(let i=0;i<=300;i++){const x=x0+(x1-x0)*i/300,y=c.f(x,q);if(!isFinite(y)||y<y0-8||y>y1+8){on=0;continue}d+=(on?'L':'M')+sx(x).toFixed(1)+' '+sy(y).toFixed(1);on=1}return d};
 let g='';for(let x=Math.ceil(x0);x<=x1;x++)g+=`<line x1="${sx(x)}" y1="0" x2="${sx(x)}" y2="${H}" class=gl />`;for(let y=Math.ceil(y0);y<=y1;y++)g+=`<line x1="0" y1="${sy(y)}" x2="${W}" y2="${sy(y)}" class=gl />`;
 g+=`<line x1="${sx(0)}" y1="0" x2="${sx(0)}" y2="${H}" class=ax /><line x1="0" y1="${sy(0)}" x2="${W}" y2="${sy(0)}" class=ax />`;
 el.innerHTML=`<p class=task>${c.tx}</p><svg id=pl class=pl viewBox="0 0 ${W} ${H}"></svg>${P.map((p,i)=>`<label class=sl><span>${p.k}</span><input type=range min=${p.min} max=${p.max} step=${p.step} value=${p.v} data-i=${i} aria-label="Parameter ${p.k}"><b id=sv${i}></b></label>`).join('')}<p id=fm class=mono></p><button class=btn2 id=gb>Zielkurve nachbauen (Aufgabe)</button><div id=out></div>`;
 const up=()=>{P.forEach((p,i)=>$('#sv'+i).textContent=String(v[i]).replace('.',','));$('#pl').innerHTML=g+(tg?`<path d="${path(tg)}" class=tg />`:'')+`<path d="${path(v)}" class=cv />`;$('#fm').innerHTML=c.fm(v);
  if(tg&&!won&&v.every((x,i)=>Math.abs(x-tg[i])<1e-9)){won=1;const n=once('w',15);$('#out').innerHTML=`<p class=good>Geschafft!${n?' +'+n+' XP':''}</p>`}};
 el.querySelectorAll('input').forEach(i=>i.oninput=()=>{v[+i.dataset.i]=+i.value;up()});
 $('#gb').onclick=()=>{tg=P.map(p=>{let k;do{k=p.min+Math.round(Math.random()*(p.max-p.min)/p.step)*p.step}while(p.nz&&Math.abs(k)<1e-9);return Math.round(k*100)/100});won=0;$('#out').innerHTML='<p>Die gestrichelte Kurve ist das Ziel. Stelle die Regler so ein, dass beide Kurven übereinanderliegen.</p>';$('#gb').textContent='Neue Zielkurve';up()};
 up()}}

const Q=(q,ok,bad,e)=>[q,[ok,...bad],0,e],rt=x=>Math.max(.01,Math.abs(x)*.015),GG=9.81,r2=x=>Math.round(x*100)/100;
function fallW(el){el.innerHTML=`<p class=task>Ein Körper (m = 2 kg) fällt reibungsfrei aus 10 m Höhe. Ziehe den Regler und beobachte, wie Höhenenergie in kinetische Energie umgewandelt wird.</p><label class=sl><span>Fallstrecke</span><input type=range id=fs min=0 max=10 step=.5 value=0 aria-label="Fallstrecke"><b id=fv style="width:5em"></b></label><div id=fb></div><p class=mono id=ft></p>`;
 const up=()=>{const s=+$('#fs').value,m=2,h0=10,Eg=m*GG*h0,Eh=m*GG*(h0-s),Ek=m*GG*s,w=x=>(x/Eg*100).toFixed(1),f1=x=>dz(Math.round(x*10)/10);
  $('#fv').textContent=dz(s)+' m';
  $('#fb').innerHTML=`<div class=bar><span>E<sub>h</sub> = ${f1(Eh)} J</span><i style="width:${w(Eh)}%;background:var(--pu)"></i></div><div class=bar><span>E<sub>k</sub> = ${f1(Ek)} J</span><i style="width:${w(Ek)}%;background:var(--ac)"></i></div>`;
  $('#ft').innerHTML=`Summe: ${f1(Eh+Ek)} J, Geschwindigkeit v = ${dz(r2(Math.sqrt(2*GG*s)))} m/s`};
 $('#fs').oninput=up;up()}
F.physik={n:'Physik',sb:'Jahrgangsstufe 9 und 10 (NTG)',c:'var(--ok)',ref:1,sub:{
p91:{n:'Ph9 1.1 Mechanische Energie',g:9,d:'Energieformen, Energieerhaltung, Arbeit, Leistung',t:{
energie:{n:'Energieformen und Energieerhaltung',
h:`<h3>Energieformen und Umwandlungen</h3><p>Energie tritt in vielen Formen auf: <b>kinetische Energie</b> (Bewegung), <b>Höhenenergie</b> (Lage im Schwerefeld), <b>Spannenergie</b> (gespannte Feder, Bogen), außerdem thermische, elektrische, chemische und Strahlungsenergie. Vorgänge in Technik und Natur beschreibt man als <b>Energieumwandlung</b>. Auf der Achterbahn wird Höhenenergie in kinetische Energie umgewandelt und umgekehrt.</p><h3>Energieerhaltung</h3><p>In einem abgeschlossenen System bleibt die <b>Gesamtenergie konstant</b>. Energie wird nur umgewandelt oder übertragen, nie erzeugt oder vernichtet. Bei Reibung wird mechanische Energie in innere (thermische) Energie umgewandelt und ist dann kaum noch nutzbar.</p><h3>Quantitativ</h3>${tb(['Größe','Formel','Einheit'],[['Höhenenergie','E<sub>h</sub> = m·g·h','J (Joule)'],['kinetische Energie','E<sub>k</sub> = ½·m·v²','J']])}<p>g = 9,81 N/kg ist der Ortsfaktor. Fällt ein Körper reibungsfrei aus der Höhe h, gilt m·g·h = ½·m·v². Die Masse kürzt sich: <b>v = √(2·g·h)</b>. Bei doppelter Geschwindigkeit wird E<sub>k</sub> viermal so groß.</p>${M('Energiebilanz: Energie vorher = Energie nachher (plus Verluste). So beginnt jede Energieaufgabe.')}`,
w:fallW,wl:'Experiment',
q:[Q('Was besagt die Energieerhaltung?','In einem abgeschlossenen System bleibt die Gesamtenergie konstant',['Energie kann beliebig erzeugt werden','Bei Reibung geht Energie verloren','Energie ist immer kinetisch'],'Energie wird nur umgewandelt oder übertragen.'),Q('Welche Formel gilt für die Höhenenergie?','E = m·g·h',['E = ½·m·v²','E = F·t','E = m·v'],'Masse mal Ortsfaktor mal Höhe.'),Q('Ein Stein fällt reibungsfrei. Welche Energie nimmt zu?','Die kinetische Energie',['Die Höhenenergie','Die Spannenergie','Keine'],'Höhenenergie wird in kinetische Energie umgewandelt.'),Q('Die Geschwindigkeit verdoppelt sich. Wie ändert sich E<sub>k</sub>?','Sie wird 4-mal so groß',['Sie wird 2-mal so groß','Sie bleibt gleich','Sie wird halb so groß'],'E<sub>k</sub> ist proportional zu v².')],
m:[()=>{const m=rnd(1,20),h=rnd(1,30);return{t:`Berechne die Höhenenergie einer Masse von ${m} kg in ${h} m Höhe (g = 9,81 N/kg) in J.`,a:m*GG*h,tol:rt(m*GG*h),h:'E = m·g·h'}},()=>{const m=rnd(1,20),v=rnd(2,25);return{t:`Ein Körper der Masse ${m} kg bewegt sich mit ${v} m/s. Berechne seine kinetische Energie in J.`,a:m*v*v/2,tol:rt(m*v*v/2),h:'E = ½·m·v²'}},()=>{const h=rnd(2,45),v=Math.sqrt(2*GG*h);return{t:`Ein Körper fällt reibungsfrei aus ${h} m Höhe. Mit welcher Geschwindigkeit in m/s trifft er auf (2 Nachkommastellen)?`,a:v,tol:rt(v),h:'Höhenenergie wird zu kinetischer Energie: v = √(2gh).'}}]},
arbeit:{n:'Arbeit und Leistung',
h:`<h3>Mechanische Arbeit</h3><p>Die <b>Arbeit</b> W misst, wie viel mechanische Energie einem System zugeführt oder entzogen wird. Wirkt eine Kraft F in Wegrichtung über die Strecke s, gilt <b>W = F·s</b> (Einheit 1 J = 1 N·m). Die <b>Hubarbeit</b> W = m·g·h hängt nur von der Höhe ab, nicht vom Weg. Auf der schiefen Ebene ist die Kraft kleiner, der Weg dafür länger, die Arbeit bleibt gleich.</p><h3>Leistung</h3><p>Die <b>Leistung</b> P gibt an, wie viel Energie pro Zeit umgesetzt wird: <b>P = W/t = ΔE/t</b> (Einheit 1 W = 1 J/s). Beispiel: Wer 60 kg in 5 s um 3 m hebt, leistet P = 60·9,81·3/5 W ≈ 353 W.</p><h3>Begriffe sauber trennen</h3>${tb(['Größe','Einheit','Bedeutung'],[['Kraft','N','Wechselwirkung, verformt oder beschleunigt'],['Energie','J','Zustandsgröße, Vorrat'],['Arbeit','J','Prozessgröße, übertragene mechanische Energie'],['Leistung','W','Energie pro Zeit']])}<p>Alltagssprache („Kraft verbrauchen“, „Energie erzeugen“) ist fachsprachlich falsch: Man wandelt Energie um.</p>${M('Die Goldene Regel der Mechanik: Was man an Kraft spart, muss man an Weg zugeben. Arbeit spart man nicht.')}`,
q:[Q('Welche Einheit hat die Leistung?','Watt (W)',['Joule (J)','Newton (N)','Pascal (Pa)'],'1 W = 1 J/s.'),Q('Ein Aufzug wirkt mit 500 N über 10 m. Wie groß ist die Arbeit?','5000 J',['50 J','510 J','5 J'],'W = F·s = 500 N · 10 m.'),Q('Was ändert die schiefe Ebene?','Die benötigte Kraft, nicht die Arbeit',['Die Arbeit, nicht die Kraft','Beides','Nichts'],'Kleinere Kraft, längerer Weg, gleiche Arbeit.'),Q('Welche Formulierung ist fachsprachlich korrekt?','Die Hubarbeit erhöht die Höhenenergie',['Man verbraucht Kraft','Energie wird erzeugt','Die Arbeit steckt im Körper'],'Arbeit ist übertragene Energie.')],
m:[()=>{const F=rnd(5,50)*10,s=rnd(2,20);return{t:`Eine Kraft von ${F} N wirkt in Wegrichtung über ${s} m. Wie groß ist die Arbeit in J?`,a:F*s,h:'W = F·s'}},()=>{const W=rnd(1,20)*100,t=rnd(2,20);return{t:`Ein Motor verrichtet ${W} J Arbeit in ${t} s. Wie groß ist seine Leistung in W?`,a:W/t,tol:rt(W/t),h:'P = W/t'}},()=>{const m=rnd(50,80),h=rnd(3,12),t=rnd(5,20),P=m*GG*h/t;return{t:`Eine Person (${m} kg) steigt in ${t} s eine Treppe mit ${h} m Höhenunterschied hinauf. Wie groß ist ihre Leistung in W?`,a:P,tol:rt(P),h:'P = m·g·h / t'}}]}}},
p92:{n:'Ph9 1.2 Elektrische Energie',g:9,d:'Ladung, Spannung, Leistung, Wirkungsgrad',t:{
ladung:{n:'Ladung und Stromstärke',
h:`<h3>Elektrische Ladung</h3><p>Die elektrische <b>Ladung</b> Q wird in Coulomb (C) gemessen. Jede Ladung ist ein ganzzahliges Vielfaches der <b>Elementarladung</b> e = 1,602·10⁻¹⁹ C: Q = n·e. Das Elektron trägt −e, das Proton +e.</p><h3>Stromstärke</h3><p>Die <b>Stromstärke</b> I gibt an, wie viel Ladung pro Zeit durch einen Leiterquerschnitt fließt: <b>I = Q/t</b>. Es gilt 1 A = 1 C/s. Die Analogie zum Wasserstrom hilft: Stromstärke entspricht der Wassermenge pro Sekunde durch ein Rohr.</p><p>Gemessen wird die Stromstärke mit einem Amperemeter, das <b>in Reihe</b> zum Bauteil geschaltet wird.</p>${M('Q = I·t. Aus 2 A in 10 s ergeben sich 20 C. Das sind etwa 1,2·10²⁰ Elementarladungen.')}`,
q:[Q('Welche Einheit hat die Ladung?','Coulomb (C)',['Ampere (A)','Volt (V)','Ohm (Ω)'],'1 C = 1 A·s.'),Q('In 10 s fließen 20 C durch einen Leiter. Wie groß ist die Stromstärke?','2 A',['200 A','0,5 A','30 A'],'I = Q/t = 20 C / 10 s.'),Q('Was gilt für jede Ladung?','Sie ist ein ganzzahliges Vielfaches der Elementarladung',['Sie kann beliebig klein sein','Sie ist immer negativ','Sie ist gleich der Stromstärke'],'Ladung ist gequantelt.'),Q('Wie wird die Stromstärke gemessen?','Mit einem Amperemeter in Reihe',['Mit einem Voltmeter parallel','Mit einem Amperemeter parallel','Mit einem Ohmmeter in Reihe'],'Der Strom muss durch das Messgerät fließen.')],
m:[()=>{const I=rnd(1,8),t=rnd(2,20);return{t:`Durch einen Draht fließt ${t} s lang ein Strom der Stärke ${I} A. Wie viel Ladung in C wird transportiert?`,a:I*t,h:'Q = I·t'}},()=>{const I=rnd(1,8),t=rnd(2,20);return{t:`In ${t} s fließt durch einen Leiter die Ladung ${I*t} C. Wie groß ist die Stromstärke in A?`,a:I,h:'I = Q/t'}},()=>{const n=rnd(2,20);return{t:`Welche Ladung in C tragen ${n}·10¹⁸ Elektronen zusammen? (Betrag, e = 1,602·10⁻¹⁹ C, 3 Nachkommastellen)`,a:n*.1602,tol:.005,h:'Q = n·e'}}]},
spannung:{n:'Spannung, Widerstand und Schaltungen',
h:`<h3>Spannung als Potentialdifferenz</h3><p>Man stellt sich eine Ladung in einem Stromkreis wie einen Körper im Schwerefeld vor: Die Quelle „hebt“ die Ladung auf ein höheres Potential, am Bauteil „fällt“ sie wieder herunter und gibt Energie ab. Die <b>Spannung</b> ist die Potentialdifferenz, also die Energie pro Ladung: <b>U = E/Q</b> (1 V = 1 J/C). Am Bauteil wird die Energie E = U·Q umgesetzt.</p><h3>Widerstand</h3><p><b>R = U/I</b> (1 Ω = 1 V/A).</p><h3>Schaltungen mit bis zu drei Widerständen</h3>${tb(['','Reihenschaltung','Parallelschaltung'],[['Stromstärke','überall gleich','I = I₁ + I₂ + I₃'],['Spannung','U = U₁ + U₂ + U₃','überall gleich'],['Widerstand','R = R₁ + R₂ + R₃','1/R = 1/R₁ + 1/R₂ + 1/R₃']])}<p>Bei Parallelschaltung ist der Gesamtwiderstand kleiner als jeder Einzelwiderstand. Spannungsmesser werden parallel, Strommesser in Reihe geschaltet.</p>${M('Zuerst die Schaltung zeichnen, dann prüfen: Was ist gleich (I oder U), was addiert sich?')}`,
q:[Q('Wie ist die Spannung definiert?','Energie pro Ladung',['Ladung pro Zeit','Kraft pro Fläche','Widerstand mal Zeit'],'U = E/Q.'),Q('Zwei Widerstände (20 Ω und 30 Ω) liegen in Reihe. Wie groß ist der Gesamtwiderstand?','50 Ω',['12 Ω','10 Ω','600 Ω'],'Bei Reihenschaltung addieren sich die Widerstände.'),Q('Was gilt bei der Parallelschaltung?','Die Spannung ist an allen Zweigen gleich',['Die Stromstärke ist überall gleich','Die Widerstände addieren sich','Der Gesamtwiderstand ist größer als jeder Einzelwiderstand'],'Alle Zweige hängen an denselben zwei Punkten.'),Q('Wie wird ein Voltmeter angeschlossen?','Parallel zum Bauteil',['In Reihe zum Bauteil','Ohne Verbindung','Hinter der Quelle'],'Es misst die Potentialdifferenz zwischen zwei Punkten.')],
m:[()=>{const R=pick([10,20,50,100]),I=pick([.1,.2,.5,1,2]);return{t:`An einem Bauteil liegen ${dz(R*I)} V an, es fließen ${dz(I)} A. Wie groß ist der Widerstand in Ω?`,a:R,h:'R = U/I'}},()=>{const a=rnd(1,9)*10,b=rnd(1,9)*10,c=rnd(1,9)*10;return{t:`Drei Widerstände (${a} Ω, ${b} Ω, ${c} Ω) liegen in Reihe. Wie groß ist der Gesamtwiderstand in Ω?`,a:a+b+c}},()=>{const [a,b]=pick([[20,20],[30,60],[10,40],[60,60],[20,30],[12,6]]);return{t:`Zwei Widerstände (${a} Ω und ${b} Ω) liegen parallel. Wie groß ist der Gesamtwiderstand in Ω?`,a:1/(1/a+1/b),tol:.01,h:'1/R = 1/R₁ + 1/R₂'}}]},
epower:{n:'Elektrische Energie und Leistung',
h:`<h3>Leistung und Energie</h3><p>Pro Sekunde setzt ein Bauteil die Energie E/t = U·I um. Daher gilt für die elektrische Leistung <b>P = U·I</b>. Mit R = U/I folgt P = U²/R = I²·R. Die umgesetzte Energie ist <b>E = P·t = U·I·t</b>.</p><p>Beispiel: Eine Lampe an 230 V mit 0,26 A hat P ≈ 60 W. In 10 h werden 0,6 kWh umgesetzt.</p><h3>Kilowattstunde</h3><p>1 kWh = 1000 W · 3600 s = <b>3,6 MJ</b>. Der Stromzähler misst in kWh.</p><h3>Leistungsbilanz einer Schaltung</h3><p>Die gesamte von der Quelle abgegebene Leistung ist die Summe der Leistungen aller Bauteile: P<sub>ges</sub> = P₁ + P₂ + P₃. Dazu misst man Spannung und Stromstärke an jedem Widerstand und prüft, ob die Summe passt.</p>${M('P = U·I. Eine Spannungsquelle liefert nur dann viel Leistung, wenn auch viel Strom fließt.')}`,
q:[Q('Welche Formel gilt für die elektrische Leistung?','P = U·I',['P = U/I','P = I/U','P = U + I'],'Energie pro Zeit: U·I.'),Q('Wie viele Joule sind 1 kWh?','3,6 Millionen J',['3600 J','1000 J','36 000 J'],'1000 W · 3600 s.'),Q('Ein Gerät (100 W) läuft 5 h. Welche Energie wird umgesetzt?','0,5 kWh',['500 kWh','5 kWh','0,05 kWh'],'E = P·t = 0,1 kW · 5 h.'),Q('Bei gleicher Spannung verdoppelt sich die Stromstärke. Was passiert mit der Leistung?','Sie verdoppelt sich',['Sie halbiert sich','Sie vervierfacht sich','Sie bleibt gleich'],'P = U·I ist proportional zu I.')],
m:[()=>{const U=pick([4.5,6,9,12,230]),I=pick([.5,1,2,4,5]);return{t:`Ein Gerät liegt an ${dz(U)} V, die Stromstärke beträgt ${dz(I)} A. Wie groß ist die Leistung in W?`,a:U*I,tol:rt(U*I),h:'P = U·I'}},()=>{const P=rnd(1,20)*100,t=rnd(1,10);return{t:`Ein Gerät mit ${P} W läuft ${t} h. Wie viel Energie in kWh wird umgesetzt?`,a:P*t/1000,tol:.005,h:'E = P·t'}},()=>{const P=rnd(1,20)*100,t=rnd(1,10),c=P*t/1000*.35;return{t:`Ein Gerät (${P} W) läuft ${t} h. Eine kWh kostet 0,35 €. Wie viel kostet das in € (auf 2 Nachkommastellen)?`,a:c,tol:.01,h:'Erst die Energie in kWh, dann mal 0,35 €.'}}]},
wirkung:{n:'Wirkungsgrad',
h:`<h3>Nutzen und Verluste</h3><p>Bei jeder Energieumwandlung wird nur ein Teil der zugeführten Energie genutzt. Der <b>Wirkungsgrad</b> η (eta) ist das Verhältnis:</p><p style="font-size:1.1rem">η = ${fr('E<sub>nutz</sub>','E<sub>zu</sub>')} = ${fr('P<sub>nutz</sub>','P<sub>zu</sub>')}</p><p>Er ist immer kleiner als 1 (bzw. 100 %). Der Rest wird als „Abwärme“ an die Umgebung abgegeben und ist entwertet. Energie geht nicht verloren, sie wird nur nicht mehr nutzbar.</p>${tb(['Gerät','Wirkungsgrad (Größenordnung)'],[['Glühlampe','etwa 5 % als Licht'],['LED-Lampe','deutlich höher, etwa 20 bis 30 %'],['Elektromotor','80 bis 95 %'],['Verbrennungsmotor (Auto)','etwa 25 bis 35 %']])}<h3>Bewertung</h3><p>Zur Bewertung eines Geräts gehören Wirkungsgrad, Energieverbrauch, Herstellung, Lebensdauer und Entsorgung. Je nach Auswahl und Gewichtung dieser Aspekte kann die Bewertung unterschiedlich ausfallen. Argumentiere deshalb adressatengerecht und nenne deine Kriterien.</p>${M('η = Nutzen / Aufwand. Immer gleiche Größen (beide Energien oder beide Leistungen) ins Verhältnis setzen.')}`,
q:[Q('Welche Aussage über den Wirkungsgrad stimmt?','Er ist immer kleiner als 100 %',['Er kann größer als 100 % sein','Er ist gleich der Leistung','Er hat die Einheit W'],'Nutzenergie ist nie größer als zugeführte Energie.'),Q('Ein Gerät nimmt 200 W auf und gibt 150 W nutzbar ab. Wie groß ist η?','75 %',['133 %','25 %','50 W'],'150 W / 200 W.'),Q('Was passiert mit dem nicht genutzten Teil der Energie?','Er wird als Abwärme an die Umgebung abgegeben',['Er verschwindet','Er wird zu mehr Nutzenergie','Er wird vernichtet'],'Energie bleibt erhalten, ist aber entwertet.'),Q('Warum können zwei Menschen dasselbe Gerät unterschiedlich bewerten?','Sie wählen und gewichten die Kriterien unterschiedlich',['Physik gibt kein Ergebnis','Weil η nicht messbar ist','Weil Bewertungen immer falsch sind'],'Bewertungen hängen von Kriterien und Gewichtung ab.')],
m:[()=>{const z=rnd(4,20)*50,n=z*pick([.3,.5,.6,.75,.8,.9]);return{t:`Ein Gerät nimmt ${z} W auf und gibt ${n} W als Nutzleistung ab. Wie groß ist der Wirkungsgrad in %?`,a:n/z*100,tol:.5}},()=>{const n=rnd(2,20)*50,e=pick([.25,.4,.5,.8]);return{t:`Ein Gerät mit dem Wirkungsgrad ${e*100} % soll ${n} W Nutzleistung abgeben. Wie viel Leistung in W muss es aufnehmen?`,a:n/e,tol:rt(n/e),h:'P<sub>zu</sub> = P<sub>nutz</sub> / η'}},()=>{const z=rnd(4,20)*100,e=pick([.1,.2,.5,.8]);return{t:`Ein Gerät nimmt ${z} J elektrische Energie auf und nutzt ${e*100} % davon. Wie viel Energie in J wird als Abwärme abgegeben?`,a:z*(1-e),tol:rt(z*(1-e))}}]}}},
p93:{n:'Ph9 2 Atome',g:9,d:'Photonenmodell, Energiestufen, Spektren',t:{
photon:{n:'Photonenmodell des Lichts',
h:`<h3>Licht aus Photonen</h3><p>Im <b>Photonenmodell</b> besteht Licht aus Energieportionen, den <b>Photonen</b>. Die Helligkeit hängt von der Anzahl der Photonen ab, die <b>Farbe</b> von der Energie des einzelnen Photons: Rotes Licht hat energieärmere, violettes energiereichere Photonen. Üblich ist die Einheit <b>Elektronenvolt</b>: 1 eV = 1,602·10⁻¹⁹ J. Sichtbares Licht hat Photonenenergien von etwa 1,6 eV (rot) bis 3,1 eV (violett).</p>${tb(['Strahlung','Photonenenergie','Wirkung'],[['Infrarot (IR)','kleiner als sichtbares Licht','Erwärmung (Wärmestrahlung)'],['sichtbares Licht','ca. 1,6 bis 3,1 eV','Sehen, Photosynthese'],['Ultraviolett (UV)','größer als sichtbares Licht','kann Zellen schädigen (Sonnenbrand, Hautkrebs)']])}<h3>Fluoreszenz</h3><p>Ein energiereiches UV-Photon regt einen Leuchtstoff an. Dieser gibt die Energie in mehreren Schritten ab und sendet energieärmere Photonen im sichtbaren Bereich aus (z. B. Leuchtstoffröhre, Markierstift).</p>${M('Je höher die Photonenenergie, desto größer das Risiko für Zellschäden: UV ist riskanter als sichtbares Licht, nicht wegen der Helligkeit, sondern wegen der Energie pro Photon.')}`,
q:[Q('Wovon hängt die Farbe des Lichts im Photonenmodell ab?','Von der Energie des einzelnen Photons',['Von der Anzahl der Photonen','Von der Masse der Photonen','Von der Temperatur der Lampe'],'Rot energieärmer, violett energiereicher.'),Q('Welche Strahlung hat die energiereichsten Photonen?','Ultraviolett',['Infrarot','Rot','Grün'],'UV liegt über dem sichtbaren Bereich.'),Q('Warum ist UV-Strahlung riskanter als sichtbares Licht?','Ihre Photonen haben mehr Energie und können Zellen schädigen',['Sie ist heller','Sie ist wärmer','Sie ist unsichtbar'],'Die Energie pro Photon entscheidet.'),Q('Wie viel Joule sind 1 eV?','1,602·10⁻¹⁹ J',['1,602·10¹⁹ J','1 J','9,81 J'],'Das ist die Energie, die ein Elektron bei 1 V gewinnt.')],
m:[()=>{const e=pick([1.6,1.9,2.5,3,4,5]);return{t:`Rechne ${dz(e)} eV in die Einheit 10⁻¹⁹ J um (1 Nachkommastelle, 1 eV = 1,602·10⁻¹⁹ J).`,a:e*1.602,tol:.06}},()=>{const n=rnd(2,9),e=pick([1.8,2,2.5,3]);return{t:`Ein Laser sendet pro Sekunde ${n}·10¹⁸ Photonen mit je ${dz(e)} eV aus. Wie groß ist die Strahlungsleistung in W (2 Nachkommastellen)?`,a:n*e*.1602,tol:rt(n*e*.1602),h:'E = N·E<sub>Photon</sub>, 1 eV = 1,602·10⁻¹⁹ J'}},()=>{const e=pick([2,2.5,3,4,5]),n=rnd(2,9);return{t:`Wie viele Photonen mit je ${dz(e)} eV braucht man, um insgesamt ${dz(n*e)} eV zu übertragen?`,a:n}}]},
stufen:{n:'Energiestufenmodell und Spektren',
