 mit einer Maßlösung ermittelt. Auch mehrprotonige Säuren sind möglich; das stöchiometrische Verhältnis der Reaktionsgleichung ist entscheidend. Auswirkungen von pH-Änderungen auf Menschen und Ökosysteme werden bewertet.</p><div class=merke>Säure = Protonendonator; Base = Protonenakzeptor; Ampholyt = beides. Neutralisation: H₃O⁺ + OH⁻ → 2 H₂O.</div>","q":[["Was ist nach Brønsted eine Säure?",["Ein Protonendonator","Ein Protonenakzeptor","Ein Elektronendonator","Ein Stoff, der immer OH⁻ enthält"],0,"Eine Säure gibt ein Proton an einen Reaktionspartner ab."],["Welche Rolle kann Wasser in Säure-Base-Reaktionen übernehmen?",["Säure und Base","Nur Säure","Nur Base","Weder noch"],0,"Wasser kann je nach Reaktionspartner Protonen aufnehmen oder abgeben."],["Warum sind Carbonsäuren saurer als vergleichbare Alkohole?",["Das Carboxylat-Ion wird durch Mesomerie stabilisiert","Alkohole enthalten keine Elektronen","Carbonsäuren besitzen keine Bindungen","Alle Carbonsäuren sind starke Mineralsäuren"],0,"Die negative Ladung des Carboxylat-Ions ist über zwei Sauerstoffatome delokalisiert."],["Was bedeutet eine pH-Änderung um eine Einheit?",["Die Oxonium-Ionen-Konzentration ändert sich um Faktor 10","Sie ändert sich um 1 Prozent","Die Temperatur ändert sich um 10 °C","Die Lösung wird immer neutral"],0,"Die pH-Skala ist logarithmisch."],["Welche Gleichung beschreibt die Neutralisation?",["H₃O⁺ + OH⁻ → 2 H₂O","Na⁺ + Cl⁻ → NaCl","H₂O → H₂ + O₂","H⁺ → H + e⁻"],0,"Oxonium- und Hydroxid-Ionen bilden Wasser."]]}}},"c10_3":{"n":"Elektronenübergänge – Redoxreaktionen","g":10,"d":"Oxidationszahlen, Redoxgleichungen, Alkoholoxidation, Nachweise und Brennstoffzellen","t":{"grundlagen":{"n":"Redoxreaktionen in Chemie, Alltag und Technik","h":"<h3>Oxidationszahlen</h3><p>Oxidationszahlen sind formale Hilfsgrößen, um Elektronenverschiebungen zu erkennen. Elemente im elementaren Zustand haben OZ 0, einatomige Ionen ihre Ionenladung. Sauerstoff hat meist −II, Wasserstoff meist +I. Die Summe der Oxidationszahlen entspricht der Gesamtladung. Steigt die Oxidationszahl, liegt Oxidation vor; sinkt sie, Reduktion.</p><h3>Redoxgleichungen</h3><p>Redoxteilgleichungen werden in wässriger Lösung so aufgestellt, dass Atome und Ladungen ausgeglichen sind. Die Elektronenzahl muss bei Oxidation und Reduktion übereinstimmen. Redoxreaktionen sind von Säure-Base-Reaktionen zu unterscheiden: Bei Redox ändern sich Oxidationszahlen, bei Säure-Base-Reaktionen werden Protonen übertragen. Unedle Metalle reagieren mit sauren Lösungen unter Wasserstoffbildung.</p><h3>Oxidation von Alkoholen</h3><p>Primäre Alkohole können zu Aldehyden und weiter zu Carbonsäuren oxidiert werden. Sekundäre Alkohole bilden Ketone. Tertiäre Alkohole sind unter üblichen Bedingungen nicht einfach oxidierbar. Aldehyde lassen sich mit Fehling-, Silberspiegel- oder Schiffscher Probe nachweisen; Ketone reagieren bei diesen Nachweisen meist negativ.</p><h3>Ethanol und Methanol</h3><p>Ethanol wird als Industriechemikalie und Lösungsmittel verwendet und kann durch Gärung hergestellt werden. Alkoholkonsum beeinträchtigt Wahrnehmung und Reaktionsfähigkeit, kann Organe schädigen und abhängig machen. Methanol ist stark giftig und kann Erblindung und lebensgefährliche Vergiftungen verursachen.</p><h3>Technische Redoxreaktionen</h3><p>Brennstoffzellen wandeln die Energie freiwilliger Redoxreaktionen in elektrische Energie um. In der Wasserstoff-Sauerstoff-Brennstoffzelle entsteht Wasser. Solarwasserstoff kann durch Elektrolyse hergestellt und später genutzt werden. Wirkungsgrad, Speicherung, Transport, Rohstoffe und Umweltfolgen müssen bei der Bewertung berücksichtigt werden.</p><div class=merke>OZ steigt = Oxidation; OZ sinkt = Reduktion. Primärer Alkohol → Aldehyd → Carbonsäure; sekundärer Alkohol → Keton.</div>","q":[["Welche Oxidationszahl hat Sauerstoff meistens?",["−II","+I","0","+II"],0,"Sauerstoff besitzt in den meisten Verbindungen die Oxidationszahl −II."],["Was zeigt eine steigende Oxidationszahl?",["Oxidation","Reduktion","Neutralisation","Hydratation"],0,"Eine steigende Oxidationszahl zeigt eine formale Elektronenabgabe an."],["Was entsteht bei der Oxidation eines sekundären Alkohols?",["Ein Keton","Ein Aldehyd","Ein Alkan","Ein Salz"],0,"Sekundäre Alkohole werden zu Ketonen oxidiert."],["Welche Beobachtung zeigt eine positive Fehling-Probe?",["Ziegelroter Niederschlag","Silberner Spiegel","Grünes Gas","Keine Veränderung"],0,"Aldehyde reduzieren Kupfer(II)-Ionen; es entsteht ziegelrotes Kupfer(I)-oxid."],["Was entsteht in einer Wasserstoff-Sauerstoff-Brennstoffzelle?",["Wasser","Kohlenstoffdioxid","Chlor","Natriumchlorid"],0,"Wasserstoff reagiert mit Sauerstoff zu Wasser."]]}}},"c10_4":{"n":"Nukleophil-Elektrophil-Reaktionen","g":10,"d":"Esterbildung, Hydrolyse, Fette, Seifen, Tenside, Waschmittel und Zucker","t":{"grundlagen":{"n":"Ester, Fette, Tenside und Kohlenhydrate","h":"<h3>Nukleophile und elektrophile Teilchen</h3><p>Ein <b>Nukleophil</b> ist elektronenreich und stellt ein Elektronenpaar zur Bindung bereit. Ein <b>Elektrophil</b> ist elektronenarm und kann ein Elektronenpaar aufnehmen. Diese Donator-Akzeptor-Vorstellung hilft, Reaktionsmechanismen zu verstehen.</p><h3>Esterbildung und Hydrolyse</h3><p>Carbonsäuren reagieren mit Alkoholen zu Estern und Wasser. Die säurekatalysierte Esterkondensation ist umkehrbar: <code>Carbonsäure + Alkohol ⇌ Ester + Wasser</code>. Bei der Hydrolyse wird ein Ester mit Wasser gespalten; unter basischen Bedingungen entstehen Carboxylat-Ionen und Alkohole. Ester unterscheiden sich in Löslichkeit, Siedetemperatur und Stabilität und werden in Aromastoffen, Lebensmitteln, Medikamenten, Kosmetik und Technik verwendet.</p><h3>Fette und Öle</h3><p>Fette sind Triester aus Glycerin (Propan-1,2,3-triol) und drei Fettsäuren. Gesättigte Fettsäurereste besitzen keine C=C-Doppelbindungen, ungesättigte mindestens eine. Z-konfigurierte Doppelbindungen erzeugen Knicke, beeinflussen die Packung und damit den Schmelzbereich. Fette und Öle sind nachwachsende Rohstoffe, konkurrieren aber je nach Nutzung mit der Nahrungsmittelproduktion und Flächennutzung.</p><h3>Seifen und moderne Tenside</h3><p>Tenside sind amphiphil: Sie besitzen einen hydrophilen Kopf und einen hydrophoben bzw. lipophilen Teil. Sie senken die Oberflächenspannung und helfen, Fett in Wasser zu verteilen. Seifen sind Salze langkettiger Fettsäuren. In saurem Wasser und hartem Wasser können sie Nachteile zeigen, etwa durch Bildung schwerlöslicher Kalkseifen. Waschmittel enthalten neben Tensiden weitere Bestandteile wie Enzyme, Wasserenthärter und Bleichmittel. Umweltverträglichkeit, Abbaubarkeit und Gewässerbelastung sind wichtige Bewertungskriterien.</p><h3>Zucker</h3><p>Glucose und Fructose sind Monosaccharide mit der Summenformel C₆H₁₂O₆. Glucose ist eine Aldose, Fructose eine Ketose. Beide können offenkettig und ringförmig vorliegen. Saccharose ist ein Disaccharid aus Glucose und Fructose; die Verknüpfung ist ein Vollacetal. Keto-Enol-Tautomerie beschreibt ein Gleichgewicht zwischen Carbonyl- und Enolform. Zucker sind wichtige Nährstoffe, ihre Bedeutung ist im Zusammenhang mit einer ausgewogenen Ernährung zu beurteilen.</p><h3>Peptidbindung</h3><p>Eine Peptidbindung entsteht durch Kondensation einer Aminogruppe mit einer Carboxygruppe unter Abspaltung von Wasser. Sie ist ein Beispiel für eine weitere Kondensationsreaktion; ein detaillierter Mechanismus ist nicht erforderlich.</p><div class=merke>Carbonsäure + Alkohol ⇌ Ester + Wasser. Fette = Triester aus Glycerin und Fettsäuren. Tenside sind amphiphil.</div>","q":[["Was ist ein Nukleophil?",["Ein elektronenreiches Teilchen, das ein Elektronenpaar bereitstellt","Ein elektronenarmes Teilchen, das Elektronen aufnimmt","Ein Neutron","Ein Atomkern"],0,"Nukleophile sind Elektronenpaar-Donatoren."],["Welche Stoffe reagieren bei einer Veresterung?",["Carbonsäure und Alkohol","Alkan und Wasser","Metall und Sauerstoff","Base und Salz"],0,"Eine Carbonsäure reagiert mit einem Alkohol zu Ester und Wasser."],["Woraus bestehen Fettmoleküle?",["Glycerin und drei Fettsäureresten","Glucose und Fructose","Drei Aminosäuren","Ethanol und Wasser"],0,"Fette sind Triester aus Glycerin und drei Fettsäuren."],["Was bedeutet amphiphil bei einem Tensid?",["Es besitzt einen hydrophilen und einen hydrophoben Teil","Es löst sich nur in Öl","Es besteht nur aus Wasser","Es ist immer ein Metallsalz"],0,"Der hydrophile Kopf wechselwirkt mit Wasser, der hydrophobe Teil mit Fett."],["Welche Zucker bilden Saccharose?",["Glucose und Fructose","Glucose und Stärke","Fructose und Lactose","Zwei Aminosäuren"],0,"Saccharose ist ein Disaccharid aus Glucose und Fructose."]]}}}}};
