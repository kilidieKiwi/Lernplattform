<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernheft</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root,[data-th=abend]{--bg:#0f1b2e;--pn:#15253d;--pn2:#1b2f4d;--dk:#0b1424;--bd:#2c4468;--tx:#e4ebf7;--mu:#8fa3c4;--ac:#ff8a3d;--pu:#6fb1ff;--ok:#5fd0a0;--er:#ff6b6b;--am:#ffc266;--on:#0b1424;--hd:#ff8a3d}
[data-th=tag]{--bg:#e6edf7;--pn:#fff;--pn2:#f1f5fb;--dk:#e3ebf7;--bd:#c5d3e8;--tx:#14243d;--mu:#5d6f8f;--ac:#e8590c;--pu:#1f5fbf;--ok:#1a7f4b;--er:#c92a3a;--am:#b85a00;--on:#fff;--hd:#1a4fa3}
[data-th=meer]{--bg:#0d3157;--pn:#144a7d;--pn2:#1b5a95;--dk:#0d3157;--bd:#3a76b8;--tx:#f1f6fd;--mu:#b3cdea;--ac:#ffa94d;--pu:#ffd8a8;--ok:#8ce99a;--er:#ff9a9a;--am:#ffd43b;--on:#0d3157;--hd:#ffa94d}
*{box-sizing:border-box}
body{margin:0;font:17px/1.65 system-ui,Segoe UI,sans-serif;color:var(--tx);background:var(--bg)}
h1,h2,h3,.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:700;color:var(--hd)}
h1{font-size:2rem;margin:.4em 0}h2{font-size:1.3rem;color:var(--tx)}h3{font-size:1.1rem;margin:1.2em 0 .3em;color:var(--pu)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--dk);border-bottom:3px solid var(--ac)}
header a{color:var(--tx);text-decoration:none;font:600 1rem 'JetBrains Mono',ui-monospace,monospace}
#xp{border:1px solid var(--am);color:var(--am);padding:1px 12px;border-radius:6px;font:600 .9rem 'JetBrains Mono',ui-monospace,monospace}
main{max-width:920px;margin:24px auto;padding:8px 28px 40px;background:var(--pn);border:1px solid var(--bd);border-radius:10px}
@media(min-width:960px){main{margin:32px auto}}
a{color:var(--ac)}
.bc{font:.85rem 'JetBrains Mono',ui-monospace,monospace;color:var(--mu);margin-bottom:6px}
.pr{color:var(--ok)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--ac);margin-left:6px;vertical-align:text-bottom;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.shelf{display:flex;flex-wrap:wrap;gap:20px;margin-top:22px}
.cover{width:250px;height:170px;border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:10px;background:var(--pn2);display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-decoration:none;transition:transform .15s,border-color .15s}
.cover:hover{transform:translateY(-3px);border-color:var(--ac)}
.cover .lab{font:700 1.3rem 'JetBrains Mono',ui-monospace,monospace;color:var(--tx)}
.cover .sb{font-size:.9rem;color:var(--mu)}
.cover.soon{background:none;border:1px dashed var(--bd);border-top:1px dashed var(--bd)}.cover.soon:hover{transform:none}.cover.soon .lab{color:var(--mu);font-size:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.card{display:block;padding:16px 18px;border:1px solid var(--bd);border-radius:8px;text-decoration:none;color:var(--tx);background:var(--pn2)}
.card:hover{border-color:var(--ac)}.card b{font:700 1.05rem sans-serif;color:var(--hd)}.card small{color:var(--mu)}
.ok{color:var(--ok)}
.tabs,.lv{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button,.lv button{padding:5px 14px;border:1px solid var(--bd);background:transparent;border-radius:6px;font:600 .9rem 'JetBrains Mono',ui-monospace,monospace;cursor:pointer;color:var(--mu)}
.tabs button:hover,.lv button:hover{color:var(--tx);border-color:var(--ac)}
.tabs button.on,.lv button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.page{padding:4px 0}.page p{max-width:70ch}
.merke{background:var(--pn2);border-left:3px solid var(--am);padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0;max-width:62ch}
code,pre,textarea#ed{font:15px 'JetBrains Mono',ui-monospace,Consolas,monospace}
code{background:var(--dk);color:var(--pu);padding:1px 6px;border-radius:4px}
pre{background:var(--dk);border:1px solid var(--bd);padding:12px 16px;border-radius:6px;overflow:auto;color:var(--tx)}
.btn,.btn2,.opt{font:inherit;cursor:pointer;border-radius:6px;padding:8px 18px;margin:4px 6px 4px 0}
.btn{background:var(--ac);color:var(--on);border:1px solid var(--ac);font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn2{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn2:hover{border-color:var(--ac)}.btn2.on{background:var(--am);color:var(--on);border-color:var(--am)}
.opt{display:block;width:100%;max-width:560px;text-align:left;background:var(--pn2);border:1px solid var(--bd);color:var(--tx)}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt:disabled{color:var(--tx);cursor:default}
.opt.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);border-color:var(--ok)}.opt.bad{background:color-mix(in srgb,var(--er) 18%,transparent);border-color:var(--er)}
.hud{color:var(--er);font-size:1.2rem}.hud span{color:var(--mu);font:.9rem 'JetBrains Mono',ui-monospace,monospace;margin-left:14px}
.erkl{background:var(--dk);border:1px solid var(--bd);padding:8px 12px;border-radius:6px;max-width:560px}
.task{font-weight:600}
details{color:var(--mu);margin-bottom:8px}summary{cursor:pointer}
textarea#ed{width:100%;height:130px;padding:12px;border:1px solid var(--bd);border-radius:6px;background:var(--dk);color:var(--tx);caret-color:var(--am)}
textarea#ed:focus{border-color:var(--ac);outline:0}
#out{margin-top:10px}.good{color:var(--ok);font-weight:600}.warn{color:var(--er);font-weight:600}
table{border-collapse:collapse;margin:8px 0;font:14px 'JetBrains Mono',ui-monospace,monospace}td,th{border:1px solid var(--bd);padding:3px 12px;background:var(--dk)}th{background:var(--pn2);color:var(--hd)}
#cv{position:relative;height:360px;border:1px dashed var(--bd);border-radius:6px;background:var(--dk) radial-gradient(var(--bd) 1px,transparent 1px) 0 0/20px 20px;overflow:auto;margin:8px 0}
#sv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sv line{stroke:var(--ac);stroke-width:2}#sv text{font:700 18px 'JetBrains Mono',monospace;fill:var(--am)}
.box{position:absolute;width:190px;border:1px solid var(--ac);border-radius:6px;overflow:hidden;background:var(--pn2);z-index:2}
.box.sel{outline:2px solid var(--am)}
.box .hd{display:flex;background:var(--dk);color:var(--ac);cursor:grab;padding:3px;touch-action:none}
.box input{flex:1;min-width:0;border:0;padding:3px 6px;font:700 14px 'JetBrains Mono',monospace;background:transparent;color:var(--tx)}
.box textarea{width:100%;height:76px;border:0;border-top:1px solid var(--bd);padding:6px;resize:none;font:13px 'JetBrains Mono',monospace;background:var(--pn2);color:var(--tx)}
.box .x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:1.1rem}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--am);outline-offset:2px}
@media(max-width:600px){main{padding:8px 16px 32px;margin:12px}h1{font-size:1.5rem}.cover{width:100%}}

h1,h2,h3,.mono,header a,#xp,.bc,.cover .lab,.card b,.tabs button,.lv button,.hud span{font-family:'Space Grotesk',system-ui,sans-serif}
.lg{display:inline-block;width:20px;height:20px;border-radius:6px;margin-right:10px;vertical-align:-4px;background:linear-gradient(135deg,var(--ac) 50%,var(--pu) 50%)}
#th{display:flex;align-items:center}
#th button{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);margin-left:6px;cursor:pointer;padding:0}
#th button.on{border-color:var(--tx)}
#th button[data-k=abend]{background:linear-gradient(135deg,#ff8a3d 50%,#15253d 50%)}
#th button[data-k=tag]{background:linear-gradient(135deg,#e8590c 50%,#fff 50%)}
#th button[data-k=meer]{background:linear-gradient(135deg,#ffa94d 50%,#1a5a95 50%)}
</style>
</head>
<body>
<header><a href="#/"><b class=lg></b>Lernheft</a><div style="display:flex;align-items:center"><span id=th></span><span id="xp" style="margin-left:14px">0 XP</span></div></header>
<main id="app"></main>
<script>
const M=t=>`<div class=merke>${t}</div>`;
const tb=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const SEED=`CREATE TABLE Klasse(id INTEGER PRIMARY KEY,name TEXT,raum TEXT);
CREATE TABLE Schueler(id INTEGER PRIMARY KEY,name TEXT,klasse_id INTEGER REFERENCES Klasse(id),geb INTEGER);
CREATE TABLE Fach(id INTEGER PRIMARY KEY,name TEXT);
CREATE TABLE Besucht(schueler_id INTEGER,fach_id INTEGER);
INSERT INTO Klasse VALUES(1,'10a','R101'),(2,'10b','R102'),(3,'10c','R103');
INSERT INTO Schueler VALUES(1,'Anna',1,2010),(2,'Ben',1,2009),(3,'Cem',2,2010),(4,'Dana',2,2011),(5,'Eva',1,2010);
INSERT INTO Fach VALUES(1,'Informatik'),(2,'Mathe'),(3,'Kunst');
INSERT INTO Besucht VALUES(1,1),(1,2),(2,1),(3,2),(3,3),(4,1),(5,3);`;
const SCHEMA=`Klasse(id, name, raum)
   1 10a R101 | 2 10b R102 | 3 10c R103
Schueler(id, name, klasse_id, geb)
   1 Anna 1 2010 | 2 Ben 1 2009 | 3 Cem 2 2010 | 4 Dana 2 2011 | 5 Eva 1 2010
Fach(id, name)
   1 Informatik | 2 Mathe | 3 Kunst
Besucht(schueler_id, fach_id)
   (1,1) (1,2) (2,1) (3,2) (3,3) (4,1) (5,3)`;
const DK=[['Klasse',['name','raum']],['Schueler',['name']]];
const F={informatik:{n:'Informatik',sub:{
sql:{n:'Datenbanksysteme',d:'Datenmodellierung, relationale Datenbanken und SQL',t:{
grund:{n:'Grundbegriffe',
h:`<h3>Datenbank, DBMS und DBS</h3><p>In einer <b>relationalen Datenbank</b> liegen die Daten in <b>Tabellen</b>. Verwaltet wird sie vom <b>Datenbankmanagementsystem (DBMS)</b>. Datenbank und DBMS zusammen heißen <b>Datenbanksystem (DBS)</b>. Das DBMS regelt auch, dass mehrere Nutzer gleichzeitig mit denselben Daten arbeiten können.</p>
<h3>Aufbau einer Tabelle</h3>${tb(['id','name','raum'],[['1','10a','R101'],['2','10b','R102'],['3','10c','R103']])}
<ul><li><b>Tabellenschema:</b> Tabellenname mit seinen Attributen, z. B. <code>Klasse(<u>id</u>, name, raum)</code>. Der Primärschlüssel ist unterstrichen.</li><li><b>Attribut:</b> eine Spalte. Jedes Attribut hat einen <b>Datentyp</b>, z. B. INTEGER (ganze Zahl), VARCHAR bzw. TEXT (Text), DECIMAL (Kommazahl) oder DATE (Datum).</li><li><b>Datensatz:</b> eine Zeile der Tabelle, hier eine einzelne Klasse.</li></ul>
<h3>Primärschlüssel</h3><p>Der <b>Primärschlüssel</b> kennzeichnet jeden Datensatz eindeutig. Er ist nie leer und ändert sich nicht. Ein Name taugt dafür nicht, weil zwei Schüler gleich heißen können. Deshalb ergänzt man meist eine künstliche Nummer (id).</p>
<h3>Abfrage und Ergebnistabelle</h3><p>Eine <b>Abfrage</b> stellt der Datenbank eine Frage. Die Antwort ist eine <b>Ergebnistabelle</b>. Man kann die Abfrage als Funktion sehen: Tabelle(n) gehen hinein, eine Ergebnistabelle kommt heraus. Die Originaltabellen bleiben unverändert.</p>${M('Merke: Schema = Bauplan der Tabelle, Datensatz = Zeile, Attribut = Spalte, Primärschlüssel = eindeutiger Ausweis jedes Datensatzes.')}`,
q:[['Was bilden Datenbank und DBMS zusammen?',['Das Datenbanksystem (DBS)','Das Tabellenschema','Die Ergebnistabelle','Den Primärschlüssel'],0,'DBS = Datenbank + Datenbankmanagementsystem.'],['Was ist ein Datensatz?',['Eine Zeile einer Tabelle','Eine Spalte einer Tabelle','Der Name der Tabelle','Eine Abfrage'],0,'Spalten heißen Attribute, Zeilen Datensätze.'],['Warum eignet sich der Name nicht als Primärschlüssel?',['Er ist nicht unbedingt eindeutig','Er ist zu kurz','Er enthält Buchstaben und Zahlen','Text ist als Schlüssel verboten'],0,'Zwei Personen können gleich heißen, ein Primärschlüssel muss aber eindeutig sein.'],['Was liefert eine Abfrage als Ergebnis?',['Eine Ergebnistabelle','Ein neues Tabellenschema','Einen neuen Primärschlüssel','Ein DBMS'],0,'Die Ergebnistabelle ist selbst wieder eine Tabelle.']],
c:[{t:'Zeige alle Datensätze der Tabelle Fach.',s:'SELECT * FROM ',sol:'SELECT * FROM Fach'},{t:'Zeige nur die Attribute name und raum der Tabelle Klasse.',sol:'SELECT name, raum FROM Klasse'},{t:'Zeige Name und Geburtsjahr aller Schüler, sortiert nach Geburtsjahr und dann nach Name.',sol:'SELECT name, geb FROM Schueler ORDER BY geb, name'}]},
abfr:{n:'Einfache Abfragen',
h:`<h3>Grundgerüst: SELECT, FROM, WHERE</h3><pre>SELECT name, geb
FROM Schueler
WHERE klasse_id = 1;</pre><ul><li><code>SELECT</code> wählt die Spalten aus (<b>Projektion</b>). Mit <code>*</code> kommen alle.</li><li><code>FROM</code> nennt die Tabelle.</li><li><code>WHERE</code> wählt die Zeilen aus (<b>Selektion</b>).</li></ul><p>Das Ergebnis ist eine Ergebnistabelle. Die Reihenfolge der Zeilen bestimmt man mit <code>ORDER BY name</code> (aufsteigend, ASC) oder <code>ORDER BY name DESC</code>. <code>SELECT DISTINCT</code> entfernt doppelte Zeilen.</p>
<h3>Bedingungen</h3><p>Vergleiche: <code>=</code>, <code>&lt;&gt;</code> (ungleich), <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>. Text steht in einfachen Anführungszeichen: <code>name = 'Anna'</code>. Mit <code>LIKE</code> suchst du Muster: <code>%</code> steht für beliebig viele Zeichen, <code>_</code> für genau eines. <code>name LIKE 'D%'</code> findet Dana.</p>
<h3>Bedingungen verknüpfen</h3>${tb(['Operator','Bedeutung'],[['AND','beide Bedingungen müssen gelten'],['OR','mindestens eine muss gelten'],['NOT','kehrt die Bedingung um']])}<p>NOT bindet stärker als AND, AND stärker als OR. Setze im Zweifel <b>Klammern</b>:</p><pre>WHERE (klasse_id = 1 OR klasse_id = 2) AND NOT geb = 2010</pre>${M('Typischer Fehler: WHERE klasse_id = 1 OR 2 ist falsch. Jede Bedingung muss vollständig ausgeschrieben werden: klasse_id = 1 OR klasse_id = 2.')}`,
q:[['Welche Zeile wählt nur die Spalte name aus Schueler?',['SELECT name FROM Schueler','FROM Schueler SELECT name','SELECT Schueler FROM name','SHOW name'],0,'Reihenfolge: SELECT, FROM, WHERE.'],['Was bewirkt WHERE?',['Es wählt Zeilen aus (Selektion)','Es wählt Spalten aus (Projektion)','Es sortiert das Ergebnis','Es löscht Zeilen'],0,'SELECT = Projektion, WHERE = Selektion.'],['Welche Zeilen liefert WHERE klasse_id = 1 OR geb = 2010?',['Alle, bei denen mindestens eine Bedingung gilt','Nur Zeilen, bei denen beide gelten','Nur Zeilen, bei denen keine gilt','Keine'],0,'Bei OR genügt eine Bedingung, bei AND müssen beide gelten.'],['Was findet name LIKE &#39;D%&#39;?',['Namen, die mit D beginnen','Namen, die mit D enden','Namen mit genau einem Zeichen','Namen ohne D'],0,'% steht für beliebig viele Zeichen, also beginnt der Name mit D.']],
c:[{t:'Zeige die Namen aller Schüler, die 2010 geboren sind.',sol:'SELECT name FROM Schueler WHERE geb = 2010'},{t:'Zeige die Namen der Schüler aus Klasse 1 (klasse_id = 1), die nach 2009 geboren sind.',sol:'SELECT name FROM Schueler WHERE klasse_id = 1 AND geb > 2009'},{t:'Zeige die Namen der Schüler aus Klasse 1 oder Klasse 2, die nicht 2010 geboren sind.',sol:'SELECT name FROM Schueler WHERE (klasse_id = 1 OR klasse_id = 2) AND NOT geb = 2010'}]},
kreuz:{n:'Kreuzprodukt',
h:`<h3>Jede Zeile mit jeder Zeile</h3><p>Stehen hinter <code>FROM</code> zwei Tabellen, bildet die Datenbank das <b>Kreuzprodukt</b>: Jeder Datensatz der ersten Tabelle wird mit jedem Datensatz der zweiten kombiniert.</p><pre>SELECT * FROM Klasse, Fach;</pre><p>3 Klassen × 3 Fächer ergeben 9 Zeilen. Die Spalten beider Tabellen werden nebeneinandergestellt (3 + 2 = 5 Spalten).</p>${tb(['Klasse.name','Fach.name'],[['10a','Informatik'],['10a','Mathe'],['10a','Kunst'],['10b','Informatik'],['…','…']])}
<h3>Sinnvoll machen mit WHERE</h3><p>Die meisten Kombinationen sind Unsinn, etwa eine Schülerin mit der falschen Klasse. Mit <code>WHERE</code> behält man nur die zusammengehörenden Zeilen. Damit ist das Kreuzprodukt der erste Schritt zur <b>Abfrage über verknüpfte Tabellen</b> (Verbund oder Join):</p><pre>SELECT Schueler.name, Klasse.name
FROM Schueler, Klasse
WHERE Schueler.klasse_id = Klasse.id;</pre><p>Gleiche Spaltennamen in beiden Tabellen schreibst du mit der Tabelle davor: <code>Tabelle.Spalte</code>.</p>${M('Zeilen im Kreuzprodukt = Zeilen A × Zeilen B. Spalten = Spalten A + Spalten B. Ohne passende WHERE-Bedingung entsteht fast immer Unsinn.')}`,
q:[['Tabelle A hat 4 Zeilen, Tabelle B hat 5. Wie viele Zeilen hat das Kreuzprodukt?',['9','20','5','1'],1,'4 × 5 = 20: jede Zeile von A mit jeder von B.'],['Tabelle A hat 3 Spalten, B hat 2. Wie viele Spalten hat das Kreuzprodukt?',['5','6','2','1'],0,'Die Spalten werden aneinandergereiht: 3 + 2 = 5.'],['Welche Anweisung bildet ein Kreuzprodukt?',['SELECT * FROM A, B;','SELECT * FROM A + B;','SELECT A, B;','JOIN A B;'],0,'Zwei Tabellen hinter FROM, durch Komma getrennt.'],['Warum ergänzt man nach dem Kreuzprodukt meist WHERE?',['Um nur zusammengehörende Zeilen zu behalten','Damit man weniger tippen muss','Weil es sonst einen Syntaxfehler gibt','Um Tabellen zu löschen'],0,'Die Bedingung, z. B. Schueler.klasse_id = Klasse.id, filtert die sinnvollen Kombinationen.']],
c:[{t:'Zeige das Kreuzprodukt von Klasse und Fach (alle Spalten).',s:'SELECT * FROM ',sol:'SELECT * FROM Klasse, Fach'},{t:'Bilde das Kreuzprodukt aus Schueler und Fach. Zeige nur Schülername und Fachname.',sol:'SELECT Schueler.name, Fach.name FROM Schueler, Fach'},{t:'Mache aus dem Kreuzprodukt von Schueler und Klasse eine sinnvolle Abfrage: Schülername mit Klassenname.',sol:'SELECT Schueler.name, Klasse.name FROM Schueler, Klasse WHERE Schueler.klasse_id = Klasse.id'}]},
fremd:{n:'Fremdschlüssel',
h:`<h3>Der Verweis auf eine andere Tabelle</h3><p>Ein <b>Fremdschlüssel</b> ist ein Attribut, das auf den <b>Primärschlüssel einer anderen Tabelle</b> verweist. So werden Tabellen miteinander verknüpft.</p><pre>Klasse(<u>id</u>, name, raum)
Schueler(<u>id</u>, name, geb, klasse_id)</pre><p>In Schueler ist <code>klasse_id</code> der Fremdschlüssel. Sein Wert ist die id einer Klasse.</p>${tb(['Schueler.name','klasse_id','→ Klasse'],[['Anna','1','10a, R101'],['Cem','2','10b, R102']])}
<h3>Regeln</h3><ul><li>Der Wert eines Fremdschlüssels muss in der verwiesenen Tabelle als Primärschlüssel vorkommen (<b>referentielle Integrität</b>). Eine Klasse 7 gibt es nicht, also darf kein Schüler klasse_id = 7 haben.</li><li>Fremdschlüsselwerte dürfen sich wiederholen: In Klasse 1 sitzen mehrere Schüler.</li><li>Der Fremdschlüssel steht in der Tabelle, die auf die andere verweist.</li></ul><h3>Verwendung in Abfragen</h3><p>Fremdschlüssel und Primärschlüssel vergleichst du in der WHERE-Bedingung. So holst du Daten aus beiden Tabellen in eine Ergebnistabelle.</p>${M('Fremdschlüssel = Primärschlüssel einer anderen Tabelle. Das ist die Verbindung, über die man Tabellen verknüpft.')}`,
q:[['Was ist ein Fremdschlüssel?',['Ein Verweis auf den Primärschlüssel einer anderen Tabelle','Die eindeutige ID der eigenen Tabelle','Ein Spaltenname mit Sonderzeichen','Eine Sortierregel'],0,'Er verbindet zwei Tabellen.'],['Schueler(id, name, geb, klasse_id): Welches Attribut ist der Fremdschlüssel?',['id','name','klasse_id','geb'],2,'klasse_id zeigt auf Klasse.id.'],['Ein Schüler hat klasse_id = 7, es gibt aber nur die Klassen 1 bis 3. Was ist das Problem?',['Die referentielle Integrität ist verletzt','Es gibt keins, das ist erlaubt','Der Primärschlüssel ist doppelt','Die Tabelle ist leer'],0,'Der Fremdschlüssel verweist ins Leere.'],['Welche Aussage stimmt?',['Fremdschlüsselwerte dürfen sich in der Tabelle wiederholen','Fremdschlüsselwerte müssen eindeutig sein','Ein Fremdschlüssel ersetzt den Primärschlüssel','Fremdschlüssel gibt es nur bei Zahlen'],0,'Mehrere Schüler können in derselben Klasse sein.']],
c:[{t:'Zeige die Namen aller Schüler mit klasse_id = 1.',sol:'SELECT name FROM Schueler WHERE klasse_id = 1'},{t:'In welchem Raum sitzt Anna? Verknüpfe Schueler und Klasse über den Fremdschlüssel.',sol:"SELECT Klasse.raum FROM Schueler, Klasse WHERE Schueler.klasse_id = Klasse.id AND Schueler.name = 'Anna'"},{t:'Zeige die Namen aller Schüler, die in Raum R102 sitzen.',sol:"SELECT Schueler.name FROM Schueler, Klasse WHERE Schueler.klasse_id = Klasse.id AND Klasse.raum = 'R102'"}],
d:{t:'Zeichne die beiden Tabellen als Klassen (mit Fremdschlüssel klasse_id) und verbinde sie: Eine Klasse hat viele Schüler.',k:[['Klasse',['id','name']],['Schueler',['id','name','klasse_id']]],r:[['Klasse','Schueler','1','n']]}},
eins:{n:'1-n-Beziehungen',
h:`<h3>Im Datenmodell</h3><p>Eine Klasse hat <b>viele</b> Schüler, jeder Schüler gehört zu <b>genau einer</b> Klasse. Im Klassendiagramm schreibt man an jedes Ende der Verbindung die <b>Kardinalität</b>: bei Klasse eine 1, bei Schueler ein n.</p>
<h3>Überführung ins relationale Modell</h3><ol><li>Jede Klasse des Datenmodells wird zu einer Tabelle, jedes Attribut zu einer Spalte.</li><li>Jede Tabelle bekommt einen Primärschlüssel (meist eine id).</li><li>Bei 1-n kommt der <b>Fremdschlüssel auf die n-Seite</b> und verweist auf den Primärschlüssel der 1-Seite.</li></ol><pre>Klasse(<u>id</u>, name, raum)
Schueler(<u>id</u>, name, geb, klasse_id)</pre><h3>Abfragen über beide Tabellen</h3><pre>SELECT Schueler.name
FROM Schueler, Klasse
WHERE Schueler.klasse_id = Klasse.id
  AND Klasse.name = '10a';</pre><p>Die erste Bedingung verknüpft die Tabellen (Fremdschlüssel = Primärschlüssel), die zweite filtert.</p>${M('Vergisst du die Verknüpfungsbedingung, entsteht ein Kreuzprodukt voller falscher Kombinationen.')}`,
q:[['Wo steht der Fremdschlüssel bei einer 1-n-Beziehung?',['In der Tabelle der n-Seite','In der Tabelle der 1-Seite','In beiden Tabellen','In keiner'],0,'Die n-Seite verweist auf die 1-Seite.'],['Welches Beispiel ist eine 1-n-Beziehung?',['Mutter und ihre Kinder','Schüler und Fächer','Person und Personalausweis','Zahl und Quadrat'],0,'Eine Mutter hat viele Kinder, jedes Kind hat eine Mutter.'],['Welche Bedingung verknüpft Schueler und Klasse richtig?',['Schueler.klasse_id = Klasse.id','Schueler.id = Klasse.id','Schueler.name = Klasse.name','Schueler.id = Klasse.raum'],0,'Fremdschlüssel gleich Primärschlüssel.'],['Was passiert, wenn bei einem Join die Verknüpfungsbedingung fehlt?',['Es entsteht ein Kreuzprodukt mit sinnlosen Zeilen','Die Ergebnistabelle ist leer','Die Daten werden verändert','Nichts, das Ergebnis bleibt gleich'],0,'Jede Zeile wird mit jeder kombiniert.']],
c:[{t:'Zeige die Namen aller Schüler der Klasse mit klasse_id 2.',sol:'SELECT name FROM Schueler WHERE klasse_id = 2'},{t:'Zeige die Namen aller Schüler der Klasse 10a (über den Klassennamen).',sol:"SELECT Schueler.name FROM Schueler, Klasse WHERE Schueler.klasse_id = Klasse.id AND Klasse.name = '10a'"},{t:'Zeige Schülername und Raum aller Schüler, die 2010 geboren sind und nicht in Klasse 10b sind.',sol:"SELECT Schueler.name, Klasse.raum FROM Schueler, Klasse WHERE Schueler.klasse_id = Klasse.id AND Schueler.geb = 2010 AND NOT Klasse.name = '10b'"}],
d:{t:'Eine Klasse hat viele Schüler, jeder Schüler gehört zu genau einer Klasse. Zeichne das Klassendiagramm.',k:DK,r:[['Klasse','Schueler','1','n']]}},
nm:{n:'n-m-Beziehungen',
h:`<h3>Im Datenmodell</h3><p>Ein Schüler besucht <b>mehrere</b> Fächer, ein Fach wird von <b>mehreren</b> Schülern besucht. Im Klassendiagramm steht an beiden Enden ein n bzw. m.</p><h3>Auflösung mit Zwischentabelle</h3><p>Ein einzelner Fremdschlüssel reicht hier nicht, weil auf beiden Seiten mehrere Datensätze zusammengehören. Man führt eine <b>Zwischentabelle</b> ein, die zwei Fremdschlüssel enthält:</p><pre>Schueler(<u>id</u>, name, geb, klasse_id)
Fach(<u>id</u>, name)
Besucht(<u>schueler_id</u>, <u>fach_id</u>)</pre>${tb(['schueler_id','fach_id'],[['1','1'],['1','2'],['2','1']])}<p>Der Primärschlüssel von Besucht besteht aus <b>beiden Fremdschlüsseln zusammen</b>. Damit kann jede Kombination nur einmal vorkommen.</p><p>Hat die Beziehung eine eigene Eigenschaft, etwa die Note eines Schülers in einem Fach, steht sie als Attribut in der Zwischentabelle.</p><h3>Abfrage über drei Tabellen</h3><pre>SELECT Fach.name
FROM Schueler, Besucht, Fach
WHERE Schueler.id = Besucht.schueler_id
  AND Besucht.fach_id = Fach.id
  AND Schueler.name = 'Anna';</pre>${M('Für n:m brauchst du drei Tabellen und zwei Verknüpfungsbedingungen.')}`,
q:[['Wie setzt man eine n-m-Beziehung im relationalen Modell um?',['Mit einer Zwischentabelle','Mit einem zweiten Primärschlüssel','Mit einer Spalte voller Listen','Gar nicht'],0,'Die Zwischentabelle zerlegt n-m in zwei 1-n-Beziehungen.'],['Wie viele Tabellen braucht Schüler–Fach (n-m) mindestens?',['2','3','4','1'],1,'Schueler, Fach und die Zwischentabelle.'],['Woraus besteht der Primärschlüssel von Besucht?',['Aus beiden Fremdschlüsseln zusammen','Aus einer zusätzlichen id','Aus dem Namen','Es gibt keinen'],0,'schueler_id und fach_id zusammen sind eindeutig.'],['Wo speichert man die Note, die ein Schüler in einem Fach hat?',['In der Zwischentabelle','In Schueler','In Fach','In Klasse'],0,'Die Note gehört zur Kombination aus Schüler und Fach.']],
c:[{t:'Zeige die komplette Zwischentabelle Besucht.',sol:'SELECT * FROM Besucht'},{t:'Welche Fächer besucht Anna? Zeige die Fachnamen (Schueler, Besucht, Fach verknüpfen).',sol:"SELECT Fach.name FROM Schueler, Besucht, Fach WHERE Schueler.id = Besucht.schueler_id AND Besucht.fach_id = Fach.id AND Schueler.name = 'Anna'"},{t:'Welche Schüler besuchen Informatik und sind 2010 geboren? Zeige die Schülernamen.',sol:"SELECT Schueler.name FROM Schueler, Besucht, Fach WHERE Schueler.id = Besucht.schueler_id AND Besucht.fach_id = Fach.id AND Fach.name = 'Informatik' AND Schueler.geb = 2010"}],
d:{t:'Schüler besuchen mehrere Fächer, ein Fach wird von mehreren Schülern besucht. Zeichne das Klassendiagramm.',k:[['Schueler',['name']],['Fach',['name']]],r:[['Schueler','Fach','n','m']]}},
anomal:{n:'Redundanz und Anomalien',
h:`<h3>Eine Tabelle für alles?</h3><p>Angenommen, alle Daten stehen in einer einzigen Tabelle:</p>${tb(['SName','Klasse','Raum'],[['Anna','10a','R101'],['Ben','10a','R101'],['Eva','10a','R101'],['Cem','10b','R102']])}<p>Der Raum von 10a steht dreimal da. Das nennt man <b>Redundanz</b>: dieselbe Information ist mehrfach gespeichert.</p><h3>Konsistenz</h3><p>Ein Datenbestand ist <b>konsistent</b>, wenn er widerspruchsfrei ist. Redundanz gefährdet das, weil man beim Ändern eine Stelle vergessen kann.</p><h3>Anomalien</h3><ul><li><b>Änderungsanomalie:</b> Der Raum von 10a wird nur in einer Zeile geändert. Jetzt gibt es zwei Räume für dieselbe Klasse (Inkonsistenz).</li><li><b>Einfügeanomalie:</b> Eine neue Klasse ohne Schüler lässt sich nicht eintragen, weil jede Zeile einen Schüler braucht.</li><li><b>Löschanomalie:</b> Löscht man den einzigen Schüler von 10b, verschwindet auch die Information über Klasse und Raum.</li></ul><h3>Lösung</h3><p>Die Daten werden auf mehrere Tabellen verteilt, die über Fremdschlüssel verbunden sind: <code>Klasse(<u>id</u>, name, raum)</code> und <code>Schueler(<u>id</u>, name, klasse_id)</code>. Jetzt steht jeder Raum genau einmal in der Datenbank.</p>${M('Gutes Datenmodell: jede Information genau einmal, Verbindungen über Fremdschlüssel.')}`,
q:[['Was bedeutet Redundanz?',['Dieselbe Information ist mehrfach gespeichert','Eine Information fehlt','Ein Datensatz wurde gelöscht','Der Primärschlüssel ist leer'],0,'Redundanz = mehrfache Speicherung derselben Information.'],['Der Raum von 10a steht in 12 Zeilen, geändert wird er nur in 11. Was entsteht?',['Inkonsistenz durch eine Änderungsanomalie','Eine Löschanomalie','Ein Syntaxfehler','Ein Kreuzprodukt'],0,'Die Daten widersprechen sich nun.'],['Eine neue Klasse ohne Schüler kann in der Gesamttabelle nicht gespeichert werden. Welche Anomalie ist das?',['Einfügeanomalie','Änderungsanomalie','Löschanomalie','Keine'],0,'Das Einfügen scheitert, weil ein Teil der Daten fehlt.'],['Wie vermeidet man Redundanz und Anomalien?',['Daten auf mehrere Tabellen verteilen und mit Fremdschlüsseln verknüpfen','Mehr Spalten anlegen','Alles in eine Tabelle schreiben','Tabellen kopieren'],0,'Jede Information steht dann nur einmal in der Datenbank.']]}}},
java:{n:'Basic Java',d:'Objektorientierte Programmierung mit Java',t:{
var:{n:'Variablen und Datentypen',
h:`<h3>Variablen</h3><p>Eine <b>Variable</b> hat einen Namen, einen Datentyp und einen Wert. Beim Deklarieren legst du den Typ fest, mit <code>=</code> weist du einen Wert zu.</p><pre>int alter = 15;
double preis = 2.5;
boolean fertig = false;
char note = 'A';
String name = "Max";</pre>${tb(['Typ','Inhalt','Beispiel'],[['int','ganze Zahl','42'],['double','Kommazahl (mit Punkt)','3.14'],['boolean','wahr oder falsch','true'],['char','ein Zeichen','&#39;x&#39;'],['String','Text','"Hallo"']])}<h3>Rechnen</h3><p>Operatoren: <code>+ - * /</code> und <code>%</code> (Rest). Bei zwei ganzen Zahlen ist <code>/</code> eine <b>Ganzzahldivision</b>: <code>7 / 2</code> ergibt 3, <code>7 % 2</code> ergibt 1. Kurzformen: <code>i++</code> (um 1 erhöhen), <code>x += 5</code>.</p><p>Bei Strings hängt <code>+</code> Texte aneinander: <code>"Info" + 10</code> ergibt "Info10".</p>${M('Jede Anweisung endet mit ;. Variablennamen beginnen klein (alter, preis), Klassennamen groß (Hund).')}`,
q:[['Welcher Datentyp passt zu 3,14?',['int','double','boolean','String'],1,'Kommazahlen sind double.'],['Was ergibt int x = 7 / 2;?',['3','3.5','4','Fehler'],0,'Ganzzahldivision: der Nachkommaanteil entfällt.'],['Welche Zeile ist korrekt?',['String name = "Max";','string name = Max;','String name = Max;','Text name = "Max";'],0,'String großgeschrieben, Text in Anführungszeichen.'],['Was ergibt "Info" + 10?',['Info10','Info 10','10Info','Fehler'],0,'Bei Strings hängt + an.']],
c:[{t:'Deklariere eine int-Variable alter mit dem Wert 15.',re:/int\s+alter\s*=\s*15\s*;/,sol:'int alter = 15;',h:'Datentyp, Name, =, Wert, Semikolon.'},{t:'Speichere den Text Max in einer String-Variable name.',re:/String\s+name\s*=\s*"Max"\s*;/,sol:'String name = "Max";',h:'Text gehört in doppelte Anführungszeichen.'},{t:'Deklariere double preis = 2.5 und boolean fertig = false (zwei Zeilen).',re:[/double\s+preis\s*=\s*2\.5\s*;/,/boolean\s+fertig\s*=\s*false\s*;/],sol:'double preis = 2.5;\nboolean fertig = false;',h:'Kommazahlen schreibt man mit Punkt.'}]},
bed:{n:'Verzweigungen (if/else)',
h:`<h3>Entscheidungen treffen</h3><pre>if (zahl &gt; 10) {
  System.out.println("groß");
} else if (zahl &gt; 5) {
  System.out.println("mittel");
} else {
  System.out.println("klein");
}</pre><p>Die Bedingung steht in Klammern und ist ein <b>boolescher Ausdruck</b>. Der erste passende Block wird ausgeführt, <code>else</code> fängt alles andere ab.</p><h3>Operatoren</h3>${tb(['Art','Operatoren'],[['Vergleich','== != &lt; &gt; &lt;= &gt;='],['logisch','&amp;&amp; (und), || (oder), ! (nicht)']])}<p>Zahlen vergleichst du mit <code>==</code>. <b>Strings</b> vergleichst du mit <code>equals</code>: <code>name.equals("Anna")</code>.</p>${M('Typische Fehler: = statt == schreiben, Strings mit == vergleichen, Klammern bei && und || vergessen.')}`,
q:[['Wie prüfst du zwei Zahlen auf Gleichheit?',['==','=','=>','!='],0,'Ein einzelnes = weist nur zu.'],['Wie vergleichst du zwei Strings?',['a.equals(b)','a == b','a = b','a.same(b)'],0,'Strings vergleicht man mit equals.'],['Wann läuft der else-Block?',['Wenn die Bedingung falsch ist','Immer','Wenn die Bedingung wahr ist','Nie'],0,'else ist der Fall „sonst“.'],['Welchen Wert hat x danach? int x = 5; if (x &gt; 3) { x = x - 1; } else { x = 0; }',['4','0','5','3'],0,'5 &gt; 3 ist wahr, also x = 4.']],
c:[{t:'Wenn zahl größer als 10 ist, gib „groß“ aus (System.out.println).',re:[/if\s*\(\s*zahl\s*>\s*10\s*\)/,/System\.out\.println\(\s*"groß"\s*\)\s*;/],sol:'if (zahl > 10) {\n  System.out.println("groß");\n}',h:'if (Bedingung) { ... }'},{t:'Gib „gerade“ aus, wenn zahl gerade ist, sonst „ungerade“. Nutze zahl % 2.',re:[/if\s*\(\s*zahl\s*%\s*2\s*==\s*0\s*\)/,/else/,/"gerade"/,/"ungerade"/],sol:'if (zahl % 2 == 0) {\n  System.out.println("gerade");\n} else {\n  System.out.println("ungerade");\n}',h:'% liefert den Rest der Division.'},{t:'Prüfe, ob punkte zwischen 0 und 100 liegt (beide eingeschlossen).',re:/if\s*\(\s*punkte\s*>=\s*0\s*&&\s*punkte\s*<=\s*100\s*\)/,sol:'if (punkte >= 0 && punkte <= 100) {\n}',h:'Zwei Vergleiche mit && verbinden.'}]},
schl:{n:'Schleifen',
h:`<h3>while-Schleife</h3><pre>int x = 0;
while (x &lt; 3) {
  System.out.println(x);
  x++;
}</pre><p>Die Bedingung wird <b>vor jedem Durchlauf</b> geprüft. Ändert sich im Schleifenkörper nichts an der Bedingung, entsteht eine <b>Endlosschleife</b>.</p><h3>for-Schleife</h3><pre>for (int i = 1; i &lt;= 3; i++) {
  System.out.println(i);
}</pre><p>Im Kopf stehen Start, Bedingung und Schritt. Die for-Schleife nutzt du, wenn die Anzahl der Durchläufe bekannt ist, die while-Schleife, wenn sie vom Programmverlauf abhängt.</p><h3>Typisches Muster: Summe</h3><pre>int summe = 0;
for (int i = 1; i &lt;= 100; i++) {
  summe += i;
}</pre>${M('Schleifen lassen sich schachteln, z. B. für Tabellen. Prüfe immer: Wie oft läuft die Schleife genau, und endet sie?')}`,
q:[['Wie oft läuft for (int i = 0; i &lt; 3; i++)?',['2','3','4','unendlich'],1,'i ist 0, 1 und 2.'],['Welche Schleife passt bei unbekannter Anzahl?',['while','for mit festem Ende','if','switch'],0,'while prüft nur die Bedingung.'],['Was passiert bei while (true) { }?',['Endlosschleife','Das Programm endet sofort','Sie läuft genau einmal','Fehler beim Kompilieren'],0,'Die Bedingung ist immer wahr.'],['Wie viele Durchläufe? int i = 10; while (i &gt; 0) { i = i - 3; }',['4','3','10','0'],0,'i: 10, 7, 4, 1, dann −2. Das sind 4 Durchläufe.']],
c:[{t:'Schreibe den Kopf einer for-Schleife, die i von 1 bis 10 zählt.',re:/for\s*\(\s*int\s+i\s*=\s*1\s*;\s*i\s*<=\s*10\s*;\s*i\+\+\s*\)/,sol:'for (int i = 1; i <= 10; i++) {\n}',h:'for (Start; Bedingung; Schritt)'},{t:'Schreibe eine while-Schleife, die läuft, solange x kleiner als 5 ist, und x um 1 erhöht.',re:[/while\s*\(\s*x\s*<\s*5\s*\)/,/x\+\+|x\s*\+=\s*1|x\s*=\s*x\s*\+\s*1/],sol:'while (x < 5) {\n  x++;\n}',h:'Ohne Erhöhung läuft sie ewig.'},{t:'Addiere die Zahlen 1 bis 100 in der Variable summe (for-Schleife).',re:[/for\s*\(/,/summe\s*\+=\s*i|summe\s*=\s*summe\s*\+\s*i/,/i\s*<=\s*100|i\s*<\s*101/],sol:'int summe = 0;\nfor (int i = 1; i <= 100; i++) {\n  summe += i;\n}',h:'summe += i; im Schleifenkörper.'}]},
kl:{n:'Klassen und Objekte',
h:`<h3>Bauplan und Exemplar</h3><p>Eine <b>Klasse</b> ist der Bauplan, ein <b>Objekt</b> ein konkretes Exemplar. Klasse Hund, Objekt bello. Jede Klasse hat <b>Attribute</b> (Eigenschaften) und <b>Methoden</b> (Fähigkeiten).</p><pre>class Hund {
  private String name;
  private int alter;

  public Hund(String name, int alter) {
    this.name = name;
    this.alter = alter;
  }
  public void bellen() { }
}
Hund bello = new Hund("Bello", 3);</pre><ul><li>Der <b>Konstruktor</b> heißt wie die Klasse und hat keinen Rückgabetyp. Er setzt die Anfangswerte.</li><li><code>this</code> meint das aktuelle Objekt, hier um Attribut und Parameter gleichen Namens zu unterscheiden.</li><li>Objekte erzeugst du mit <code>new</code>.</li></ul><h3>Darstellung</h3><p>Das <b>Klassendiagramm</b> zeigt Name, Attribute und Methoden der Klasse. Das <b>Objektdiagramm</b> zeigt ein konkretes Objekt mit seinen Attributwerten, z. B. bello: Hund, name = "Bello", alter = 3.</p>${M('Klasse = Bauplan, Objekt = Exemplar. Jedes Objekt hat eigene Attributwerte.')}`,
q:[['Womit erzeugst du ein Objekt?',['new','create','make','class'],0,'Hund h = new Hund();'],['Was sind Attribute?',['Eigenschaften einer Klasse','Befehle einer Klasse','Schleifen','Kommentare'],0,'Zum Beispiel name und alter.'],['Wie heißt der Konstruktor?',['Wie die Klasse','new','init','main'],0,'Gleicher Name, kein Rückgabetyp.'],['Wofür steht this?',['Für das aktuelle Objekt','Für die Klasse','Für ein neues Objekt','Für den Konstruktor'],0,'this.name ist das Attribut des Objekts.']],
c:[{t:'Erzeuge ein Objekt der Klasse Hund in der Variable bello (Konstruktor ohne Parameter).',re:/Hund\s+bello\s*=\s*new\s+Hund\s*\(\s*\)\s*;/,sol:'Hund bello = new Hund();',h:'Klasse Variable = new Klasse();'},{t:'Schreibe die Klasse Hund mit dem Attribut String name.',re:[/class\s+Hund/,/String\s+name\s*;/],sol:'class Hund {\n  String name;\n}',h:'class Name { Attribute }'},{t:'Ergänze in Hund einen Konstruktor mit dem Parameter String name, der das Attribut setzt.',re:[/Hund\s*\(\s*String\s+name\s*\)/,/this\.name\s*=\s*name\s*;/],sol:'public Hund(String name) {\n  this.name = name;\n}',h:'this.name meint das Attribut.'}],
d:{t:'Zeichne die Klasse Hund mit den Attributen name und alter und der Methode bellen().',k:[['Hund',['name','alter','bellen()']]],r:[]}},
meth:{n:'Methoden und Zugriffsrechte',
h:`<h3>Methoden</h3><p>Eine Methode fasst Anweisungen unter einem Namen zusammen. Sie kann <b>Parameter</b> entgegennehmen und einen <b>Rückgabewert</b> liefern. Hat sie keinen, steht <code>void</code>.</p><pre>public int verdopple(int x) {
  return 2 * x;
}
int y = verdopple(4);   // y ist 8</pre><h3>Zugriffsrechte und Kapselung</h3><p>Attribute macht man meist <code>private</code>: Nur die Klasse selbst darf sie ändern. Von außen greift man über <code>public</code>-Methoden zu.</p><pre>public String getName() { return name; }
public void setAlter(int alter) {
  if (alter &gt;= 0) { this.alter = alter; }
}</pre><ul><li><b>Getter</b> (get...) liefern den Wert eines Attributs.</li><li><b>Setter</b> (set...) ändern es und können vorher prüfen, ob der Wert sinnvoll ist.</li></ul>${M('Kapselung: Daten verstecken, Zugriff nur über Methoden. So bleiben die Werte gültig (z. B. kein negatives Alter).')}`,
q:[['Was bedeutet void?',['Die Methode gibt nichts zurück','Die Methode ist privat','Die Methode hat keinen Namen','Die Methode ist statisch'],0,'void = kein Rückgabewert.'],['Welche Methode liefert den Wert eines Attributs?',['Getter','Setter','Konstruktor','main'],0,'getName() gibt name zurück.'],['Warum sind Attribute oft private?',['So kann man nur über Methoden zugreifen und Werte prüfen','Damit sie schneller sind','Weil Java es verlangt','Damit sie nicht gespeichert werden'],0,'Das ist die Kapselung.'],['Was ist ein Parameter?',['Ein Wert, den man der Methode beim Aufruf übergibt','Der Rückgabewert','Ein Attribut','Ein Objekt'],0,'Zum Beispiel x bei verdopple(int x).']],
c:[{t:'Schreibe die Methode public int verdopple(int x), die das Doppelte von x zurückgibt.',re:[/public\s+int\s+verdopple\s*\(\s*int\s+x\s*\)/,/return\s+(2\s*\*\s*x|x\s*\*\s*2|x\s*\+\s*x)\s*;/],sol:'public int verdopple(int x) {\n  return 2 * x;\n}',h:'Rückgabetyp int, Rückgabe mit return.'},{t:'Schreibe den Getter getName() für das Attribut String name.',re:[/public\s+String\s+getName\s*\(\s*\)/,/return\s+(this\.)?name\s*;/],sol:'public String getName() {\n  return name;\n}',h:'Rückgabetyp = Typ des Attributs.'},{t:'Schreibe den Setter setAlter für int alter: Nur Werte ab 0 werden übernommen.',re:[/public\s+void\s+setAlter\s*\(\s*int\s+alter\s*\)/,/if\s*\(\s*alter\s*>=\s*0\s*\)/,/this\.alter\s*=\s*alter\s*;/],sol:'public void setAlter(int alter) {\n  if (alter >= 0) {\n    this.alter = alter;\n  }\n}',h:'Ein Setter hat void und prüft mit if.'}]},
bez:{n:'Beziehungen zwischen Klassen',
h:`<h3>Assoziation und Kardinalität</h3><p>Klassen stehen oft in Beziehung: Ein Besitzer hat Hunde. Im Klassendiagramm verbindet eine Linie die Klassen, an den Enden stehen <b>Kardinalitäten</b>. Besitzer 1 — n Hund heißt: Ein Besitzer hat beliebig viele Hunde, ein Hund gehört zu genau einem Besitzer.</p><h3>Umsetzung in Java</h3><p>Ein einzelnes verbundenes Objekt speicherst du in einem <b>Referenzattribut</b>. Mehrere Objekte brauchen eine Liste.</p><pre>class Hund {
  private Besitzer besitzer;
}
class Besitzer {
  private ArrayList&lt;Hund&gt; hunde = new ArrayList&lt;Hund&gt;();
  public void hundHinzufuegen(Hund h) {
    hunde.add(h);
  }
}</pre><h3>Objektdiagramm</h3><p>Es zeigt, welche konkreten Objekte miteinander verbunden sind, z. B. anna: Besitzer mit bello: Hund und luna: Hund.</p><h3>Bezug zu Datenbanken</h3><p>Das Klassendiagramm ist die Grundlage fürs relationale Modell: Die Referenz auf den Besitzer wird zum <b>Fremdschlüssel</b> in der Tabelle der n-Seite.</p>${M('1-Seite: ein Referenzattribut oder keins. n-Seite: eine Liste (ArrayList). In der Datenbank: Fremdschlüssel auf der n-Seite.')}`,

const N={
fkt:{n:'Funktionen und Datenflussdiagramme',
h:`<h3>Funktion als Prozess</h3><p>Eine <b>Funktion</b> ist ein Daten verarbeitender Prozess: Sie nimmt <b>mehrere Eingaben</b> (Parameter) entgegen und liefert <b>eine Ausgabe</b>. Beispiel: <code>brutto(netto, satz) = netto + netto · satz</code>.</p>
<h3>Datenflussdiagramm</h3><p>Ein <b>Datenflussdiagramm</b> zeigt, wie Daten durch Funktionen fließen:</p><ul><li>Ein Kasten steht für eine Funktion.</li><li>Pfeile sind der <b>Datenfluss</b>. Links kommen die Eingaben an, rechts geht die Ausgabe heraus.</li><li>Ein <b>Verteiler</b> (Punkt) verzweigt einen Wert, wenn er mehrfach gebraucht wird.</li></ul><pre>          ┌────────┐
satz ────►│   ×    │────┐
      ┌──►│        │    │   ┌────────┐
      │   └────────┘    └──►│   +    │───► brutto
netto─●                     │        │
      └────────────────────►│        │
                            └────────┘</pre><p>Hier wird netto durch den Verteiler zweimal verwendet.</p>
<h3>Verkettung</h3><p>Setzt man die Ausgabe einer Funktion als Eingabe einer anderen ein, entsteht eine neue Funktion. Aus <code>f(x) = 2·x</code> und <code>g(x) = x + 3</code> wird <code>g(f(x)) = 2·x + 3</code>. So baut man komplexe Berechnungen aus einfachen Bausteinen.</p>${M('Datenflussdiagramm und Formel beschreiben dasselbe. Das Diagramm zeigt die Struktur, die Formel setzt man im Tabellenkalkulationsprogramm um.')}`,
q:[['Was ist eine Funktion in der Informatik?',['Ein Daten verarbeitender Prozess mit Eingaben und einer Ausgabe','Ein Programm ohne Eingabe','Eine Tabelle','Eine Schleife'],0,'Eingaben rein, genau ein Ergebnis raus.'],['Wofür braucht man einen Verteiler im Datenflussdiagramm?',['Wenn ein Wert an mehrere Funktionen gehen soll','Um Werte zu löschen','Um eine Ausgabe zu erzeugen','Um Daten dauerhaft zu speichern'],0,'Der Verteiler leitet denselben Wert in mehrere Richtungen.'],['Was bedeutet Verkettung von Funktionen?',['Die Ausgabe einer Funktion ist die Eingabe einer anderen','Zwei Funktionen laufen ohne Verbindung nebeneinander','Eine Funktion ruft sich selbst auf','Funktionen werden gelöscht'],0,'So entsteht eine neue, zusammengesetzte Funktion.'],['f(x) = 2·x und g(x) = x + 3. Was liefert g(f(4))?',['11','14','8','10'],0,'f(4) = 8, dann g(8) = 11.']]},
tab:{n:'Tabellenkalkulation: Formeln und Zellbezüge',
h:`<h3>Aufbau</h3><p>Ein Tabellenkalkulationsprogramm (z. B. Excel) arbeitet mit <b>Tabellenblättern</b>. Ein Blatt besteht aus <b>Zellen</b>. Jede Zelle hat eine Adresse aus Spalte und Zeile, z. B. <code>B3</code>.</p><h3>Formeln</h3><p>Eine <b>Formel</b> beginnt mit <code>=</code> und kann Zahlen, Zellbezüge, Operatoren (<code>+ - * / ^</code>) und Funktionen enthalten: <code>=B2*C2</code>. Ändert sich ein Wert, rechnet das Programm automatisch neu.</p>${tb(['','A','B','C','D'],[['1','Artikel','Menge','Preis','Gesamt'],['2','Heft','3','2,50','=B2*C2']])}<h3>Zellbezüge</h3><ul><li><b>Relativ</b> (<code>B2</code>): Beim Kopieren verschiebt sich der Bezug. Aus <code>=B2*C2</code> in D2 wird in D3 die Formel <code>=B3*C3</code>.</li><li><b>Absolut</b> (<code>$F$1</code>): Der Bezug bleibt beim Kopieren fest, z. B. für einen Steuersatz.</li><li><b>Bereich</b> (<code>D2:D4</code>): alle Zellen von D2 bis D4.</li></ul><h3>Vordefinierte Funktionen</h3>${tb(['Funktion','Ergebnis'],[['SUMME(D2:D4)','Summe des Bereichs'],['MITTELWERT(B2:B9)','Durchschnitt'],['MIN(...) / MAX(...)','kleinster / größter Wert'],['ANZAHL(...)','Anzahl der Zahlen']])}${M('Gute Tabelle: Eingaben, Formeln und Ergebnisse klar trennen, Beschriftungen setzen und das Modell mit Testwerten prüfen. In den Übungen: Trennzeichen ; und Dezimalkomma wie im deutschen Excel.')}`,
q:[['Wie beginnt eine Formel?',['Mit =','Mit #','Mit $','Mit Formel:'],0,'Das Gleichheitszeichen kennzeichnet die Formel.'],['Die Formel =B2*C2 steht in D2 und wird nach D3 kopiert. Was steht dann in D3?',['=B3*C3','=B2*C2','=B3*C2','=C3*D3'],0,'Relative Bezüge wandern mit.'],['Wie hältst du den Bezug auf F1 beim Kopieren fest?',['$F$1','F1','F 1','#F1'],0,'Das Dollarzeichen sperrt Spalte und Zeile.'],['Was bedeutet D2:D4?',['Der Zellbereich von D2 bis D4','Nur die Zellen D2 und D4','Eine Division','Die Summe'],0,'Der Doppelpunkt steht für den Bereich.']],
xl:1,
c:[{t:'Berechne in D2 den Gesamtpreis (Menge mal Preis).',cell:'D2',g:[['Artikel','Menge','Preis','Gesamt'],['Heft',3,2.5,''],['Stift',10,0.8,''],['Block',2,4,'']],sol:'=B2*C2'},{t:'Berechne in D5 die Summe aller Gesamtpreise (D2 bis D4).',cell:'D5',g:[['Artikel','Menge','Preis','Gesamt'],['Heft',3,2.5,7.5],['Stift',10,0.8,8],['Block',2,4,8],['Summe','','','']],sol:'=SUMME(D2:D4)'},{t:'Der Steuersatz steht in F1. Berechne in C2 den Bruttopreis (Netto mal 1 plus Satz). Die Formel soll sich nach unten kopieren lassen, der Satz muss fest bleiben.',cell:'C2',g:[['Artikel','Netto','Brutto','','Satz',0.19],['Heft',2.5,'','','',''],['Stift',0.8,'','','','']],sol:'=B2*(1+$F$1)',re:/\$F\$1/}]},
wenn:{n:'Bedingte Funktionen (WENN)',
h:`<h3>Die WENN-Funktion</h3><p>Mit <code>WENN</code> trifft die Tabelle eine Entscheidung:</p><pre>=WENN(Bedingung; Dann-Wert; Sonst-Wert)
=WENN(B2&gt;=50; "bestanden"; "nicht bestanden")</pre><p>Ist die Bedingung wahr, liefert die Funktion den zweiten Parameter, sonst den dritten. Vergleiche: <code>= &lt;&gt; &lt; &gt; &lt;= &gt;=</code>. Text steht in Anführungszeichen.</p><h3>Bedingungen verknüpfen</h3><p><code>UND(A; B)</code> ist wahr, wenn beide gelten, <code>ODER(A; B)</code>, wenn mindestens eine gilt, <code>NICHT(A)</code> kehrt um: <code>=WENN(UND(B2&gt;=0; B2&lt;=100); "gültig"; "Fehler")</code>.</p><h3>Verschachteln</h3><p>Für mehr als zwei Fälle setzt man ein WENN in den Sonst-Teil:</p><pre>=WENN(B2&gt;=90; "sehr gut"; WENN(B2&gt;=70; "gut"; "ausreichend"))</pre>${M('Drei Fälle brauchen zwei WENN. Prüfe immer die Grenzwerte: Gilt bei genau 50 schon „bestanden“, ist es &gt;= und nicht &gt;.')}`,
q:[['Was liefert =WENN(5&gt;3; "ja"; "nein")?',['ja','nein','5','Fehler'],0,'5 &gt; 3 ist wahr.'],['Welche Funktion prüft, ob beide Bedingungen wahr sind?',['UND','ODER','NICHT','SUMME'],0,'UND verlangt, dass alle Bedingungen gelten.'],['Welche Formel gibt ab 50 Punkten „bestanden“ aus (Punkte in B2)?',['=WENN(B2&gt;=50; "bestanden"; "nicht bestanden")','=WENN(B2&gt;50; "bestanden"; "nicht bestanden")','=WENN(B2=50; "bestanden")','=B2&gt;=50'],0,'Bei genau 50 muss es schon bestanden sein, also &gt;=.'],['Wie viele WENN braucht man mindestens für drei Bewertungsstufen?',['2','1','3','4'],0,'Zwei Entscheidungen teilen in drei Bereiche.']],
xl:1,
c:[{t:'Gib in C2 „bestanden“ aus, wenn die Punkte mindestens 50 sind, sonst „nicht bestanden“.',cell:'C2',g:[['Name','Punkte','Ergebnis'],['Anna',50,''],['Ben',41,'']],sol:'=WENN(B2>=50;"bestanden";"nicht bestanden")'},{t:'Berechne in C2 die Prämie: 5 % vom Umsatz, aber nur wenn der Umsatz über 1000 liegt, sonst 0.',cell:'C2',g:[['Name','Umsatz','Prämie'],['Anna',1000,''],['Ben',1200,'']],sol:'=WENN(B2>1000;B2*0,05;0)'},{t:'Gib in C2 aus: ab 90 Punkten „sehr gut“, ab 70 „gut“, sonst „ausreichend“.',cell:'C2',g:[['Name','Punkte','Bewertung'],['Anna',70,''],['Ben',90,'']],sol:'=WENN(B2>=90;"sehr gut";WENN(B2>=70;"gut";"ausreichend"))'}]},
modell:{n:'Datenmodell und relationales Modell',
h:`<h3>Daten objektorientiert modellieren</h3><p>Beispiel: das Mitgliederverzeichnis eines Sportvereins. Ein einzelnes Mitglied ist ein <b>Objekt</b>. Alle Mitglieder haben dieselben Eigenschaften, deshalb fasst man sie in der <b>Klasse</b> Mitglied zusammen. Eigenschaften heißen <b>Attribute</b> (name, geburtsjahr, eintritt). Der konkrete Wert eines Attributs ist der <b>Attributwert</b>.</p><pre>┌──────────────┐        anna : Mitglied
│   Mitglied   │        name = "Anna"
├──────────────┤        geburtsjahr = 2010
│ name         │        eintritt = 2022
│ geburtsjahr  │
│ eintritt     │        (Objektdiagramm)
└──────────────┘
 (Klassendiagramm)</pre><h3>Vom Modell zum Tabellenschema</h3>${tb(['Datenmodell','Relationales Modell'],[['Klasse','Tabelle (Tabellenschema)'],['Attribut','Spalte mit Datentyp'],['Objekt','Datensatz (Zeile)']])}<pre>Mitglied(<u>id</u>, name, geburtsjahr, eintritt)</pre><p>Weil kein Attribut sicher eindeutig ist, ergänzt man eine <b>id</b> als <b>Primärschlüssel</b>. Jedes Attribut bekommt einen <b>Datentyp</b>: name TEXT, geburtsjahr INTEGER, eintritt INTEGER oder DATE.</p>${M('Objekt wird Datensatz, Klasse wird Tabelle, Attribut wird Spalte.')}`,
q:[['Was entspricht einem Datensatz im Datenmodell?',['Ein Objekt','Eine Klasse','Ein Attribut','Ein Datentyp'],0,'Jedes Objekt wird zu einer Zeile.'],['Was wird aus einer Klasse im relationalen Modell?',['Eine Tabelle','Eine Spalte','Ein Datensatz','Ein Primärschlüssel'],0,'Klasse → Tabelle.'],['Welcher Datentyp passt zu geburtsjahr?',['INTEGER','TEXT','BOOLEAN','Keiner'],0,'Das Jahr ist eine ganze Zahl.'],['Was ergänzt man, wenn kein Attribut eindeutig ist?',['Eine id als Primärschlüssel','Eine weitere Tabelle','Einen Fremdschlüssel','Nichts'],0,'Die id identifiziert jeden Datensatz eindeutig.']],
d:{t:'Zeichne die Klasse Mitglied mit den Attributen name, geburtsjahr und eintritt.',k:[['Mitglied',['name','geburtsjahr','eintritt']]],r:[]}},
zust:{n:'Variablenarten und Zustand',
h:`<h3>Drei Arten von Variablen</h3><pre>class Konto {
  private double saldo;              // Attribut

  public void einzahlen(double betrag) {   // betrag: Parameter
    double neu = saldo + betrag;     // lokale Variable
    saldo = neu;
  }
}</pre>${tb(['Art','Wo deklariert','Gilt'],[['Attribut','in der Klasse','solange das Objekt lebt'],['Parameter','im Methodenkopf','nur in der Methode, bekommt den Übergabewert'],['lokale Variable','im Methodenrumpf','nur in der Methode']])}<h3>Wertzuweisung und Zustand</h3><p>Die Attributwerte eines Objekts bilden seinen <b>Zustand</b>. Eine <b>Wertzuweisung</b> wie <code>saldo = saldo + betrag;</code> ändert den Zustand. Rechts vom = wird zuerst berechnet, dann wird der Wert in die Variable links geschrieben.</p><p>Beispiel: <code>Konto k = new Konto(); k.einzahlen(50); k.einzahlen(20);</code> Der Saldo ist danach 70.</p>${M('Attribute behalten ihren Wert zwischen Methodenaufrufen, Parameter und lokale Variablen verschwinden nach dem Aufruf.')}`,
q:[['Wo gilt eine lokale Variable?',['Nur in der Methode, in der sie deklariert ist','In der ganzen Klasse','In allen Klassen','Für immer'],0,'Nach dem Methodenende ist sie weg.'],['Was bildet den Zustand eines Objekts?',['Die Attributwerte','Die Methodennamen','Der Klassenname','Die Parameter'],0,'Ändert sich ein Attributwert, ändert sich der Zustand.'],['Was ist betrag in einzahlen(double betrag)?',['Ein Parameter','Ein Attribut','Eine lokale Variable','Ein Konstruktor'],0,'Parameter stehen im Methodenkopf.'],['saldo = 20; saldo = saldo + 5; Wie groß ist saldo danach?',['25','20','5','Fehler'],0,'Rechts wird zuerst gerechnet: 20 + 5 = 25.']],
c:[{t:'Setze das Attribut saldo auf 0.',re:/saldo\s*=\s*0\s*;/,sol:'saldo = 0;',h:'Wertzuweisung: Variable = Wert;'},{t:'Schreibe die Methode einzahlen(double betrag): Sie erhöht saldo um betrag (Rückgabetyp void).',re:[/void\s+einzahlen\s*\(\s*double\s+betrag\s*\)/,/saldo\s*(\+=\s*betrag|=\s*saldo\s*\+\s*betrag)\s*;/],sol:'public void einzahlen(double betrag) {\n  saldo = saldo + betrag;\n}',h:'saldo += betrag; ändert den Zustand.'},{t:'Schreibe die Methode doppelt(): Speichere saldo * 2 in der lokalen Variable ergebnis (double) und gib sie zurück.',re:[/double\s+ergebnis\s*=\s*saldo\s*\*\s*2\s*;/,/return\s+ergebnis\s*;/],sol:'public double doppelt() {\n  double ergebnis = saldo * 2;\n  return ergebnis;\n}',h:'Rückgabetyp double, lokale Variable, return.'}]},
alg:{n:'Algorithmen',
h:`<h3>Was ist ein Algorithmus?</h3><p>Ein <b>Algorithmus</b> ist eine eindeutige, endliche Abfolge von Anweisungen, die ein Problem löst. Er besteht aus drei <b>Strukturelementen</b>:</p>${tb(['Element','Bedeutung','Java'],[['Sequenz','Anweisungen nacheinander','Zeile für Zeile'],['Verzweigung','Auswahl je nach Bedingung','if / else'],['Wiederholung','Anweisungen mehrfach','while / for']])}<h3>Darstellung</h3><p><b>Pseudocode</b> beschreibt den Ablauf in Alltagssprache mit festen Wörtern:</p><pre>setze a auf die erste Zahl, b auf die zweite
solange b ungleich 0:
    r = Rest von a durch b
    a = b
    b = r
Ergebnis ist a</pre><p>Das ist der Euklidische Algorithmus (größter gemeinsamer Teiler). Grafisch zeichnet man ihn als <b>Struktogramm</b> oder Ablaufdiagramm.</p><h3>Algorithmen nachvollziehen</h3><p>Fremde Algorithmen verstehst du mit einer <b>Zustandstabelle</b>: Für jeden Schritt trägst du die Variablenwerte ein.</p>${tb(['Durchlauf','a','b','r'],[['Start','6','4','–'],['1','4','2','2'],['2','2','0','0']])}<p>Am Ende ist b = 0, das Ergebnis ist a = 2.</p>${M('Beim Analysieren: von Hand durchrechnen, Tabelle führen, prüfen, ob der Algorithmus endet.')}`,
q:[['Welche drei Strukturelemente nutzen Algorithmen?',['Sequenz, Verzweigung, Wiederholung','Klasse, Objekt, Attribut','Tabelle, Zeile, Spalte','Eingabe, Ausgabe, Speicher'],0,'Damit lässt sich jeder Ablauf beschreiben.'],['int a = 6, b = 4; while (b &gt; 0) { int r = a % b; a = b; b = r; } Was steht am Ende in a?',['2','4','0','6'],0,'a, b: (6,4), (4,2), (2,0). Ergebnis 2.'],['Was ist Pseudocode?',['Ablauf in Alltagssprache mit festen Schlüsselwörtern','Ein Java-Programm','Ein Diagramm mit Pfeilen','Ein Fehlermeldungstext'],0,'Er ist unabhängig von der Programmiersprache.'],['Wie oft läuft: int i = 1; while (i &lt; 20) { i = i * 2; }?',['5','4','19','Unendlich oft'],0,'i: 1, 2, 4, 8, 16, dann 32. Das sind 5 Durchläufe.']]},
vererb:{n:'Vererbung',
h:`<h3>Generalisierung und Spezialisierung</h3><p>Gemeinsamkeiten mehrerer Klassen fasst man in einer <b>Oberklasse</b> zusammen (<b>Generalisierung</b>). Die besonderen Eigenschaften stehen in den <b>Unterklassen</b> (<b>Spezialisierung</b>). Test: Ein Auto <i>ist ein</i> Fahrzeug.</p><pre>        ┌────────────┐
        │  Fahrzeug  │
        │ name       │
        └─────△──────┘
        ┌─────┴──────┐
  ┌─────┴────┐  ┌────┴─────┐
  │   Auto   │  │ Fahrrad  │
  │ tueren   │  │ gaenge   │
  └──────────┘  └──────────┘</pre><p>Im Klassendiagramm zeigt ein Pfeil mit leerem Dreieck zur Oberklasse.</p><h3>Vererbung in Java</h3><pre>class Fahrzeug {
  protected String name;
  public Fahrzeug(String name) { this.name = name; }
  public String beschreibe() { return "Fahrzeug"; }
}
class Auto extends Fahrzeug {
  private int tueren;
  public Auto(String name, int tueren) {
    super(name);
    this.tueren = tueren;
  }
  public String beschreibe() { return "Auto"; }
}</pre><ul><li><code>extends</code> macht Auto zur Unterklasse. Sie <b>erbt</b> Attribute und Methoden.</li><li><code>super(...)</code> ruft den Konstruktor der Oberklasse auf.</li><li>Eine Unterklasse kann eine geerbte Methode <b>überschreiben</b>: gleicher Methodenkopf, neuer Rumpf.</li></ul>${M('Gemeinsames nach oben, Besonderes nach unten. Die Unterklasse hat alles der Oberklasse und kann es überschreiben oder ergänzen.')}`,
q:[['Welche Beziehung beschreibt Vererbung?',['Ist-ein: Ein Auto ist ein Fahrzeug','Hat-ein: Ein Auto hat Räder','Ist gleich','Ruft auf'],0,'Die Unterklasse ist eine spezielle Oberklasse.'],['Wie heißt das Schlüsselwort, mit dem eine Klasse von einer anderen erbt?',['extends','implements','inherits','super'],0,'class Auto extends Fahrzeug'],['Was bedeutet Überschreiben?',['Die Unterklasse definiert eine geerbte Methode mit gleichem Kopf neu','Eine Methode wird gelöscht','Eine Methode wird zweimal aufgerufen','Ein Attribut ändert seinen Typ'],0,'Der Rumpf der Methode wird ersetzt.'],['Wofür steht super(name) im Konstruktor?',['Aufruf des Konstruktors der Oberklasse','Aufruf einer Methode von Auto','Erzeugung eines neuen Objekts','Löschen des Namens'],0,'So wird der geerbte Teil initialisiert.']],
c:[{t:'Schreibe den Kopf der Klasse Auto, die von Fahrzeug erbt.',re:/class\s+Auto\s+extends\s+Fahrzeug/,sol:'class Auto extends Fahrzeug {\n}',h:'class Unterklasse extends Oberklasse'},{t:'Rufe im Konstruktor von Auto den Konstruktor der Oberklasse mit dem Parameter name auf.',re:/super\s*\(\s*name\s*\)\s*;/,sol:'super(name);',h:'super(...) steht in der ersten Zeile des Konstruktors.'},{t:'Überschreibe in Auto die Methode public String beschreibe(): Sie soll "Auto" zurückgeben.',re:[/public\s+String\s+beschreibe\s*\(\s*\)/,/return\s+"Auto"\s*;/],sol:'public String beschreibe() {\n  return "Auto";\n}',h:'Gleicher Methodenkopf wie in der Oberklasse.'}],
d:{t:'Zeichne eine Generalisierungshierarchie: Auto und Fahrrad sind Unterklassen von Fahrzeug. Bei der Verbindung gibst du v ein, wenn die zuerst angeklickte Klasse die Unterklasse ist.',k:[['Fahrzeug',['name']],['Auto',['tueren']],['Fahrrad',['gaenge']]],r:[['Auto','Fahrzeug','v'],['Fahrrad','Fahrzeug','v']]}},
array:{n:'Arrays (Felder)',
h:`<h3>Viele gleichartige Daten</h3><p>Ein <b>Array</b> (Feld) speichert mehrere Werte desselben Typs unter einem Namen. Jedes <b>Element</b> hat einen <b>Index</b>, der bei <b>0</b> beginnt. Die Länge steht in <code>length</code>.</p><pre>int[] zahlen = new int[5];   // Plätze 0 bis 4
zahlen[0] = 7;
zahlen[1] = zahlen[0] + 3;
int n = zahlen.length;       // 5</pre>${tb(['Index','0','1','2','3','4'],[['Wert','7','10','0','0','0']])}<p>Neue int-Felder sind mit 0 gefüllt. Ein Zugriff außerhalb von 0 bis length − 1 führt zum Fehler ArrayIndexOutOfBounds.</p><h3>Durchlaufen mit for</h3><pre>int summe = 0;
for (int i = 0; i &lt; zahlen.length; i++) {
  summe += zahlen[i];
}</pre><h3>Arrays von Objekten</h3><p>Auch Klassen sind Datentypen: <code>Hund[] hunde = new Hund[10];</code> Zu Beginn enthalten alle Plätze <code>null</code>, also noch kein Objekt. Mit <code>hunde[0] = new Hund();</code> legst du ein Objekt ab.</p>${M('Der Index des letzten Elements ist length − 1, nicht length.')}`,
q:[['Welchen Index hat das erste Element?',['0','1','-1','length'],0,'Arrays zählen ab 0.'],['int[] a = new int[5]; Welcher ist der größte gültige Index?',['4','5','6','0'],0,'Gültig sind 0 bis 4.'],['Wie erhältst du die Anzahl der Elemente von a?',['a.length','a.length()','a.size','length(a)'],0,'Bei Arrays ist length ein Attribut ohne Klammern.'],['Was steht nach Hund[] h = new Hund[3]; in h[0]?',['null (noch kein Objekt)','Ein Hund-Objekt','0','Ein Fehler'],0,'Die Plätze sind leer, bis man Objekte ablegt.']],
c:[{t:'Deklariere ein int-Array zahlen mit 5 Plätzen.',re:/int\s*\[\s*\]\s+zahlen\s*=\s*new\s+int\s*\[\s*5\s*\]\s*;/,sol:'int[] zahlen = new int[5];',h:'Typ[] Name = new Typ[Anzahl];'},{t:'Setze das erste Element von zahlen auf 7.',re:/zahlen\s*\[\s*0\s*\]\s*=\s*7\s*;/,sol:'zahlen[0] = 7;',h:'Der erste Index ist 0.'},{t:'Addiere alle Elemente von zahlen mit einer for-Schleife in der Variable summe.',re:[/for\s*\(\s*int\s+i\s*=\s*0\s*;\s*i\s*<\s*zahlen\.length\s*;\s*i\+\+\s*\)/,/summe\s*(\+=\s*zahlen\s*\[\s*i\s*\]|=\s*summe\s*\+\s*zahlen\s*\[\s*i\s*\])\s*;/],sol:'for (int i = 0; i < zahlen.length; i++) {\n  summe += zahlen[i];\n}',h:'i von 0 bis kleiner length, summe += zahlen[i].'}]},
bez:{n:'Klassenbeziehungen mit Referenzen',
h:`<h3>Beziehungen im Klassendiagramm</h3><p>Klassen sind über <b>Beziehungen</b> verbunden. An den Enden stehen <b>Kardinalitäten</b>: Besitzer 1 — n Hund heißt, ein Besitzer hat viele Hunde, ein Hund hat genau einen Besitzer.</p><h3>Umsetzung mit Referenzen</h3><p>Ein Objekt kennt ein anderes über eine <b>Referenz</b>, also ein Attribut, dessen Typ die andere Klasse ist.</p><ul><li><b>1-Seite:</b> ein Referenzattribut, z. B. in Hund: <code>private Besitzer besitzer;</code></li><li><b>n-Seite:</b> ein Array von Referenzen plus ein Zähler.</li></ul><pre>class Besitzer {
  private Hund[] hunde = new Hund[10];
  private int anzahl = 0;

  public void hundHinzufuegen(Hund h) {
    if (anzahl &lt; hunde.length) {
      hunde[anzahl] = h;
      anzahl++;
    }
  }
}</pre><p>Typische Methoden einer solchen Verwaltung: <b>Einfügen</b>, <b>Entfernen</b> und <b>Bearbeiten</b> von Elementen.</p><h3>Bezug zur Datenbank</h3><p>Die Referenz auf den Besitzer entspricht dem <b>Fremdschlüssel</b> in der Tabelle der n-Seite.</p>${M('1-Seite: Referenzattribut. n-Seite: Array (plus Anzahl). Das Klassendiagramm bestimmt, wer wen kennt.')}`,
q:[['Ein Besitzer hat mehrere Hunde. Welche Kardinalität steht an der Klasse Hund?',['n','1','0','m'],0,'Zu einem Besitzer gehören viele Hunde.'],['Wie speichert ein Besitzer mehrere Hunde?',['In einem Array von Hund-Referenzen','In einem einzigen int','In einem String','Gar nicht'],0,'Für viele Objekte braucht man eine Datenstruktur.'],['Was ist eine Referenz?',['Ein Attribut, das auf ein anderes Objekt verweist','Ein Datentyp für Zahlen','Eine Schleife','Ein Kommentar'],0,'Über sie kann ein Objekt Methoden eines anderen aufrufen.'],['Was entspricht der Referenz Hund → Besitzer in einer Datenbank?',['Ein Fremdschlüssel in der Hund-Tabelle','Ein Fremdschlüssel in der Besitzer-Tabelle','Eine zweite Datenbank','Ein Datentyp'],0,'Der Fremdschlüssel steht auf der n-Seite.']],
c:[{t:'Die Klasse Hund kennt ihren Besitzer. Deklariere das Attribut besitzer vom Typ Besitzer.',re:/Besitzer\s+besitzer\s*;/,sol:'private Besitzer besitzer;',h:'Typ, dann Attributname.'},{t:'Der Besitzer hat viele Hunde. Deklariere das Attribut hunde als Array von Hund.',re:/Hund\s*\[\s*\]\s+hunde\b/,sol:'private Hund[] hunde;',h:'Typ[] name;'},{t:'Schreibe in Besitzer die Methode hundHinzufuegen(Hund h): Speichere h im Array hunde an der Stelle anzahl und erhöhe anzahl um 1.',re:[/public\s+void\s+hundHinzufuegen\s*\(\s*Hund\s+h\s*\)/,/hunde\s*\[\s*anzahl\s*\]\s*=\s*h\s*;/,/anzahl\s*(\+\+|\+=\s*1|=\s*anzahl\s*\+\s*1)/],sol:'public void hundHinzufuegen(Hund h) {\n  hunde[anzahl] = h;\n  anzahl++;\n}',h:'Erst ablegen, dann den Zähler erhöhen.'}],
d:{t:'Ein Besitzer hat mehrere Hunde, jeder Hund hat genau einen Besitzer. Zeichne das Klassendiagramm.',k:[['Besitzer',['name']],['Hund',['name','alter']]],r:[['Besitzer','Hund','1','n']]}},
komm:{n:'Kommunikation und Datenkapselung',
h:`<h3>Objekte sprechen miteinander</h3><p>Hat ein Objekt eine Referenz auf ein anderes, kann es dessen Methoden aufrufen. Der Aufruf ist die „Nachricht“ an das andere Objekt.</p><pre>// in Hund
public String besitzerName() {
  return besitzer.getName();
}
// im Hauptprogramm
bello.bellen();
bello.setAlter(4);</pre><p>Beispiel Fahrradverleih: Ruft <code>kunde.leiheAus(rad)</code> auf, ruft diese Methode intern <code>rad.setVerliehen(true)</code> auf. Das Zusammenspiel der Objekte entsteht durch solche Methodenaufrufe.</p><h3>Datenkapselung</h3><p>Die Attribute sind <code>private</code>. Andere Objekte kommen nur über <code>public</code>-Methoden heran (Getter, Setter, weitere Methoden). Das hat Vorteile:</p><ul><li>Die Klasse prüft Werte (z. B. kein negatives Alter).</li><li>Die innere Umsetzung lässt sich ändern, ohne andere Klassen anzupassen.</li><li>Das Objekt bleibt in einem gültigen Zustand.</li></ul>${M('Nur über die Schnittstelle (öffentliche Methoden) zugreifen, die Daten bleiben im Objekt versteckt.')}`,
q:[['Wie sendet Objekt A eine Nachricht an Objekt B?',['Durch Aufruf einer Methode von B über die Referenz','Durch Kopieren der Attribute von B','Durch Löschen von B','Gar nicht'],0,'Methodenaufruf = Nachricht.'],['Was braucht ein Objekt, um Methoden eines anderen aufzurufen?',['Eine Referenz darauf','Dasselbe Attribut','Denselben Namen','Nichts'],0,'Ohne Referenz kennt es das andere Objekt nicht.'],['Was ist ein Vorteil der Datenkapselung?',['Die Klasse kann Werte prüfen und bleibt in einem gültigen Zustand','Java läuft dadurch schneller','Es werden keine Methoden mehr gebraucht','Attribute lassen sich nicht mehr speichern'],0,'Der Zugriff läuft über Methoden, die kontrollieren.'],['name ist private. Wie kommt Hund an den Namen des Besitzers?',['Über besitzer.getName()','Über besitzer.name','Gar nicht','Über this.name'],0,'Zugriff nur über öffentliche Methoden.']],
c:[{t:'Rufe die Methode bellen() des Objekts bello auf.',re:/bello\.bellen\s*\(\s*\)\s*;/,sol:'bello.bellen();',h:'objekt.methode();'},{t:'Setze das Alter von bello mit dem Setter setAlter auf 4.',re:/bello\.setAlter\s*\(\s*4\s*\)\s*;/,sol:'bello.setAlter(4);',h:'Der Parameter steht in Klammern.'},{t:'Schreibe in Hund die Methode besitzerName(): Sie gibt über den Getter den Namen des Besitzers zurück.',re:[/public\s+String\s+besitzerName\s*\(\s*\)/,/return\s+besitzer\.getName\s*\(\s*\)\s*;/],sol:'public String besitzerName() {\n  return besitzer.getName();\n}',h:'Über die Referenz besitzer die Methode getName() aufrufen.'}]},
poly:{n:'Polymorphismus',
h:`<h3>Ein Aufruf, viele Verhalten</h3><p>In einer Generalisierungshierarchie darf eine Variable vom Typ der <b>Oberklasse</b> auch Objekte der <b>Unterklassen</b> referenzieren. Ruft man eine überschriebene Methode auf, wird zur Laufzeit die Methode der <b>tatsächlichen Klasse</b> des Objekts ausgeführt. Das heißt <b>Polymorphismus</b> (Vielgestaltigkeit).</p><pre>class Mitglied {
  public double beitrag() { return 10.0; }
}
class Jugendlicher extends Mitglied {
  public double beitrag() { return 5.0; }
}

Mitglied[] alle = new Mitglied[2];
alle[0] = new Mitglied();
alle[1] = new Jugendlicher();
double summe = 0;
for (int i = 0; i &lt; alle.length; i++) {
  summe += alle[i].beitrag();   // 10.0 + 5.0
}</pre><p>Das Array hat den Typ Mitglied, aber alle[1] verhält sich wie ein Jugendlicher. So berechnet man z. B. die Beiträge eines Sportvereins mit einer einzigen Schleife, obwohl jede Sparte anders abrechnet.</p>${M('Der Typ der Variablen legt fest, was aufgerufen werden darf. Das Objekt entscheidet, welcher Code läuft.')}`,
q:[['Was bedeutet Polymorphismus?',['Gleicher Aufruf, je nach Klasse des Objekts anderes Verhalten','Mehrere Attribute mit gleichem Namen','Eine Klasse ohne Methoden','Mehrere Konstruktoren'],0,'Das passende Verhalten wird zur Laufzeit gewählt.'],['Welche Methode läuft bei alle[1].beitrag(), wenn alle[1] ein Jugendlicher ist?',['Die der Klasse Jugendlicher','Die der Klasse Mitglied','Beide nacheinander','Keine'],0,'Es zählt die tatsächliche Klasse des Objekts.'],['Was ist Überschreiben?',['Eine Unterklasse definiert eine geerbte Methode mit gleichem Kopf neu','Eine Methode wird gelöscht','Eine Methode wird zweimal aufgerufen','Ein Attribut wird geändert'],0,'Die Grundlage des Polymorphismus.'],['Beitrag Mitglied 10, Jugendlicher 5. Im Array liegen zwei Mitglieder und ein Jugendlicher. Wie groß ist summe?',['25.0','20.0','15.0','30.0'],0,'10 + 10 + 5 = 25.']],
c:[{t:'Schreibe den Kopf der Klasse Jugendlicher als Unterklasse von Mitglied.',re:/class\s+Jugendlicher\s+extends\s+Mitglied/,sol:'class Jugendlicher extends Mitglied {\n}',h:'extends'},{t:'Überschreibe in Jugendlicher die Methode beitrag(): Sie gibt 5.0 zurück.',re:[/public\s+double\s+beitrag\s*\(\s*\)/,/return\s+5(\.0)?\s*;/],sol:'public double beitrag() {\n  return 5.0;\n}',h:'Gleicher Kopf wie in Mitglied.'},{t:'Lege ein Mitglied-Array alle mit 2 Plätzen an und speichere in alle[1] ein neues Jugendlicher-Objekt (zwei Zeilen).',re:[/Mitglied\s*\[\s*\]\s+alle\s*=\s*new\s+Mitglied\s*\[\s*2\s*\]\s*;/,/alle\s*\[\s*1\s*\]\s*=\s*new\s+Jugendlicher\s*\(\s*\)\s*;/],sol:'Mitglied[] alle = new Mitglied[2];\nalle[1] = new Jugendlicher();',h:'Ein Mitglied-Array darf auch Unterklassen-Objekte enthalten.'}]},
proj:{n:'Projekt: von der Planung zur Dokumentation',
h:`<h3>Ein Projekt im Team</h3><p>Im Projekt entwickelt ihr im Team entweder eine <b>Datenbank</b> oder ein <b>objektorientiertes Programm</b> zu einem Szenario, z. B. ein Buchungssystem oder ein einfaches Spiel.</p>${tb(['Phase','Was passiert'],[['Planung','Projektplan: Ziel, Aufgaben, Verantwortliche, Zeitplan'],['Analyse','Szenario verstehen: Welche Daten und Abläufe gibt es?'],['Modellierung','Klassendiagramm und ggf. weitere Diagramme erstellen'],['Implementierung','Arbeitsteilig umsetzen: Datenbank mit Abfragen bzw. Programm'],['Test','Gegen die Anforderungen prüfen, mit festen Testfällen'],['Dokumentation','Modell, Entscheidungen, Bedienung und Testergebnisse festhalten']])}<h3>Tipps</h3><ul><li>Das Klassendiagramm vor dem Programmieren festlegen und gemeinsam abstimmen.</li><li>Klare Zuständigkeiten: Wer schreibt welche Klasse oder Tabelle?</li><li>Früh und oft testen, nicht erst am Ende.</li><li>Fertige Teile (Modelle, Klassen) dürfen weiterverwendet werden.</li></ul>${M('Gute Reihenfolge: planen, modellieren, umsetzen, testen, dokumentieren. Das Modell ist die gemeinsame Grundlage aller im Team.')}`,
q:[['Welche Reihenfolge ist typisch für ein Projekt?',['Planung, Modellierung, Implementierung, Test, Dokumentation','Test, Planung, Dokumentation, Implementierung','Implementierung, Planung, Test','Dokumentation, Test, Modellierung'],0,'Erst planen und modellieren, dann umsetzen und prüfen.'],['Wozu dient das Klassendiagramm im Projekt?',['Es legt Klassen, Attribute, Methoden und Beziehungen vor der Programmierung fest','Es ersetzt den Test','Es berechnet Ergebnisse','Es ist die Fehlerliste'],0,'Es ist die gemeinsame Grundlage fürs Team.'],['Wogegen testet man ein fertiges Projekt?',['Gegen die Anforderungen des Szenarios','Gegen die Meinung des Teams','Gegen ein anderes Projekt','Gar nicht'],0,'Die Anforderungen entscheiden, ob es funktioniert.']]}
};

function xev(f,m){f=f.trim();if(f[0]!='=')throw Error('Eine Formel beginnt mit =.');
